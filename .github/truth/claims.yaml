# nself-org truth claim rules (P7-TRUTH-04, Epic TRUTH D5/D6). Read by the `truth` check of nself-ci.
#
# Purpose: keep hand-typed facts out of prose. A count of plugins or commands, a current-version
#   literal, the retired phrase for licensed plugins and the old name of the Bundles repository are
#   typed by nobody: a generator writes them, or the prose says it in words.
# Kinds:   numeric-claim  a count the product owns (regex over one line)
#          version-claim  a semver literal that must equal `version` of the facts file or sit in a generated region
#          retired-term / banned-literal  the vocabulary rules below (they opt in to the exemption markers)
# Exempt a hit with one of:
#   - a generated region: <!-- BEGIN GENERATED:<id> --> ... <!-- END GENERATED:<id> --> (both markers needed)
#   - a JSX expression in .astro and .mdx files: {count}
#   - the line before it: <!-- truth: exempt <reason> -->   (no reason is itself a finding)
#   - a file whose first three lines carry GENERATED BY (correct by construction, its generator gates it)
#   - an exempt path or a repo override with a reason (see Truth-Rules in the plugins wiki).
# Scope:   prose and user-visible metadata only (D6). Go source, go.mod, go.sum, go.work, imports, YAML/JSON
#   config and manifest fields are never read by a claim rule; history (changelogs, release notes, blog, ADRs,
#   history folders, testdata, vendor, node_modules) is exempt by default.
# Use:     a repo copies this file with scripts/truth/vendor-rules.sh and lists it in its own .github/truth.yaml
#   (`include`) only after its pinned nself-ci release carries P7-TRUTH-04. org.yaml stays parseable by older
#   releases because the new kinds live only here.
# Format:  version 1, see org.yaml. Patterns are RE2 and case-insensitive.
version: 1

rules:
  # A count of plugins, commands, verbs, bundles or integrations typed by hand.
  - id: claims.counts
    kind: numeric-claim
    pattern: '(?:^|[^0-9A-Za-z.,/_§#$@–—-])[1-9][0-9,]*\+?[*_`]{0,2}(?:(?:[\s\p{Zs}\x{200B}\x{200D}\x{00AD}]|&nbsp;|&#160;)+|-)(?:(?:free|licensed|paid|official|first-party|built-in|core|top-level|public|total|additional|optional|available|cli|go|typescript|rust|python|node|js|ts)(?:(?:[\s\p{Zs}\x{200B}\x{200D}\x{00AD}]|&nbsp;|&#160;)+|-))*[*_`]{0,2}(?:(?:nself|ɳself)(?:(?:[\s\p{Zs}\x{200B}\x{200D}\x{00AD}]|&nbsp;|&#160;)+|-)(?:plugins|commands|verbs|bundles|integrations)|(?:plugins?|commands?|verbs?|bundles?|integrations?))[*_`]{0,2}(?:[^A-Za-z0-9_-]|$)'
    paths: &prose
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.mdx"
      - "**/*.astro"
      - "README*"
      - "**/*.txt"
      - "**/messages/**/*.json"
      - "**/i18n/**/*.json"
      - "**/locales/**/*.json"
      - "packaging/**/*.nuspec"
    message: do not type the count; render it from the generated facts (a GENERATED region or a {value} expression) or say it in words

  # The same count in Arabic i18n values (Western or Arabic-Indic digits before the noun).
  - id: claims.counts-ar
    kind: numeric-claim
    pattern: '[0-9٠-٩۰-۹]+\s*(?:إضافة|إضافات|أمر|أوامر|حزمة|حزم)'
    paths: *prose
    message: do not type the count in the translation; render it from the generated facts

  # A bare count in a Markdown heading: "Family (12)" is a hand-typed count with no noun to match. Only a one-word
  #   heading (or "Name — word") qualifies: a longer title such as "Health Checks (4)" counts endpoints, not products.
  - id: claims.counts-heading
    kind: numeric-claim
    pattern: '^[ \t]{0,3}#{1,6}[ \t]+[^\s()]+(?:[ \t]+[—–-][ \t]+[^\s()]+)?[ \t]*\([ \t]*[1-9][0-9,]*[ \t]*\)[ \t#]*$'
    paths: *prose
    message: do not type the count in a heading; render it from the generated facts or drop it

  # The current version of nSelf.
  - id: claims.current-version
    kind: version-claim
    pattern: '(?:[*_`]{0,2}(?:nself|ɳself)[*_`]{0,2}(?:[\s\p{Zs}]?-?cli)?(?:[\s\p{Zs}]+version)?|(?:current|latest|stable)[\s\p{Zs}]+(?:release|version))[\s\p{Zs}]*(?:is|at|[:=@])?[\s\p{Zs}]*\(?[*_`]{0,2}v?[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9a-z]+(?:\.[0-9a-z]+)*)?(?:[^0-9.]|\.(?:[^0-9]|$)|$)'
    paths: *prose
    message: do not type the current version; render it from the facts file or write "the latest release"

  # Retired vocabulary: licensed plugins ship only in Bundles or nSelf+.
  - id: vocab.pro-plugin
    kind: retired-term
    term: Pro plugin(s)
    paths: *prose
    exempt_regions: true
    exempt_paths: &history
      - {glob: "CHANGELOG*", reason: "release notes keep the names that were true when they shipped"}
      - {glob: "Changelog*", reason: "release notes keep the names that were true when they shipped"}
      - {glob: "changelog*", reason: "release notes keep the names that were true when they shipped"}
      - {glob: "RELEASE-*", reason: "release notes keep the names that were true when they shipped"}
      - {glob: "**/blog/**", reason: "dated posts keep the names that were true when they were written"}
      - {glob: "**/adr/**", reason: "decision records are history"}
      - {glob: "**/history/**", reason: "history folders keep the names that were true then"}
      - {glob: "**/testdata/**", reason: "test fixtures state anything"}
      - {glob: "**/vendor/**", reason: "vendored trees are not ours"}
    message: say "licensed plugin(s)"; licensed plugins are sold only through Bundles or nSelf+

  # Spelling variants of retired names. A space in a term already matches any run of white space (D-1261);
  #   these rules cover the forms the org.yaml terms do not: a hyphen, and the ASCII spelling of the cancelled product.
  - id: vocab.pro-plugin-hyphen
    kind: retired-term
    term: Pro-plugin(s)
    paths: *prose
    exempt_regions: true
    exempt_paths: *history
    exempt_matches:
      - regex: '[/#=]pro-plugins?'
        reason: a URL path, anchor or query value is a link target, not prose
    message: say "licensed plugin(s)"; licensed plugins are sold only through Bundles or nSelf+

  # A case-sensitive pattern (the loader prefixes (?i); (?-i:) undoes it): the lower-case spelling is the
  #   name of the folder and the repository slug, which prose may still mention.
  - id: vocab.plugins-pro-hyphen
    kind: numeric-claim
    pattern: '(?-i:\bPlugins-Pro\b)'
    paths: *prose
    exempt_paths: *history
    exempt_matches:
      - regex: '[\w.-]*/plugins-pro\b'
        reason: a repository slug or file path (vocab.bundles-repo-slug owns the slug)
      - regex: 'plugins-pro/'
        reason: a directory path
    message: say "Bundles"; licensed plugins are sold only through Bundles or nSelf+

  - id: vocab.ntv-ascii
    kind: retired-term
    term: ntv
    paths: *prose
    exempt_regions: true
    exempt_paths: *history
    exempt_matches:
      - regex: '[\w.-]*/ntv\b'
        reason: a repository slug or file path to the archived repository
      - regex: 'ntv/'
        reason: a directory path
    message: that product is cancelled; do not name it in current docs

  # The Bundles repository was renamed; GitHub redirects the old name.
  - id: vocab.bundles-repo-slug
    kind: banned-literal
    literal: nself-org/plugins-pro
    paths: *prose
    exempt_regions: true
    exempt_paths: *history
    exempt_matches:
      - regex: 'github\.com/nself-org/plugins-pro/(paid|shared|internal|pkg|sdk)/'
        reason: Go module path; renaming a module path is a breaking change and GitHub redirects the old name (debt row)
    message: the repository is nself-org/bundles; write that
