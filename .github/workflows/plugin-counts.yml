name: Plugin Counts

# registry.json, catalog.json and counts.json are projections (ADR 0009, P7-PLUG-36): the pinned cli tools/catalog generates
# them from free/*/plugin.json, releases.json and the licensed registry + bundles.json of nself-org/bundles at
# scripts/bundles.ref. This workflow is the drift gate: it regenerates them and fails when a committed file differs.
#
# Mode A (PLUGINS_PRO_CHECKOUT_TOKEN set): checks out bundles at scripts/bundles.ref and verifies all three files.
# Mode B (no token: forks, and this org until the owner provisions one): verifies registry.json only, with the bundle
#   membership and the licensed slugs read back from the committed catalog.json. catalog.json and counts.json are NOT
#   verified in Mode B; the job log says so. `bash scripts/plugin-counts.sh --check` with a bundles checkout is the full gate.

on:
  push:
    branches: [main]
    paths:
      - "registry.json"
      - "catalog.json"
      - "counts.json"
      - "releases.json"
      - "free/**/plugin.json"
      - "scripts/plugin-counts.sh"
      - "scripts/bundles.ref"
      - "scripts/cli-tools.version"
      - "scripts/catalog/**"
      - ".github/workflows/plugin-counts.yml"
  pull_request:
    branches: [main]
    paths:
      - "registry.json"
      - "catalog.json"
      - "counts.json"
      - "releases.json"
      - "free/**/plugin.json"
      - "scripts/plugin-counts.sh"
      - "scripts/bundles.ref"
      - "scripts/cli-tools.version"
      - "scripts/catalog/**"
      - ".github/workflows/plugin-counts.yml"
  repository_dispatch:
    types: [plugin-registry-updated]
  schedule:
    # 06:00 UTC nightly: catches licensed-side drift even when this repo has no qualifying push.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: plugin-counts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  projections:
    name: Projections match their generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read the pins and the token state
        # `secrets.X` cannot be referenced in a step `if:`; resolve it into an output and gate on that.
        id: pins
        env:
          HAS_TOKEN: ${{ secrets.PLUGINS_PRO_CHECKOUT_TOKEN != '' }}
        run: |
          echo "bundles-ref=$(grep -v '^#' scripts/bundles.ref | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "has-token=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'   # >= the go directive of the cli commit in scripts/cli-tools.version

      - name: Checkout bundles at scripts/bundles.ref (Mode A)
        if: steps.pins.outputs.has-token == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: nself-org/bundles
          ref: ${{ steps.pins.outputs.bundles-ref }}
          path: bundles-checkout
          persist-credentials: false
          token: ${{ secrets.PLUGINS_PRO_CHECKOUT_TOKEN }}

      - name: Mode A, registry.json + catalog.json + counts.json match the generator
        if: steps.pins.outputs.has-token == 'true'
        env:
          BUNDLES_DIR: ${{ github.workspace }}/bundles-checkout
        run: bash scripts/plugin-counts.sh --check

      - name: Mode B, registry.json matches the generator (no bundles token)
        if: steps.pins.outputs.has-token != 'true'
        run: |
          echo "::notice::Mode B: PLUGINS_PRO_CHECKOUT_TOKEN is not configured, so catalog.json and counts.json were NOT"
          echo "::notice::verified against the private bundles repo. registry.json is verified below."
          bash scripts/plugin-counts.sh --check --free-only
