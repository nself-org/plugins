name: Release Plugin Tarballs (Free)

# Builds and uploads tarballs for all 27 free plugins.
# S67-T03: Dual-publish — GitHub Releases (canonical) + Cloudflare R2 (primary CDN).
# CI hard-fails if R2 upload returns non-200. GitHub upload is always the primary
# persistence; R2 is the CDN overlay. SHA-256 verified between both mirrors.
# Triggers on tag push (v*) or manual dispatch with a tag override.
# Idempotent: re-running skips assets already present on the release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  R2_BUCKET: nself-plugin-tarballs
  R2_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}


concurrency:
  group: release-tarballs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build + Upload Free Plugin Tarballs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install jq
        run: sudo apt-get install -y jq

      # Needed since this job started compiling: a cli plugin's package has to
      # contain a binary, and one per platform. Version matches the other
      # workflows in this repo.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache: false

      - name: Build tarballs for all free plugins (max 10 parallel)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          build_plugin() {
            local plugin_dir="$1"
            local plugin_name
            plugin_name="$(basename "$plugin_dir")"
            local tarball="${DIST_DIR}/${plugin_name}-${VERSION}.tar.gz"
            local checksum_file="${tarball}.sha256"

            if [ ! -f "${plugin_dir}/plugin.json" ]; then
              echo "SKIP $plugin_name (no plugin.json)"
              return
            fi

            tar -czf "$tarball" "$plugin_dir"
            sha256=$(sha256sum "$tarball" | cut -d' ' -f1)
            printf "%s  %s\n" "$sha256" "${plugin_name}-${VERSION}.tar.gz" > "$checksum_file"
            echo "BUILT $plugin_name sha256:${sha256}"

            # A CLI plugin's package has to contain a compiled binary, and one
            # built for the user's platform. This step used to produce only the
            # source tarball above, which meant `nself install <cmd>` extracted
            # source, found no binary, and left the command dead — silently,
            # until the CLI was changed to fail on it. Every command extracted
            # under CLI-R11 was affected.
            # Which plugins need compiling: any that ships a command binary.
            # Keying on pluginType == "cli" missed the hybrids — webhooks is
            # both a delivery service and the `nself webhooks` command, so its
            # pluginType is unset while it still has a binary to build.
            # binaryName is the honest question: does this plugin provide a
            # command?
            local bin_name
            bin_name="$(jq -r '.binaryName // .implementation.binaryName // ""' "${plugin_dir}/plugin.json")"
            if [ -z "$bin_name" ]; then
              return
            fi

            # A plugin may provide more than one command; cliCommands lists them
            # and the CLI publishes one binary per entry, so every one has to be
            # built or the command it names is dead on arrival.
            local commands
            commands="$(jq -r 'if (.cliCommands // []) | length > 0 then (.cliCommands[].name) else "" end' "${plugin_dir}/plugin.json")"
            if [ -z "$commands" ]; then
              commands="${bin_name#nself-}"
            fi
            commands="$(echo "$commands" | tr '\n' ' ')"

            # The platform strings must match internal/plugin/arch.go's
            # PlatformArch(), and the asset filename must match
            # binaryPluginDownloadURL(): <name>-<version>-<platform>.tar.gz.
            # The CLI derives both; a mismatch here is an install failure there.
            for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
              local goos="${platform%%-*}"
              local goarch="${platform##*-}"
              local stage="${DIST_DIR}/stage-${plugin_name}-${platform}"
              local exe=""
              [ "$goos" = "windows" ] && exe=".exe"

              rm -rf "$stage"
              mkdir -p "$stage/${plugin_name}"
              cp -R "${plugin_dir}/." "$stage/${plugin_name}/"

              local failed=0
              # Word-split rather than a heredoc: this whole step is a YAML
              # block scalar, and a heredoc terminator has to sit at column 0,
              # which ends the block.
              for command in $commands; do
                # A plugin providing several commands keeps each under
                # cmd/<command>/; one providing a single command may put it at
                # cmd/ directly.
                local pkg="./cmd/${command}/"
                [ -d "${plugin_dir}/cmd/${command}" ] || pkg="./cmd/"

                if ! (cd "${plugin_dir}" && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                      go build -trimpath -ldflags="-s -w" \
                      -o "${GITHUB_WORKSPACE}/${stage}/${plugin_name}/nself-${command}${exe}" "$pkg"); then
                  echo "ERROR $plugin_name failed to build nself-${command} for $platform"
                  failed=1
                  break
                fi
              done

              if [ "$failed" -ne 0 ]; then
                rm -rf "$stage"
                return 1
              fi

              local ptar="${DIST_DIR}/${plugin_name}-${VERSION}-${platform}.tar.gz"
              tar -czf "$ptar" -C "$stage" "${plugin_name}"
              psha=$(sha256sum "$ptar" | cut -d' ' -f1)
              printf "%s  %s\n" "$psha" "$(basename "$ptar")" > "${ptar}.sha256"
              rm -rf "$stage"
              echo "BUILT $plugin_name $platform sha256:${psha}"
            done
          }

          export -f build_plugin
          export DIST_DIR VERSION

          # Process in batches of 10 (parallel) per risk guidance
          mapfile -t PLUGIN_DIRS < <(find free -maxdepth 1 -mindepth 1 -type d | sort)
          echo "Found ${#PLUGIN_DIRS[@]} plugin directories"

          BATCH_SIZE=10
          for ((i=0; i < ${#PLUGIN_DIRS[@]}; i += BATCH_SIZE)); do
            BATCH=("${PLUGIN_DIRS[@]:i:BATCH_SIZE}")
            pids=()
            for dir in "${BATCH[@]}"; do
              build_plugin "$dir" &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do
              wait "$pid"
            done
          done

          echo "Built artifacts:"
          ls -lh "$DIST_DIR"/*.tar.gz | wc -l
          echo "tarball_count=$(ls dist/*.tar.gz 2>/dev/null | wc -l)" >> "$GITHUB_ENV"

      - name: Verify every free plugin has its tarballs
        run: |
          # Recomputed here rather than inherited: each `run:` block is its own
          # shell, so VERSION set in the build step above is empty in this one.
          # Without this the check looked for "dist/<name>-.tar.gz" and reported
          # every plugin as missing.
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"

          # Each plugin produces one source tarball. A cli plugin produces five
          # more, one per platform, and the CLI cannot install it without the
          # one matching the user's machine — so those are checked by name
          # rather than by counting.
          fail=0
          while read -r dir; do
            name="$(basename "$dir")"
            if [ ! -f "dist/${name}-${VERSION}.tar.gz" ]; then
              echo "MISSING source tarball for $name"
              fail=1
              continue
            fi
            bname="$(jq -r '.binaryName // .implementation.binaryName // ""' "${dir}/plugin.json" 2>/dev/null)"
            [ -n "$bname" ] || continue
            for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
              if [ ! -f "dist/${name}-${VERSION}-${platform}.tar.gz" ]; then
                echo "MISSING $platform build for cli plugin $name"
                fail=1
              fi
            done
          done < <(find free -maxdepth 1 -mindepth 1 -type d | sort)

          if [ "$fail" -ne 0 ]; then
            echo "ERROR: release is incomplete; a cli plugin without a build for a platform cannot be installed on it"
            exit 1
          fi
          echo "All plugin tarballs present ($(ls dist/*.tar.gz | wc -l) archives)"

      # S49-T05: verify each tarball's embedded binary arch matches tarball filename.
      # Catches cross-compile errors where wrong GOOS/GOARCH slips into a release asset.
      # Free plugins are architecture-agnostic (TypeScript source tarballs) so this
      # step will skip all noarch/source tarballs and report PASS with 0 fails.
      - name: Verify tarball arch matches filename (S49-T05)
        run: |
          # Fetch the verify script from the CLI repo artifact cache, or use a local copy
          # if running in a monorepo context. For standalone plugins repo, inline the check.
          FAIL=0
          for tb in dist/*.tar.gz; do
            name=$(basename "$tb" .tar.gz)
            # Free plugin tarballs contain TypeScript source (no binary) — skip arch check
            echo "SKIP $name — TypeScript source tarball; no binary to inspect"
          done
          echo "Tarball arch verification complete: $FAIL failures"
          # Explicit arch verification (binary tarballs) is handled in cli/release.yml S49-T05.
          # Free plugin tarballs are source-only; arch verification is not applicable here.

      - name: Upload tarballs to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Wait up to 90s for the release to appear (handles tag-push race where
          # another workflow or the UI creates the release concurrently).
          for i in $(seq 1 18); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $TAG found"
              break
            fi
            echo "Waiting for release $TAG... ($((i*5))s elapsed)"
            sleep 5
          done

          # If still not found, create a stub (workflow_dispatch or truly missing).
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG not found after 90s — creating stub release"
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "nself Plugins $TAG" \
              --notes "Plugin tarballs for $TAG" \
              --draft=false \
              --prerelease=false
          fi

          # Upload all tarballs and checksums (clobber = idempotent)
          gh release upload "$TAG" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --repo "${{ github.repository }}" \
            --clobber

          echo "Upload complete"

      - name: Backfill checksums in registry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"

          # For each plugin tarball, update registry.json with checksum + tarball URL
          for checksum_file in dist/*.sha256; do
            tarball_name="$(basename "$checksum_file" .sha256)"
            plugin_name="${tarball_name%-${VERSION}.tar.gz}"
            sha256="$(cut -d' ' -f1 "$checksum_file")"
            tarball_url="https://github.com/${REPO}/releases/download/${TAG}/${tarball_name}"

            jq --arg name "$plugin_name" \
               --arg sha "sha256:${sha256}" \
               --arg url "$tarball_url" \
               --arg tag "$TAG" \
               '(.plugins[$name].checksums.sha256) = $sha |
                (.plugins[$name].tarballUrl) = $url |
                (.plugins[$name].releaseTag) = $tag' \
               registry.json > registry.tmp.json && mv registry.tmp.json registry.json
          done

          echo "registry.json updated"

      - name: Commit updated registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --staged --quiet || git commit -m "chore: backfill tarball checksums in registry.json for ${{ steps.tag.outputs.tag }}"
          git push || true

      - name: Verify GitHub upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ASSET_COUNT=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets | length')
          echo "Total assets on release $TAG: $ASSET_COUNT"
          # Minimum: 27 tarballs + 27 checksums = 54
          if [ "$ASSET_COUNT" -lt 54 ]; then
            echo "WARNING: Expected at least 54 assets, found $ASSET_COUNT"
          else
            echo "OK: $ASSET_COUNT assets verified on release"
          fi

      # S67-T03: Dual-publish to R2 (primary CDN)
      - name: Upload tarballs to R2 (S67-T03)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_API_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          FAIL=0

          for tarball in dist/*.tar.gz; do
            plugin_name="$(basename "$tarball" "-${VERSION}.tar.gz")"
            r2_key="plugins/${plugin_name}/${plugin_name}-${VERSION}.tar.gz"

            echo "Uploading $plugin_name to R2 key $r2_key..."
            HTTP_STATUS=$(curl -s -o /tmp/r2_upload_out.txt -w "%{http_code}" \
              -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects/${r2_key}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/gzip" \
              --data-binary "@$tarball")

            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "ERROR: R2 upload failed for $plugin_name (HTTP $HTTP_STATUS)"
              cat /tmp/r2_upload_out.txt
              FAIL=1
            else
              echo "OK: $plugin_name uploaded to R2 (HTTP $HTTP_STATUS)"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: One or more R2 uploads failed — failing CI"
            exit 1
          fi

      - name: Verify SHA-256 match between GitHub and R2 (S67-T03)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          FAIL=0

          for checksum_file in dist/*.sha256; do
            plugin_name="$(basename "$checksum_file" ".tar.gz.sha256" 2>/dev/null || basename "$checksum_file" ".sha256")"
            plugin_name="${plugin_name%-${VERSION}.tar.gz}"
            expected_sha="$(cut -d' ' -f1 "$checksum_file")"
            r2_key="plugins/${plugin_name}/${plugin_name}-${VERSION}.tar.gz"

            # Download from R2 and verify sha256
            curl -sf -o /tmp/r2_verify.tar.gz \
              "https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects/${r2_key}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || {
                echo "WARNING: Could not fetch $plugin_name from R2 for verification"
                continue
              }

            actual_sha="$(sha256sum /tmp/r2_verify.tar.gz | cut -d' ' -f1)"
            if [ "$expected_sha" != "$actual_sha" ]; then
              echo "ERROR: SHA-256 mismatch for $plugin_name"
              echo "  expected: $expected_sha"
              echo "  actual:   $actual_sha"
              FAIL=1
            else
              echo "OK: $plugin_name SHA-256 verified (${expected_sha:0:12}...)"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: SHA-256 mismatch detected — R2 mirror is corrupted"
            exit 1
          fi
