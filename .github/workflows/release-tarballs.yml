name: Release Plugin Tarballs (Free)

# One tag push (v*) or manual dispatch with a tag runs four jobs, each with only the permissions and secrets it needs:
#   build         deterministic source + per-platform tarballs (scripts/deterministic-tar.sh); no secrets, read-only token.
#   publish       uploads the missing tarballs to the GitHub Release (never --clobber), writes the .sha256 files from the PUBLISHED
#                 bytes, mirrors those bytes to Cloudflare R2 and attests build provenance for the tarballs this run built and the
#                 Release serves unchanged; records the published sha256 list the signer is held to and the sha256 list of the
#                 tarballs THIS run built (built-sha256.txt). Holds the R2 secrets, never the signing key.
#   sign          bound to the protected Environment `release-signing` (required reviewer): the only job that can read the free-tier
#                 signing key (NSELF_RELEASE_SIGNING_KEY_FREE + _ID). Downloads what is on the Release, refuses it unless it is
#                 byte-for-byte what publish recorded, and signs the source tarballs per hq PLUG D7 (scripts/release/sign.sh) and, under
#                 their own domain (contract plugins.release-signature v1.1), the platform tarballs of every signed plugin, but only
#                 tarballs this run built (scripts/release/platform-built-check.sh). The licensed key is never here. Runs the tag's own commit of sign.sh, the code the reviewer approved.
#   release-data  re-downloads the published bytes, writes sha256 + release_signature + platform_signatures into releases.json
#                 (scripts/verify-published-checksums.sh --write --signatures) and opens the release-data PR with the workflow's own
#                 GITHUB_TOKEN. No PAT, no cross-repo trigger. The projections (registry.json, catalog.json, counts.json) need the
#                 private bundles repo, which this token cannot read: the PR body tells the maintainer to regenerate them.
# Checksums and signatures always describe the bytes on the Release, never a rebuild: the Release asset is the artifact of record.
# Idempotent: re-running skips assets already present on the release. Limit (contract v1.1): the `sign` job signs a platform tarball
# only if THIS run built the exact bytes, so a full re-run whose rebuild is not byte-identical to the published platform tarballs
# (a changed runner gzip/zlib or Go toolchain) fails `sign`; a draft-first upload of platform tarballs fails it too. See Releasing.md.
# See .github/wiki/Releasing.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v1.0.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-tarballs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Free Plugin Tarballs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: '$TAG' is not a release tag (vMAJOR.MINOR.PATCH[-suffix])"
            exit 1
          fi
          # Every job checks out the commit the run started from, and the concurrency group is that ref. A manual run must therefore
          # start from the tag itself ("Use workflow from: Tag"), so the code that builds, signs and records is the tag's code.
          if [ "$GITHUB_REF" != "refs/tags/${TAG}" ]; then
            echo "ERROR: start this workflow from the tag ${TAG} (ref is ${GITHUB_REF})"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: sudo apt-get install -y jq

      # Needed since this job started compiling: a cli plugin's package has to
      # contain a binary, and one per platform. Version matches the other
      # workflows in this repo.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'   # >= the go directive of the cli commit in scripts/cli-tools.version
          cache: false

      # Binary targets come from the pinned cli tool (scripts/cli-tools.version), built once
      # here so the parallel plugin builds below share it (P7-PLUG-55).
      - name: Build the pinned manifest tool
        env:
          GOTOOLCHAIN: local
        run: |
          . scripts/conformance/lib.sh
          echo "CLI_TARGETS_TOOL=$(cli_tool manifestv2migrate)" >> "$GITHUB_ENV"

      # Decides which plugins may ship a binary. A plugin whose commands collide with a core verb or
      # another plugin, or that the normalizer refuses, is blocked; each needs an unexpired entry in
      # scripts/conformance/exceptions.yaml or this step fails. Blocked plugins go to the job summary.
      - name: Compute binary targets
        env:
          GOTOOLCHAIN: local
        run: bash scripts/release/cli-targets-gate.sh --out "${GITHUB_WORKSPACE}/cli-targets"

      - name: Build tarballs for all free plugins (max 10 parallel)
        env:
          STEP_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="${STEP_TAG}"
          VERSION="${TAG#v}"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          build_plugin() {
            local plugin_dir="$1"
            local plugin_name
            plugin_name="$(basename "$plugin_dir")"
            local tarball="${DIST_DIR}/${plugin_name}-${VERSION}.tar.gz"
            local checksum_file="${tarball}.sha256"

            if [ ! -f "${plugin_dir}/plugin.json" ]; then
              echo "SKIP $plugin_name (no plugin.json)"
              return
            fi

            # scripts/deterministic-tar.sh is the ONE tarball recipe shared with
            # scripts/build-tarballs.sh — fixed mtime/owner/sort/pax so the bytes
            # this workflow publishes always match whatever built the checksum
            # recorded in registry.json, no matter which of the two built it.
            bash scripts/deterministic-tar.sh "$tarball" "$plugin_dir"
            sha256=$(sha256sum "$tarball" | cut -d' ' -f1)
            printf "%s  %s\n" "$sha256" "${plugin_name}-${VERSION}.tar.gz" > "$checksum_file"
            echo "BUILT $plugin_name sha256:${sha256}"

            # A CLI plugin's package has to contain a compiled binary, and one
            # built for the user's platform. This step used to produce only the
            # source tarball above, which meant `nself install <cmd>` extracted
            # source, found no binary, and left the command dead — silently,
            # until the CLI was changed to fail on it. Every command extracted
            # under CLI-R11 was affected.
            # Which plugins need compiling, and which commands each ships, come from
            # scripts/release/cli-targets-gate.sh (over cli-targets.sh): the pinned cli tool applies the installer's own
            # rule to the normalized manifest (v2 `commands`, v1 `cliCommands`), so the
            # release builds exactly the binaries `nself add` will look for. Lines are
            # binary<TAB>command; a plugin with none ships no binary.
            local targets
            targets="$(cat "${GITHUB_WORKSPACE}/cli-targets/${plugin_name}.tsv" 2>/dev/null)" || { echo "ERROR $plugin_name: no computed targets"; return 1; }
            if [ -z "$targets" ]; then
              return
            fi

            # The platform strings must match internal/plugin/arch.go's
            # PlatformArch(), and the asset filename must match
            # binaryPluginDownloadURL(): <name>-<version>-<platform>.tar.gz.
            # The CLI derives both; a mismatch here is an install failure there.
            for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
              local goos="${platform%%-*}"
              local goarch="${platform##*-}"
              local stage="${DIST_DIR}/stage-${plugin_name}-${platform}"
              local exe=""
              [ "$goos" = "windows" ] && exe=".exe"

              rm -rf "$stage"
              mkdir -p "$stage/${plugin_name}"
              cp -R "${plugin_dir}/." "$stage/${plugin_name}/"

              local failed=0
              # One line per target, read with a here-string: a command can hold a
              # space (retro-gaming declares "roms list"), so it must not be word-split,
              # and a heredoc terminator would sit at column 0 and end this YAML block.
              while IFS=$'\t' read -r binary command; do
                # A plugin providing several commands keeps each under
                # cmd/<command>/; one providing a single command may put it at
                # cmd/ directly.
                local pkg="./cmd/${command}/"
                [ -d "${plugin_dir}/cmd/${command}" ] || pkg="./cmd/"

                if ! (cd "${plugin_dir}" && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
                      go build -trimpath -ldflags="-s -w" \
                      -o "${GITHUB_WORKSPACE}/${stage}/${plugin_name}/${binary}${exe}" "$pkg"); then
                  echo "ERROR $plugin_name failed to build ${binary} for $platform"
                  failed=1
                  break
                fi
              done <<< "$targets"

              if [ "$failed" -ne 0 ]; then
                rm -rf "$stage"
                return 1
              fi

              local ptar="${DIST_DIR}/${plugin_name}-${VERSION}-${platform}.tar.gz"
              # Same shared recipe as the source tarball above — the per-platform
              # binary archives had the identical mtime/ordering non-determinism
              # (compiled-binary mtimes and per-run staging-dir enumeration order).
              bash scripts/deterministic-tar.sh "$ptar" -C "$stage" "${plugin_name}"
              psha=$(sha256sum "$ptar" | cut -d' ' -f1)
              printf "%s  %s\n" "$psha" "$(basename "$ptar")" > "${ptar}.sha256"
              rm -rf "$stage"
              echo "BUILT $plugin_name $platform sha256:${psha}"
            done
          }

          export -f build_plugin
          export DIST_DIR VERSION CLI_TARGETS_TOOL

          # Process in batches of 10 (parallel) per risk guidance
          mapfile -t PLUGIN_DIRS < <(find free -maxdepth 1 -mindepth 1 -type d | sort)
          echo "Found ${#PLUGIN_DIRS[@]} plugin directories"

          BATCH_SIZE=10
          for ((i=0; i < ${#PLUGIN_DIRS[@]}; i += BATCH_SIZE)); do
            BATCH=("${PLUGIN_DIRS[@]:i:BATCH_SIZE}")
            pids=()
            for dir in "${BATCH[@]}"; do
              build_plugin "$dir" &
              pids+=($!)
            done
            for pid in "${pids[@]}"; do
              wait "$pid"
            done
          done

          echo "Built artifacts:"
          find "$DIST_DIR" -name '*.tar.gz' | wc -l
          echo "tarball_count=$(find dist -name '*.tar.gz' | wc -l)" >> "$GITHUB_ENV"

      - name: Verify every free plugin has its tarballs
        env:
          STEP_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Recomputed here rather than inherited: each `run:` block is its own
          # shell, so VERSION set in the build step above is empty in this one.
          # Without this the check looked for "dist/<name>-.tar.gz" and reported
          # every plugin as missing.
          TAG="${STEP_TAG}"
          VERSION="${TAG#v}"

          # Each plugin produces one source tarball. A cli plugin produces five
          # more, one per platform, and the CLI cannot install it without the
          # one matching the user's machine — so those are checked by name
          # rather than by counting.
          fail=0
          while read -r dir; do
            name="$(basename "$dir")"
            if [ ! -f "dist/${name}-${VERSION}.tar.gz" ]; then
              echo "MISSING source tarball for $name"
              fail=1
              continue
            fi
            [ -s "cli-targets/${name}.tsv" ] || continue
            for platform in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
              if [ ! -f "dist/${name}-${VERSION}-${platform}.tar.gz" ]; then
                echo "MISSING $platform build for cli plugin $name"
                fail=1
              fi
            done
          done < <(find free -maxdepth 1 -mindepth 1 -type d | sort)

          if [ "$fail" -ne 0 ]; then
            echo "ERROR: release is incomplete; a cli plugin without a build for a platform cannot be installed on it"
            exit 1
          fi
          echo "All plugin tarballs present ($(find dist -name '*.tar.gz' | wc -l) archives)"

      # S49-T05: verify each tarball's embedded binary arch matches tarball filename.
      # Catches cross-compile errors where wrong GOOS/GOARCH slips into a release asset.
      # Free plugins are architecture-agnostic (TypeScript source tarballs) so this
      # step will skip all noarch/source tarballs and report PASS with 0 fails.
      - name: Verify tarball arch matches filename (S49-T05)
        run: |
          # Fetch the verify script from the CLI repo artifact cache, or use a local copy
          # if running in a monorepo context. For standalone plugins repo, inline the check.
          FAIL=0
          for tb in dist/*.tar.gz; do
            name=$(basename "$tb" .tar.gz)
            # Free plugin tarballs contain TypeScript source (no binary) — skip arch check
            echo "SKIP $name — TypeScript source tarball; no binary to inspect"
          done
          echo "Tarball arch verification complete: $FAIL failures"
          # Explicit arch verification (binary tarballs) is handled in cli/release.yml S49-T05.
          # Free plugin tarballs are source-only; arch verification is not applicable here.

      - name: Hand the built tarballs to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release and R2
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Upload missing tarballs to the GitHub Release
        id: upload
        run: |
          # Wait up to 90s for the release to appear (handles tag-push race where
          # another workflow or the UI creates the release concurrently).
          for i in $(seq 1 18); do
            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release $TAG found"
              break
            fi
            echo "Waiting for release $TAG... ($((i*5))s elapsed)"
            sleep 5
          done

          # If still not found, create a stub (workflow_dispatch or truly missing).
          if ! gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG not found after 90s — creating stub release"
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "nself Plugins $TAG" \
              --notes "Plugin tarballs for $TAG" \
              --draft=false \
              --prerelease=false
          fi

          # NEVER --clobber. An asset already on the release is the artifact
          # of record: releases.json's checksums and signatures are written from
          # those exact published bytes (scripts/verify-published-checksums.sh --write).
          #
          # The release flow uploads the tarballs to a DRAFT release first, then
          # writes their hashes into releases.json, then merges, then publishes.
          # Publishing creates the tag, which triggers THIS workflow. If it then
          # rebuilt and clobbered, the bytes on the release would no longer be
          # the bytes those checksums attest to, and all free plugins would
          # fail verification at the exact moment of release. CI cannot
          # reproduce the uploaded bytes: identical tar streams still gzip
          # differently across machines (Apple gzip vs GNU gzip, and across zlib
          # versions), measured 2026-09-11.
          #
          # So: upload only what is missing. That is what "idempotent" in this
          # file's header always meant, and what --clobber never did.
          existing="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)"

          to_upload=()
          skipped=0
          for f in dist/*.tar.gz; do
            [ -e "$f" ] || continue
            if printf '%s\n' "$existing" | grep -qxF "$(basename "$f")"; then
              skipped=$((skipped + 1))
              continue
            fi
            to_upload+=("$f")
          done

          echo "Assets already on $TAG (left untouched): ${skipped}"
          if [ "${#to_upload[@]}" -eq 0 ]; then
            echo "Nothing new to upload — every built asset is already published."
          else
            echo "Uploading ${#to_upload[@]} missing asset(s)."
            gh release upload "$TAG" "${to_upload[@]}" \
              --repo "${GITHUB_REPOSITORY}"
          fi

          echo "uploaded_count=${#to_upload[@]}" >> "$GITHUB_OUTPUT"
          echo "Upload complete"

      # Everything after this point works from the bytes the Release serves, not from dist/.
      - name: Re-download the published bytes
        run: |
          mkdir -p published
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir published --pattern '*.tar.gz'
          fail=0
          mkdir -p attest
          : > not-attested.txt
          for f in dist/*.tar.gz; do
            name="$(basename "$f")"
            if [ ! -f "published/${name}" ]; then
              echo "ERROR: ${name} is not on release ${TAG} after the upload"
              fail=1
            elif cmp -s "$f" "published/${name}"; then
              cp "$f" "attest/${name}"
            else
              # An earlier upload of this tag wins (never --clobber); everything below describes it, but this run built other bytes,
              # so it cannot vouch for where they came from: they get no provenance attestation.
              echo "NOTE: ${name} on the release differs from this run's rebuild; the published bytes are used, not attested"
              echo "$name" >> not-attested.txt
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Published tarballs: $(find published -name '*.tar.gz' | wc -l); attestable (built by this run): $(find attest -name '*.tar.gz' | wc -l)"

      # What the reviewer of the `sign` job approves: the sha256 of every tarball the Release serves right now. `sign` refuses any
      # tarball that is not in this list with this hash, so an asset swapped while the approval waits is never signed.
      #
      # built-sha256.txt is the shorter list the platform signer is held to: the tarballs this run built that the Release serves
      # unchanged (attest/). A platform tarball is signed only if its "<sha256>  <name>" line is in it, so a binary uploaded to the
      # Release by anyone else during the approval wait is published but never signed.
      - name: Record the published checksums
        run: |
          (cd published && sha256sum -- *.tar.gz) > published-sha256.txt
          : > built-sha256.txt
          if compgen -G 'attest/*.tar.gz' >/dev/null; then
            (cd attest && sha256sum -- *.tar.gz) > built-sha256.txt
          fi
          {
            echo "### Published tarballs for ${TAG}"
            echo
            echo "$(wc -l < published-sha256.txt | tr -d ' ') tarball(s) on the Release; $(wc -l < not-attested.txt | tr -d ' ') differ from this run's rebuild (published, not attested); $(wc -l < built-sha256.txt | tr -d ' ') built by this run (source and platform tarballs); only those platform tarballs are eligible for platform signing."
            echo
            echo '```'
            cat published-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Provenance only for bytes this run built and the Release serves unchanged.
      - name: Attest build provenance
        if: hashFiles('attest/*.tar.gz') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: attest/*.tar.gz

      - name: Hand the published checksums to the sign job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-sha256
          path: |
            published-sha256.txt
            built-sha256.txt
          retention-days: 30
          if-no-files-found: error

      # The .sha256 files describe the bytes on the Release, so they are computed from published/ and only the missing ones are
      # uploaded; a checksum file from this run's rebuild would not match an older asset of record.
      - name: Publish checksum files from the published bytes
        run: |
          mkdir -p checksums on-release
          existing="$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$existing" | grep -q '\.sha256$'; then
            gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir on-release --pattern '*.sha256'
          fi
          to_upload=()
          fail=0
          for f in published/*.tar.gz; do
            name="$(basename "$f")"
            printf "%s  %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$name" > "checksums/${name}.sha256"
            if [ -f "on-release/${name}.sha256" ]; then
              # Never overwritten; a stale one is a defect to resolve by hand, not to hide.
              cmp -s "checksums/${name}.sha256" "on-release/${name}.sha256" || { echo "ERROR: ${name}.sha256 on the release does not match the published ${name}"; fail=1; }
            else
              to_upload+=("checksums/${name}.sha256")
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          if [ "${#to_upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${to_upload[@]}" --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Verify GitHub upload
        run: |
          ASSET_COUNT=$(gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets | length')
          echo "Total assets on release $TAG: $ASSET_COUNT"
          # Every tarball this run built and its .sha256 must be on the release.
          want=$(( $(find dist -name '*.tar.gz' | wc -l) * 2 ))
          if [ "$ASSET_COUNT" -lt "$want" ]; then
            echo "ERROR: expected at least $want assets, found $ASSET_COUNT"
            exit 1
          fi
          echo "OK: $ASSET_COUNT assets verified on release"

      # S67-T03: Dual-publish to R2 (CDN). The mirror carries the published bytes, so a pre-existing
      # release asset and its R2 copy can never disagree. Every object is read back and its sha256
      # compared; a failed upload or an object that cannot be read back fails the job.
      - name: Mirror the published tarballs to R2 and verify them (S67-T03)
        env:
          R2_BUCKET: nself-plugin-tarballs
          R2_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_R2_API_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          FAIL=0

          for tarball in published/*.tar.gz; do
            file="$(basename "$tarball")"
            # <slug>-<version>.tar.gz and <slug>-<version>-<platform>.tar.gz both live under plugins/<slug>/.
            plugin_name="${file%%-"${VERSION}"*}"
            r2_key="plugins/${plugin_name}/${file}"
            url="https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects/${r2_key}"

            HTTP_STATUS=$(curl -s -o r2_upload_out.txt -w "%{http_code}" \
              -X PUT "$url" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/gzip" \
              --data-binary "@$tarball")
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "ERROR: R2 upload failed for $file (HTTP $HTTP_STATUS)"
              cat r2_upload_out.txt
              FAIL=1
              continue
            fi

            expected_sha="$(sha256sum "$tarball" | cut -d' ' -f1)"
            if ! curl -sf -o r2_verify.tar.gz "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"; then
              echo "ERROR: could not read $file back from R2 to verify it"
              FAIL=1
              continue
            fi
            actual_sha="$(sha256sum r2_verify.tar.gz | cut -d' ' -f1)"
            if [ "$expected_sha" != "$actual_sha" ]; then
              echo "ERROR: SHA-256 mismatch for $file"
              echo "  published: $expected_sha"
              echo "  r2:        $actual_sha"
              FAIL=1
            else
              echo "OK: $file mirrored and verified (${expected_sha:0:12}...)"
            fi
          done
          rm -f r2_upload_out.txt r2_verify.tar.gz

          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: the R2 mirror is incomplete or corrupted — failing CI"
            exit 1
          fi

  # The only job bound to the `release-signing` Environment (required reviewer, set up by the owner in P7-PROD-59). It reads the
  # free-tier signing key and nothing else secret, has no write access to the repository and no R2 access.
  sign:
    name: Sign (release-signing)
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # The workflow's own commit: the sign.sh that touches the key is the one the reviewer approved, whatever the tag points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-sha256
          path: expected

      # What the Release serves is the artifact of record, so that is what gets signed (no artifact hand-off to expire while the
      # reviewer decides). But only the bytes the publish job recorded: an asset replaced while this job waited for approval is refused.
      - name: Download the published tarballs and compare them with what publish recorded
        run: |
          mkdir -p published
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir published --pattern '*.tar.gz'
          set -o pipefail
          (cd published && sha256sum -- *.tar.gz) | sort > actual-sha256.txt
          sort expected/published-sha256.txt | diff - actual-sha256.txt || { echo "ERROR: the Release no longer serves the bytes the publish job recorded; nothing is signed"; exit 1; }

      # Source tarballs (<slug>-<version>.tar.gz): the signed message names slug, version and the source tarball's sha256.
      # Platform tarballs (<slug>-<version>-<platform>.tar.gz) of every plugin signed here are signed under their own domain
      # (contract v1.1): the message names slug, version, platform and that tarball's sha256. They are signed only if
      # platform-built-check.sh confirms this run built the exact bytes; otherwise the job fails and signs nothing more.
      - name: Sign the published source and platform tarballs (hq PLUG D7, contract v1.1)
        env:
          NSELF_RELEASE_SIGNING_KEY_FREE: ${{ secrets.NSELF_RELEASE_SIGNING_KEY_FREE }}
          NSELF_RELEASE_SIGNING_KEY_FREE_ID: ${{ secrets.NSELF_RELEASE_SIGNING_KEY_FREE_ID }}
        run: |
          set +x
          VERSION="${TAG#v}"
          if [ -z "$NSELF_RELEASE_SIGNING_KEY_FREE" ] || [ -z "$NSELF_RELEASE_SIGNING_KEY_FREE_ID" ]; then
            echo "ERROR: the release-signing Environment has no free-tier signing key and key id (P7-PROD-59 creates them)"
            exit 1
          fi
          : > signatures.ndjson
          count=0
          for f in published/*-"${VERSION}".tar.gz; do
            [ -e "$f" ] || continue
            slug="$(basename "$f" "-${VERSION}.tar.gz")"
            # A tarball named for this tag whose manifest declares another version is not a release of that plugin: leave it unsigned.
            if [ "$(jq -r '.version // ""' "free/${slug}/plugin.json" 2>/dev/null)" != "$VERSION" ]; then
              echo "SKIP ${slug}: manifest version is not ${VERSION}"
              continue
            fi
            sig="$(bash scripts/release/sign.sh "$slug" "$VERSION" "$f")"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            jq -nc --arg s "$slug" --arg sha "$sha" --argjson sig "$sig" '{($s): {sha256: $sha, release_signature: $sig}}' >> signatures.ndjson
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no source tarball to sign in published/"
            exit 1
          fi
          jq -sS 'add' signatures.ndjson > signatures.json
          rm -f signatures.ndjson
          echo "Signed ${count} source tarball(s)"

          # Platform tarballs of the signed plugins only (a plugin left unsigned above gets none). Every one must be a tarball this
          # run built: the Release never takes a clobbering upload, so an asset put there by anyone else during the approval wait
          # is already published, and signing it would hand it the official platform signature.
          platforms="darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64"
          bin_stage="$(mktemp -d)"
          for slug in $(jq -r 'keys[]' signatures.json); do
            for platform in $platforms; do
              f="published/${slug}-${VERSION}-${platform}.tar.gz"
              [ -e "$f" ] || continue
              ln -s "${PWD}/${f}" "$bin_stage/"
            done
          done
          if [ -z "$(ls -A "$bin_stage")" ]; then
            echo "No platform tarball for the signed plugins; nothing to sign beyond the source tarballs"
          elif ! bash scripts/release/platform-built-check.sh expected/built-sha256.txt "$bin_stage"; then
            echo "ERROR: a platform tarball on the Release was not built by this run; nothing is signed. Delete that platform tarball AND its .sha256 from the Release, then re-run the release (Releasing.md)."
            exit 1
          fi
          : > platform-signatures.ndjson
          pcount=0
          for slug in $(jq -r 'keys[]' signatures.json); do
            for platform in $platforms; do
              f="published/${slug}-${VERSION}-${platform}.tar.gz"
              [ -e "$f" ] || continue
              psig="$(bash scripts/release/sign.sh "$slug" "$VERSION" "$f" "$platform")"
              psha="$(sha256sum "$f" | cut -d' ' -f1)"
              jq -nc --arg s "$slug" --arg p "$platform" --arg sha "$psha" --argjson sig "$psig" \
                '{($s): {platform_signatures: {($p): ($sig + {sha256: $sha})}}}' >> platform-signatures.ndjson
              pcount=$((pcount + 1))
            done
          done
          jq -sS 'reduce .[1:][] as $r (.[0]; . * $r)' signatures.json platform-signatures.ndjson > signatures.merged.json
          mv signatures.merged.json signatures.json
          rm -f platform-signatures.ndjson
          echo "Signed ${pcount} platform tarball(s)"

          # Once a release public key is committed (P7-PLUG-69 commits the first), only a committed key may have signed.
          # The stage mirrors releases.json: platform_checksums from the covered sha256, platform_signatures without it.
          stage="$(mktemp -d)"
          jq --arg v "$VERSION" 'map_values(. + {version: $v}
              + (if has("platform_signatures") then {platform_checksums: (.platform_signatures | map_values(.sha256)),
                                                      platform_signatures: (.platform_signatures | map_values(del(.sha256)))} else {} end))
            | {releases: .}' signatures.json > "$stage/releases.json"
          for slug in $(jq -r 'keys[]' signatures.json); do
            ln -s "${PWD}/published/${slug}-${VERSION}.tar.gz" "$stage/"
          done
          for f in "$bin_stage"/*.tar.gz; do
            [ -e "$f" ] || continue
            ln -s "$(readlink "$f")" "$stage/"
          done
          pinned=0
          ok=0
          for k in scripts/release/keys/plugins-release-free-*.pub; do
            [ -e "$k" ] || continue
            pinned=1
            if bash scripts/release/verify-signatures.sh --pub "$k" "$stage" >/dev/null 2>&1; then ok=1; fi
          done
          if [ "$pinned" -ne 1 ]; then
            echo "ERROR: scripts/release/keys/ holds no release public key; commit it (P7-PLUG-69) before a real tag run, so the signatures can be checked against it"
            exit 1
          fi
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: the signatures do not verify against any committed release key in scripts/release/keys/; the signing secret is not a pinned key"
            exit 1
          fi

      - name: Hand the signatures to the release-data job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: signatures.json
          retention-days: 7
          if-no-files-found: error

  # Writes the release data from the bytes on the Release and opens the PR with the workflow token. A PR opened with GITHUB_TOKEN
  # does not start other workflows by itself; Releasing.md says how the maintainer gets its required checks to run.
  release-data:
    name: Open the release-data PR
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: signed

      - name: Write releases.json from the published bytes
        run: |
          bash scripts/verify-published-checksums.sh --write --signatures signed/signatures.json "$TAG"

      - name: Open the release-data PR
        run: |
          branch="release-data/${TAG}"
          if git diff --quiet; then
            echo "releases.json already holds ${TAG}; nothing to open"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            # A maintainer may already have pushed the regenerated projections to it; a re-run must not wipe that.
            echo "::notice::${branch} already exists; left untouched. Delete it and re-run to regenerate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add releases.json
          git commit -m "chore(release): release data for ${TAG}"
          # The empty expected value makes the push fail if the branch appeared since the check above.
          git push --force-with-lease="refs/heads/${branch}:" origin "HEAD:refs/heads/${branch}"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            {
              echo "Written by the release workflow from the bytes published on ${TAG}: sha256 and release_signature per plugin. Review the diff against the Release assets; do not edit by hand."
              echo
              echo "Before merging: registry.json, catalog.json and counts.json are projections of releases.json that need the private bundles repo, which the workflow token cannot read."
              echo "Run bash scripts/plugin-counts.sh on a maintainer machine with the bundles checkout and push the result to this branch; the registry gate stays red until then."
              echo "Pushing also starts the required checks, which a PR opened with the workflow token does not."
            } > pr-body.md
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
              --title "chore(release): release data for ${TAG}" \
              --body-file pr-body.md
          fi
