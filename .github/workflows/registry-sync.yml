name: Registry KV sync

# The plugins.nself.org worker serves the catalog from the repo, but its KV copy (stats.lastSync) only moves when
# POST /api/sync runs. Nothing called it after 2026-06-23, which kept drill-catalog-freshness red (D-0051). A daily call
# keeps lastSync under the drill's 36 hour limit.
# A merge to main that changes a projection the worker serves (catalog.json carries the bundle membership that /bundles.json
# is built from, registry.json the plugin versions) also calls it, so drill-catalog-freshness is not red between that merge
# and the next daily run (D-1480). Same token as the daily run; scripts/ci/tests/test_registry_sync_triggers.py holds the paths.

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'catalog.json'
      - 'registry.json'
      - 'counts.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  verify-live-downloads:
    name: Verify public free plugin downloads
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check live registry against served bytes (read-only)
        run: python3 scripts/ci/verify_registry_downloads.py

  sync:
    name: POST /api/sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Refresh the worker caches
        env:
          CLOUDFLARE_WORKER_SYNC_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_WORKER_SYNC_TOKEN" ]; then
            echo "CLOUDFLARE_WORKER_SYNC_TOKEN is not set" >&2
            exit 1
          fi
          response=$(curl -sS --fail-with-body --max-time 60 -X POST "https://plugins.nself.org/api/sync" \
            -H "Authorization: Bearer $CLOUDFLARE_WORKER_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"${GITHUB_REF}\", \"sha\": \"${GITHUB_SHA}\"}")
          echo "$response" | jq '{success, message, freeCount, proCount, catalogSynced, timestamp}'
          echo "$response" | jq -e '.success == true and .catalogSynced == true' >/dev/null
      - name: Verify refreshed downloads against candidate registry
        run: python3 scripts/ci/verify_registry_downloads.py --registry registry.json
