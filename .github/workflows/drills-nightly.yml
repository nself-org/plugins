# Nightly catalogue freshness drills (P7-PLUG-13), instantiated from free/ci/templates/scheduled-pipeline.yml.
#
# Purpose: run the `drills` pipeline of .nself/ci.yaml every night. Its jobs are the directories of scripts/drill; the
#   one this file exists for is catalog-freshness: the projections plugins.nself.org serves (catalog.json,
#   registry.json, bundles.json) must equal the ones on main, and the worker's /stats lastSync must be under 36 h old
#   (Constitution 8.3: a silent job needs a staleness alert; the worker KV was stale for months, D-0051).
# Red is the alert. A fetch that fails or a stale lastSync fails the drill (Constitution 8.4), and the run stays red until
#   the worker deploy (P7-PLUG-35) refreshes the served data. A throwaway runner keeps no run store, so a schedule that
#   stops firing shows as a missing run here, not as an `overdue` report.
# The pin: CI_VERSION, CI_RELEASE_URL and CI_RELEASE_SHA256 take the `ci-release` handoff (tag plus sha256 of each
#   platform tarball) of P7-PLUG-69, the first plugins release that holds `--pipeline` and drill jobs (Epic P7-CI D34).
#   Moving the pin means changing these three values here, in nself-ci.yml and in nself-ci-source.yml in one commit. If a
#   value is ever empty again the first step fails with a clear message instead of running an unpinned binary.
#   See also scripts/drill/README.md and .github/wiki/Catalog.md (Freshness drill).

name: drills-nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read       # main-status-audit reads the check runs of main's commits
  statuses: read     # ... and their commit statuses

concurrency:
  group: drills-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  PIPELINE: drills        # the pipeline name in .nself/ci.yaml
  CI_VERSION: "1.2.11"    # the pinned release (shown in the summary); same pin as nself-ci.yml
  CI_RELEASE_URL: "https://github.com/nself-org/plugins/releases/download/v1.2.11/ci-1.2.11-linux-amd64.tar.gz"
  CI_RELEASE_SHA256: "0ca65f839b007764f70ba9e8e719aee88f336efb74b932297b2b9097cbdd0016"
  NSELF_V15: "1"          # the plugin binary does not follow the cli flip; kept until v1.6
  GVISOR_RELEASE: "20261012.0"   # same pin and checksum as ci-isolation-linux.yml
  GVISOR_SHA512: "9606445eed5aedfcf05310e7ccef61d994089914c6622fc82624c24d2b18db1b2210f40e40a7be27b8b7772859de7d95c501b4eba66423053c960bf671377c5e"
  TRUST04_TEST_IMAGE: "alpine:3.19"

jobs:
  pipeline:
    name: ${{ github.workflow }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check the pin
        run: |
          for v in PIPELINE CI_VERSION CI_RELEASE_URL CI_RELEASE_SHA256; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set in this workflow's env block"
              exit 1
            fi
          done
          case "$CI_RELEASE_URL" in https://*) ;; *) echo "::error::CI_RELEASE_URL must be an https URL"; exit 1 ;; esac

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The drills run Go (security-suite, truth-sweep, scenarios), docker and podman (isolation-levels) and
      # gVisor's runsc registered with docker; the steps are the ones ci-isolation-linux.yml runs.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: free/ci/go.mod
          cache-dependency-path: free/ci/go.sum

      - name: Container runtimes
        run: |
          set -euo pipefail
          docker info --format '{{.ServerVersion}} rootless={{.SecurityOptions}}'
          if ! command -v podman >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq podman
          fi
          podman info --format '{{.Version.Version}} rootless={{.Host.Security.Rootless}}'
          docker pull "$TRUST04_TEST_IMAGE"

      - name: Install gVisor runsc
        run: |
          set -euo pipefail
          base="https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64"
          curl -fsSL -o "$RUNNER_TEMP/gvisor.tar.bz2" "$base/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum -c -
          sudo tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C /usr/local/bin
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | tee "$RUNNER_TEMP/runtimes.json"
          grep -q runsc "$RUNNER_TEMP/runtimes.json"

      - name: Install the pinned nself-ci
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/nself-ci.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --output "$tarball" "$CI_RELEASE_URL"
          echo "$CI_RELEASE_SHA256  $tarball" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/nself-ci"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/nself-ci"
          bin="$(find "$RUNNER_TEMP/nself-ci" -type f -name nself-ci | head -n 1)"
          if [ -z "$bin" ]; then
            echo "::error::the release tarball holds no nself-ci binary"
            exit 1
          fi
          chmod +x "$bin"
          echo "NSELF_CI_BIN=$bin" >> "$GITHUB_ENV"
          # The drills look the binary up by name (main-status-audit), and the engine's job environment does not carry NSELF_CI_BIN.
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"

      - name: Install nft (scenario 1 cuts the network)
        run: command -v nft >/dev/null || (sudo -n apt-get update -qq && sudo -n apt-get install -y -qq nftables)

      - name: Run the pipeline
        env:
          GH_TOKEN: ${{ github.token }}  # read-only; the drills that call gh (main-status-audit, truth-sweep) take it from here
          NSELF_CI_HOME: ${{ runner.temp }}/ci-home  # a known run store, so the job logs can be kept below
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          status=0
          "$NSELF_CI_BIN" --no-status --pipeline "$PIPELINE" --json > "$RUNNER_TEMP/evidence/$PIPELINE.json" || status=$?
          {
            echo "### $PIPELINE (nself-ci $CI_VERSION)"
            echo "exit code: $status"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/ci-home/logs/
          if-no-files-found: warn
          retention-days: 30
