# Pinned multi-arch toolchain image of `nself ci --container` (P7-CI-43, ADR 0030).
# image-build: every pull request that touches the image builds both platforms and pushes nothing.
# publish: workflow_dispatch only, by digest, with the org secret DOCKERHUB_TOKEN. It fails (never
# skips) when the secret is empty. The first publish and the digest pin are P7-CI-61 (owner-named).
name: ci-toolchain-image

on:
  pull_request:
    paths:
      - "free/ci/toolchain/**"
      - ".github/workflows/ci-toolchain-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-toolchain-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-build:
    name: image-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: free/ci/toolchain
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require DOCKERHUB_TOKEN
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN" || { echo 'DOCKERHUB_TOKEN missing'; exit 1; }
      - name: Publish only from main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main || { echo "publish runs from refs/heads/main, not $REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: free/ci/toolchain
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=docker.io/nself/ci-toolchain,push-by-digest=true,name-canonical=true,push=true
      - name: Print the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST" || { echo 'no digest returned'; exit 1; }
          echo "docker.io/nself/ci-toolchain@${DIGEST}"
          echo "docker.io/nself/ci-toolchain@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
