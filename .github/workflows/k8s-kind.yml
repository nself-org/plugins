name: k8s-kind

# Proves `nself k8s values|install|upgrade` on a kind cluster (P7-DEPL-05, EPIC D7) and the
# day-2 cycle `backup`, delete the namespace, install again, `restore --yes` (P7-DEPL-08, EPIC D8).
# The job runs free/k8s/tests/kind/run.sh, the same script a developer runs locally:
# it builds nself from nself-org/cli at cli_ref, lays the branch's k8s plugin out as
# `nself add` does, generates the chart values, installs the embedded chart, waits for
# every pod to be Ready and answers a GraphQL query. It never calls helm directly. It then
# checks the machine contract (P7-DEPL-07): `nself help --json k8s` lists the subtree with
# canon plugin, `nself k8s status --json` is a v1 envelope, `nself k8s uninstall` without
# --yes exits 4 and leaves the release, and `uninstall --yes --json` removes it.
# Legs: source=branch with leg=install (the proof above) or leg=day2: seed three tables with
# 1,000 rows, `nself k8s backup --json` (the envelope names the dump and every table's count),
# delete the namespace, install again, `restore` without --yes exits 4, `restore --yes --json`
# verifies the fingerprints, and an independent psql check agrees. A pull request runs both legs;
# workflow_dispatch runs the leg input. source=registry (P7-DEPL-31, run by workflow_dispatch only) starts
# from an empty plugin dir, runs `nself add k8s` against the registry the cli reads, and asserts
# the installed manifest is the served row at the checkout's version and that `nself help --json k8s`
# lists values and backup, before it runs the same steps against the installed plugin. It fails
# naming the served version and the missing commands while the served k8s predates the chart, and
# never falls back to a branch build. The offline registry-test.sh (no cluster) runs on every pull
# request. The unit step also runs the postgres integration test (docker is on the runner).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where the k8s plugin comes from (branch: built from this checkout; registry: nself add k8s from the served registry)"
        type: choice
        options: [branch, registry]
        default: branch
      cli_ref:
        description: "nself-org/cli commit to build (empty: CLI_REF_DEFAULT in free/k8s/tests/kind/tools.env)"
        type: string
        default: ""
      leg:
        description: "Which proof to run"
        type: choice
        options: [install, day2]
        default: install
  pull_request:
    paths:
      - "free/k8s/**"
      - ".github/workflows/k8s-kind.yml"

permissions:
  contents: read

jobs:
  kind:
    name: kind (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: k8s-kind-${{ github.ref }}-${{ matrix.leg }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch runs the one leg picked in the input; a pull request runs both.
        leg: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.leg)) || fromJSON('["install","day2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: free/k8s/go.mod
          cache: false

      - name: Registry leg selection tests (offline)
        run: bash free/k8s/tests/kind/registry-test.sh

      - name: Plugin unit tests
        working-directory: free/k8s
        env:
          # Starts a throwaway postgres:16 container (internal/ops/pg_integration_test.go).
          NSELF_K8S_PG_TEST: "1"
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: kind ${{ matrix.leg }} proof
        env:
          SOURCE: ${{ inputs.source || 'branch' }}
          LEG: ${{ matrix.leg }}
          CLI_REF: ${{ inputs.cli_ref }}
          # setup-go pins GOTOOLCHAIN=local; the cli build needs a newer Go than the plugin module.
          GOTOOLCHAIN_CLI: auto
        run: bash free/k8s/tests/kind/run.sh
