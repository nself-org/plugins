name: nself-ci

# Dogfood workflow for the nself-ci local-gate plugin (free/ci) — the FIRST of the
# 13 nself-org repos to wire this in (owner audit 2026-09-11 found ZERO adoption,
# not even in this repo, which owns the source). See .github/wiki/guides/nself-ci-gate.md
# for the pattern the other 12 repos should copy, and that doc's "Known gaps" section
# for what this gate does NOT currently check on this repo (it supplements
# validate.yml/build-test.yml/gitleaks.yml here — it does not replace them).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  nself-ci:
    name: nself-ci gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      # This repo has no pnpm-workspace.yaml (see gate_workspace.go), so the
      # node gate runs lint/typecheck/test/build against each nested
      # package.json directly, one directory at a time. Nothing installs
      # those directories' own dependencies for it — install them here so
      # the check reflects the packages' real declared dependencies instead
      # of failing on modules that were simply never fetched.
      - name: Install Node dependencies for nested packages
        run: |
          pnpm install --frozen-lockfile --dir .workers/plugins-registry
          pnpm install --frozen-lockfile --dir free/feature-flags/sdk-ts
          pnpm install --frozen-lockfile --dir shared
          pnpm install --frozen-lockfile --dir free/file-processing/ts
          pnpm install --frozen-lockfile --dir free/media-processing/ts

      # free/file-processing/ts and free/media-processing/ts both depend on
      # @nself/plugin-utils via a "file:../../../shared" path dependency.
      # pnpm links the directory but never runs its build script, so
      # shared/dist (what "@nself/plugin-utils"'s main/types fields point
      # at) does not exist yet — build it before the two plugins are
      # typechecked/built against it.
      - name: Build shared plugin-utils package
        run: pnpm --dir shared run build

      - name: Run nself ci gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/nself-ci.sh .
