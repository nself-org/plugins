name: nself-ci

# Dogfood workflow for the nself-ci local-gate plugin (free/ci) — the FIRST of the
# 13 nself-org repos to wire this in (owner audit 2026-09-11 found ZERO adoption,
# not even in this repo, which owns the source). See .github/wiki/guides/nself-ci-gate.md
# for the pattern the other 12 repos should copy, and that doc's "Known gaps" section
# for what this gate does NOT currently check on this repo (it supplements
# validate.yml/build-test.yml/gitleaks.yml here — it does not replace them).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  nself-ci:
    name: nself-ci gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      - name: Run nself ci gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/nself-ci.sh .
