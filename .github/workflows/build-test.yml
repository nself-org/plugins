name: Go Build & Test (free plugins)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-build-test:
    name: Build & test all Go plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # testdata/ holds fixtures (e.g. the CI planner's polyglot repo), not plugins.
    # This finds every go.mod anywhere under free/, not just free/*/go.mod.
    # The depth-1 glob it replaced silently skipped 13 plugins that keep their
    # module one level down (free/<name>/go/go.mod), a layout the P6 migration
    # brought in with the plugins reclassified from plugins-pro. Those 13 were
    # never built, vetted or tested by this gate. Plugins with genuinely no Go
    # code (forgejo: docker compose plus shell) simply have no go.mod and are
    # skipped by construction, which remains correct.
    #
    # `monitoring` DOES have a go.mod, cmd/main.go and internal/render/, and
    # IS built/tested here despite registry.json's `language` field saying
    # "config" for it — that field is stale/wrong, not a signal to skip it.
    # registry-check.yml separately validates monitoring's non-Go config
    # assets (docker-compose.plugin.yml, hasura/, nginx/), so it gets both
    # kinds of coverage. Do not "fix" this loop by excluding monitoring.
    steps:
      # The check name above is REQUIRED on main, so this job reports on every pull request and never
      # leaves it pending. It narrows the work, not the report: a pull request builds only the plugins it
      # touched (each plugin module is self-contained, replace targets live inside its own directory);
      # push, dispatch and a change to this gate build all of them. See .github/wiki/CI-Scope.md.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Scope (which plugins this run covers)
        id: scope
        run: bash .github/scripts/changed-scope.sh --outside-free-global --global '^\.github/workflows/build-test\.yml$'
      - uses: actions/setup-go@v7
        if: steps.scope.outputs.all == 'true' || steps.scope.outputs.plugin_count != '0'
        with:
          go-version: '1.26.4'
      - name: Build, vet, and test every Go plugin
        env:
          SCOPE_ALL: ${{ steps.scope.outputs.all }}
          SCOPE_PLUGINS: ${{ steps.scope.outputs.plugins }}
        run: |
          failed=0
          roots=free
          if [ "$SCOPE_ALL" != "true" ]; then
            if [ -z "$SCOPE_PLUGINS" ]; then
              echo "No plugin changed in this pull request: nothing to build (the full run happens on push to main)."
              exit 0
            fi
            roots=$(echo "$SCOPE_PLUGINS" | tr ',' '\n' | sed 's#^#free/#' | tr '\n' ' ')
            echo "Pull request scope: $roots"
          fi
          while IFS= read -r gomod; do
            d="$(dirname "$gomod")"
            if [ -f "$d/go.mod" ]; then
              echo "=== $d ==="
              # -o /dev/null because a plugin whose main package sits at cmd/
              # cannot be built with a bare `go build ./...`: go names the
              # output after the package directory and refuses to overwrite the
              # cmd/ directory itself ("build output \"cmd\" already exists and
              # is a directory"). CI only needs to know it compiles.
              ( cd "$d" && go build -o /dev/null ./... && go vet ./... && go test ./... ) || { echo "FAIL: $d"; failed=1; }
            fi
          done < <(find $roots -name go.mod -not -path '*/vendor/*' -not -path '*/testdata/*' | sort)
          exit $failed
