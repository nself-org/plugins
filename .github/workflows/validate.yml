name: Validate Plugins

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/wiki/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '.github/wiki/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to main must finish its full gate (the build shards take a while); only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # What a pull request can break decides which legs below run (table: .github/wiki/CI-Scope.md). Push to main,
  # dispatch and a change to this workflow or to the conformance machinery run every leg. A skipped job needs no runner.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      meta: ${{ steps.scope.outputs.meta }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Scope tests
        run: bash .github/scripts/changed-scope_test.sh

      # meta: manifests, READMEs and the registry. Conformance reads too many repo-root inputs (scripts, tests,
      # schemas, images.d, the plugin trees) to scope by path, so it runs on every pull request.
      # build: the inputs every plugin's docker build shares (a change there rebuilds all plugins).
      - name: Scope
        id: scope
        run: |
          bash .github/scripts/changed-scope.sh \
            --global '^\.github/workflows/validate\.yml$' \
            --flag 'meta=^(free/[^/]+/(plugin\.json|README\.md)|registry\.json|releases\.json|shared/validate-registry\.sh)$' \
            --flag 'build=^(scripts/(conformance|deterministic-tar\.sh|cli-tools\.version)|images\.d/)'

      - name: Build matrix
        id: matrix
        env:
          ALL: ${{ steps.scope.outputs.all }}
          BUILD: ${{ steps.scope.outputs.build }}
          PLUGINS: ${{ steps.scope.outputs.plugins }}
          COUNT: ${{ steps.scope.outputs.plugin_count }}
        run: |
          full='[{"label":"shard 1/4","args":"--all --shard 1/4"},{"label":"shard 2/4","args":"--all --shard 2/4"},{"label":"shard 3/4","args":"--all --shard 3/4"},{"label":"shard 4/4","args":"--all --shard 4/4"}]'
          if [ "$ALL" = true ] || [ "$BUILD" = true ] || [ "$COUNT" -gt 12 ]; then m=$full
          elif [ "$COUNT" -gt 0 ]; then m=$(jq -nc --arg p "$PLUGINS" '[{label: "changed plugins", args: ("--plugins " + $p)}]')
          else m='[]'; fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "build matrix: $m"

  schema-validation:
    name: Plugin Schema Validation
    needs: scope
    if: needs.scope.outputs.meta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Validate plugin.json files
        run: |
          errors=0

          # Required top-level fields in every plugin.json
          # `port` is deliberately not in this list. A CLI plugin provides a
          # command and runs no HTTP server, so it has no port (scripts/conformance/ports.sh,
          # run by check.sh, owns port uniqueness and treats "port": 0 as "no server").
          # It is checked separately below, only for plugins that are servers.
          REQUIRED_FIELDS="name version description author license category"

          # `find ... | while read` runs the loop in a SUBSHELL, so every
          # errors=$((errors + 1)) below was discarded and the check at the end
          # always compared 0. This gate has been reporting success without the
          # ability to report anything else. Reading from a process
          # substitution keeps the loop in this shell so the counter survives.
          while read -r file; do
            plugin=$(dirname "$file")
            printf "Checking %s...\n" "$plugin"

            # Validate JSON syntax
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              printf "  ERROR: Invalid JSON in %s\n" "$file"
              errors=$((errors + 1))
              continue
            fi

            # Check required fields
            for field in $REQUIRED_FIELDS; do
              value=$(python3 -c "import json,sys; d=json.load(open('$file')); print(d.get('$field',''))" 2>/dev/null)
              if [ -z "$value" ]; then
                printf "  ERROR: Missing required field '%s' in %s\n" "$field" "$file"
                errors=$((errors + 1))
              fi
            done

            # Port (manifest v2: service.port, the manifest owns the port there). A v2
            # service.kind of cli or library has no listener, so no port to declare (P7-PLUG-44: monitoring is an init container).
            port=$(python3 -c "import json,sys; d=json.load(open('$file')); print((d.get('service') or {}).get('port',''))" 2>/dev/null)
            kind=$(python3 -c "import json,sys; d=json.load(open('$file')); print((d.get('service') or {}).get('kind',''))" 2>/dev/null)
            if [ -z "$port" ] && { [ "$kind" = "cli" ] || [ "$kind" = "library" ]; }; then
              port=0
            fi
            if [ -z "$port" ]; then
              printf "  ERROR: Missing required field 'port' in %s (a service plugin must declare one; use 0 for no HTTP server)\n" "$file"
              errors=$((errors + 1))
              port=0
            fi
            if ! echo "$port" | grep -qE '^[0-9]+$'; then
              printf "  ERROR: Port must be numeric in %s (got: %s)\n" "$file" "$port"
              errors=$((errors + 1))
            elif [ "$port" -lt 3100 ] || [ "$port" -gt 3999 ]; then
              printf "  WARNING: Port %s is outside expected range 3100-3999 in %s\n" "$port" "$file"
            fi

            # License must be MIT for free plugins
            license=$(python3 -c "import json,sys; d=json.load(open('$file')); print(d.get('license',''))" 2>/dev/null)
            if [ "$license" != "MIT" ]; then
              printf "  WARNING: Free plugin %s has non-MIT license: %s\n" "$plugin" "$license"
            fi

            printf "  OK\n"
          # Only the plugin's own manifest: vendored copies under third_party/ (shared-utils) are not plugins.
          done < <(find free -mindepth 2 -maxdepth 2 -name "plugin.json" | sort)

          if [ $errors -gt 0 ]; then
            printf "\n%d validation error(s) found\n" "$errors"
            exit 1
          fi

          printf "\nAll plugin.json files are valid\n"

      # A plugin declaring status "deprecated" must carry a complete deprecation
      # block. cli/internal/plugin/manifest.go REFUSES to parse the manifest
      # otherwise, and listInstalled() then skips the directory — so the plugin
      # installs "successfully" and is invisible to `nself plugin list
      # --installed` and `nself doctor`.
      #
      # That is not hypothetical: free/notifications shipped status "deprecated"
      # with only the flat deprecated/deprecatedSince/replacedBy fields and no
      # block, and it is one of the eight plugins in the free Task Bundle. The
      # bundle installed eight plugins and listed seven, with nothing saying why
      # (found 2026-09-13). The step above validates required fields but never
      # looked at the deprecation block, so it passed this all the way through.
      #
      # Notice period comes from .github/wiki/Deprecation-Policy.md: free (MIT)
      # plugins get a minimum of 6 months from announcedDate to eolDate.
      - name: Deprecated plugins carry a complete deprecation block
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, datetime, urllib.request, urllib.error

          REQUIRED = ("announcedDate", "eolDate", "migrationGuide")
          MIN_NOTICE_DAYS = 182  # 6 months, per Deprecation-Policy.md
          errors = []

          def iso(name, value, where):
              try:
                  return datetime.date.fromisoformat(value)
              except (TypeError, ValueError):
                  errors.append(f"{where}: deprecation.{name} is not an ISO date (YYYY-MM-DD): {value!r}")
                  return None

          for f in sorted(pathlib.Path("free").glob("*/plugin.json")):
              d = json.loads(f.read_text())
              if d.get("status") != "deprecated":
                  continue
              block = d.get("deprecation")
              if not isinstance(block, dict):
                  errors.append(
                      f"{f}: status is \"deprecated\" but there is no `deprecation` block. "
                      "The flat deprecated/deprecatedSince/replacedBy fields are NOT a "
                      "substitute - the CLI will refuse to parse this manifest and the "
                      "plugin will silently vanish from every listing."
                  )
                  continue
              for key in REQUIRED:
                  if not block.get(key):
                      errors.append(f"{f}: deprecation.{key} is required")
              a = iso("announcedDate", block.get("announcedDate"), f)
              e = iso("eolDate", block.get("eolDate"), f)
              if a and e:
                  notice = (e - a).days
                  if notice < MIN_NOTICE_DAYS:
                      errors.append(
                          f"{f}: notice period is {notice} days; Deprecation-Policy.md "
                          f"requires at least {MIN_NOTICE_DAYS} (6 months) for free plugins"
                      )
              url = block.get("migrationGuide") or ""
              if url and not url.startswith(("http://", "https://")):
                  errors.append(f"{f}: deprecation.migrationGuide must be an absolute URL, got {url!r}")
              elif url:
                  # The policy requires this to resolve. A definitive 4xx is a real
                  # defect and fails. A network error or a server-side 5xx is NOT
                  # treated as a failure - a DNS blip or a GitHub wiki 504 must not
                  # turn this into a flaky gate (D-0316).
                  try:
                      req = urllib.request.Request(url, method="GET", headers={"User-Agent": "nself-ci"})
                      urllib.request.urlopen(req, timeout=20).read(1)
                  except urllib.error.HTTPError as ex:
                      if 400 <= ex.code < 500:
                          errors.append(f"{f}: deprecation.migrationGuide {url} returned HTTP {ex.code}")
                      else:
                          print(f"  note: {url} returned HTTP {ex.code} - not failing on a server-side error")
                  except Exception as ex:
                      print(f"  note: could not reach {url} ({ex}) - not failing on a network error")

          if errors:
              print("\nDeprecation block validation failed:")
              for e in errors:
                  print(f"  ERROR: {e}")
              sys.exit(1)
          print("All deprecated plugins carry a complete, policy-compliant deprecation block.")
          PY

      - name: Verify README and plugin.json exist for each plugin
        run: |
          errors=0
          # Same subshell trap as the field check above.
          while read -r dir; do
            if [ ! -f "$dir/README.md" ]; then
              printf "ERROR: Missing README.md in %s\n" "$dir"
              errors=$((errors + 1))
            fi
            if [ ! -f "$dir/plugin.json" ]; then
              printf "ERROR: Missing plugin.json in %s\n" "$dir"
              errors=$((errors + 1))
            fi
          done < <(find free -maxdepth 1 -mindepth 1 -type d | sort)

          if [ $errors -gt 0 ]; then
            printf "\n%d missing file(s) found\n" "$errors"
            exit 1
          fi

          printf "All plugins have required files\n"

  validate-registry-script:
    name: Registry Validator (shared/validate-registry.sh)
    needs: scope
    if: needs.scope.outputs.meta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Make validator executable
        run: chmod +x shared/validate-registry.sh

      - name: Run shared registry validator
        run: bash shared/validate-registry.sh

      - name: Run registry validator for changed plugins (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Identify plugin.json files changed in this PR
          git fetch origin ${{ github.base_ref }} --depth=1

          changed_plugins=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '^free/[^/]+/plugin\.json$' \
            | sed 's|free/\([^/]*\)/plugin\.json|\1|' \
            | sort -u)

          if [ -z "$changed_plugins" ]; then
            echo "No plugin.json files changed in this PR — skipping per-plugin check."
            exit 0
          fi

          echo "Changed plugins detected:"
          echo "$changed_plugins"
          echo ""

          errors=0
          while IFS= read -r plugin; do
            [ -z "$plugin" ] && continue
            echo "Validating plugin: $plugin"
            if ! bash shared/validate-registry.sh --plugin "$plugin"; then
              errors=$((errors + 1))
            fi
          done <<EOF
          $changed_plugins
          EOF

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "ERROR: $errors plugin(s) failed validation. Fix errors before merging."
            exit 1
          fi

          echo "All changed plugins passed validation."

  # P7-PLUG-03: the conformance gate for manifest v2 plugins, plus the proofs that the gate,
  # the codemods and the released-CLI oracle themselves still work. Actions are pinned by SHA.
  conformance:
    name: Plugin Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'   # >= the go directive of the cli commit in scripts/cli-tools.version

      - name: Pinned schema matches the cli commit
        run: bash scripts/conformance/sync-schema.sh --check

      - name: Free manifests validate against manifest v2 (D-0520)
        run: bash tests/manifests/validate-free-manifests.sh

      - name: Declared-port plugins ship a compose fragment or say installable:false (D-0816)
        run: bash tests/manifests/service-fragments.sh

      # P7-PLUG-38: every free plugin, not only the changed ones. Manifest v2 is the only schema: a v1 or missing
      # manifest fails here. The docker `build` rule is the slow one; the conformance-build job below shards it.
      - name: Conformance gate on every free plugin (manifest v2 is the only schema)
        run: bash scripts/conformance/check.sh --all --rules exceptions,schema,compat,healthcheck,replace,docker-socket,port-bind,migrations,boot-schema,migration-immutable,migration-idempotent,legacy-renames,repository,ports

      - name: plugin.yaml licence fields agree with plugin.json (D-0957)
        run: bash tests/manifests/plugin-yaml-licence.sh

      # P7-PLUG-55: the release's binary targets, computed on every PR (no release side effects).
      - name: CLI binary targets gate and v1/v2 fixture parity
        env:
          GOTOOLCHAIN: local
        run: |
          bash scripts/release/cli-targets-gate.sh --out "$RUNNER_TEMP/cli-targets"
          export CLI_TARGETS_TOOL
          CLI_TARGETS_TOOL=$(. scripts/conformance/lib.sh; cli_tool manifestv2migrate)
          out1=$(bash scripts/release/cli-targets.sh tests/fixtures/manifest-v1-cli)
          out2=$(bash scripts/release/cli-targets.sh tests/fixtures/manifest-v2-cli)
          [ -n "$out1" ] && [ "$out1" = "$out2" ] || { echo "v1 and v2 fixtures differ or print nothing"; exit 1; }
          bash tests/conformance/cli-targets-gate-test.sh

      # D-0622: preflight builds a cli plugin from the targets the release computes, not from its own jq parsing.
      - name: Preflight cli Dockerfile targets
        env:
          GOTOOLCHAIN: local
        run: bash tests/preflight/cli-dockerfile-test.sh

      - name: Gate fixtures (converted pass, planted defects fail)
        run: bash scripts/conformance/check.sh --fixtures

      - name: Codemod fixtures and idempotence
        run: bash scripts/codemods/run.sh --fixtures --twice

      - name: Port uniqueness fixtures
        run: bash scripts/conformance/ports.sh --fixtures

      - name: Fresh-database boot kit
        run: bash tests/boot/run.sh --fixtures

      - name: Oracle delta mechanism (negative proofs)
        run: bash tests/conformance/oracle-deltas-test.sh

      - name: Plugins without a compose fragment are v2 library plugins (D-0812)
        run: bash tests/conformance/no-fragment-v2-test.sh

      - name: Codemods are idempotent on real plugins
        run: bash tests/conformance/realtree.sh --drop-dev-tool-keys --plugins github-runner,nself-vault,family-ancestry,audit-log

      - name: D-0815 forgejo and file-processing pass the whole gate
        run: bash tests/conformance/d0815-test.sh

      - name: Released CLI v1.4.12 oracle
        run: bash scripts/conformance/v14-oracle.sh --fixtures

  # P7-PLUG-38: the `build` rule (docker build from the release tarball, network off) of check.sh --all, split over four
  # runners. Together the shards are exactly --all (fixtures.sh proves it); the other rules run in `conformance` above.
  # A pull request builds only the plugins it touched in one job; a change to the shared build inputs, push to
  # main and dispatch run the four shards over every plugin.
  conformance-build:
    name: Plugin build gate (${{ matrix.label }})
    needs: scope
    if: needs.scope.outputs.build_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'   # >= the go directive of the cli commit in scripts/cli-tools.version

      - name: Build rule on this shard of the free plugins
        env:
          CHECK_ARGS: ${{ matrix.args }}
        run: bash scripts/conformance/check.sh $CHECK_ARGS --rules build

