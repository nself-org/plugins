# Scheduler acceptance scenarios (P7-SCHED-15, Epic SCHED D20, Epic acceptance 2-6).
#
# Purpose: run the in-process scheduler suite (free/ci/test/scenarios, build tag `scenarios`: scenario 4 heterogeneous matrix,
#   6 hybrid, 10 capacity saturation, economics and burst, plus the planted-regression tests) on ubuntu-latest through its drill
#   wrapper (scripts/drill/sched-scenarios/run, also a job of the `drills` pipeline), and the native scenario-4 leg on one
#   runner of each platform the matrix names: linux/amd64 (ubuntu-24.04), linux/arm64 (ubuntu-24.04-arm), darwin/arm64 (macos-15).
#   All runner labels are the standard ones that are free for a public repository.
# Inputs:  this checkout. No secrets, no network beyond the runner's own checkout and toolchain download.
# Outputs: the suite log and the drill's ci.evidence document as an artifact; the job summary names the platform of each leg.
# Constraints: actions pinned by SHA; `permissions: contents: read`; the workflow interpolates no event payload field, no head
#   ref name and no secret (fork-controlled or secret values) and never runs on the privileged fork-PR trigger.

name: ci-sched-scenarios

on:
  pull_request:
    paths:
      - ".github/workflows/ci-sched-scenarios.yml"
      - "scripts/drill/sched-scenarios/**"
      - "free/ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-sched-scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenarios:
    name: scenarios (linux/amd64, drill wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: free/ci/go.mod
          cache: false

      - name: Run the scenario suite and the planted regressions (drill wrapper)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          scripts/drill/sched-scenarios/run | tee "$RUNNER_TEMP/evidence/stdout.txt" | tail -n 1 > "$RUNNER_TEMP/evidence/sched-scenarios.json"
          jq -r '"sched-scenarios: " + .result + " (" + (.counts.pass | tostring) + " of " + (.counts.total | tostring) + " checks)"' "$RUNNER_TEMP/evidence/sched-scenarios.json" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.result == "pass"' "$RUNNER_TEMP/evidence/sched-scenarios.json" > /dev/null

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sched-scenarios-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore

  native:
    name: native scenario 4 (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-15
            platform: darwin/arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: free/ci/go.mod
          cache: false

      - name: The runner is the platform the leg claims
        env:
          WANT: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          got="$(go env GOOS)/$(go env GOARCH)"
          echo "native leg: runner $got, matrix entry $WANT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$got" = "$WANT"

      - name: Scenario 4 on this platform
        working-directory: free/ci
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -mod=vendor -count=1 -v -tags scenarios ./test/scenarios/ -run 'TestScenario4' | tee "$RUNNER_TEMP/scenario4.txt"
          grep -q -- '--- PASS: TestScenario4Native' "$RUNNER_TEMP/scenario4.txt"
          ! grep -q -- '--- SKIP' "$RUNNER_TEMP/scenario4.txt"
