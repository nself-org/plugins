name: ci-bench

# Local overhead of the nself ci V15 engine against the v1.4 gate (P7-CI-46).
# Runs cibench on a hosted runner, then the cli's own `perfbench check` against the
# per-platform budget (absolute p95) and `cibench -ratio-check` (V15 median against
# the v1.4 median). Two controls prove the gates can fire: a result ten times over
# every budget must fail both checks, and a result inside the relative budget must
# pass. Budgets and baselines: hq plan/p7/evidence/CI-46-perf.md.

on:
  pull_request:
    paths:
      - 'free/ci/**'
      - '.github/workflows/ci-bench.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  # nself-org/cli revision whose tools/perfbench reads the result and budget files.
  CLI_SHA: '529e8917244bffe4ab1aa9d42b081dd3efe5ee73'

jobs:
  bench:
    name: bench (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            budget: perf-budget.json
            sched_budget: sched-budget.json
            share_budget: sched/share-budget-linux-amd64.json
            services: true
          - name: macos-arm64
            os: macos-14
            budget: perf-budget-darwin-arm64.json
            sched_budget: sched-budget-darwin-arm64.json
            share_budget: sched/share-budget-darwin-arm64.json
            services: false
    env:
      BUDGET: ${{ github.workspace }}/free/ci/bench/${{ matrix.budget }}
      SLOW: ${{ github.workspace }}/free/ci/bench/testdata/slow-result.json
      SCHED_BUDGET: ${{ github.workspace }}/free/ci/bench/${{ matrix.sched_budget }}
      SHARE_BUDGET: ${{ github.workspace }}/free/ci/bench/${{ matrix.share_budget }}
      SCHED_SLOW: ${{ github.workspace }}/free/ci/bench/sched/testdata/slow-result.json
      OK: ${{ github.workspace }}/free/ci/bench/testdata/ratio-ok-result.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nself-org/cli
          ref: ${{ env.CLI_SHA }}
          path: cli
          persist-credentials: false

      # The cli module needs a newer Go than the plugin pins, and setup-go sets
      # GOTOOLCHAIN=local, so one toolchain (the newer) builds both.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache: false

      - name: Harness tests
        working-directory: free/ci
        run: go test -mod=vendor -count=1 ./bench/...

      - name: Measure
        working-directory: free/ci
        run: go run -mod=vendor ./bench/cmd/cibench -runs 20 -warmup 2 -out "$RUNNER_TEMP/ci-bench.json"

      - name: Absolute p95 budget (cli perfbench check)
        working-directory: cli
        run: go run -mod=vendor ./tools/perfbench check -budget "$BUDGET" -in "$RUNNER_TEMP/ci-bench.json"

      - name: Relative budget (V15 against v1.4)
        working-directory: free/ci
        run: go run -mod=vendor ./bench/cmd/cibench -ratio-check -in "$RUNNER_TEMP/ci-bench.json"

      - name: Scheduling cost (schedbench)
        working-directory: free/ci
        run: go run -mod=vendor ./bench/cmd/schedbench -runs 20 -warmup 2 -out "$RUNNER_TEMP/sched-bench.json"

      - name: Scheduling p95 budget (cli perfbench check)
        working-directory: cli
        run: go run -mod=vendor ./tools/perfbench check -budget "$SCHED_BUDGET" -in "$RUNNER_TEMP/sched-bench.json"

      - name: Scheduling share budget
        working-directory: free/ci
        run: go run -mod=vendor ./bench/cmd/schedbench -share-check "$SHARE_BUDGET" -in "$RUNNER_TEMP/sched-bench.json"

      - name: Control - the gates fail an injected slowdown and pass a good result
        if: ${{ !cancelled() }}
        run: |
          set -u
          rc=0
          (cd cli && go run -mod=vendor ./tools/perfbench check -budget "$BUDGET" -in "$SLOW") || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::perfbench check exited $rc on a result ten times over budget; want 1 (a violation)"; exit 1
          fi
          cd free/ci
          rc=0
          go run -mod=vendor ./bench/cmd/cibench -ratio-check -in "$SLOW" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::the ratio check exited $rc on a result ten times over budget; want 1 (a violation)"; exit 1
          fi
          go run -mod=vendor ./bench/cmd/cibench -ratio-check -in "$OK"
          rc=0
          go run -mod=vendor ./bench/cmd/schedbench -share-check "$SHARE_BUDGET" -in "$SCHED_SLOW" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::the share check exited $rc on a slow scheduling result; want 1 (a violation)"; exit 1
          fi
          cd ../../cli
          rc=0
          go run -mod=vendor ./tools/perfbench check -budget "$SCHED_BUDGET" -in "$SCHED_SLOW" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::perfbench check exited $rc on a slow scheduling result; want 1 (a violation)"; exit 1
          fi

      - name: Service start (warm and cold)
        if: ${{ !cancelled() && matrix.services }}
        run: |
          set -eu
          (cd cli && go build -mod=vendor -o "$RUNNER_TEMP/nself" ./cmd/nself)
          cd free/ci
          go run -mod=vendor ./bench/cmd/cibench -runs 5 -warmup 0 -skip-medium -services -cold -cold-runs 3 \
            -nself "$RUNNER_TEMP/nself" -out "$RUNNER_TEMP/ci-bench-services.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-bench-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/ci-bench.json
            ${{ runner.temp }}/ci-bench-services.json
            ${{ runner.temp }}/sched-bench.json
          if-no-files-found: ignore

  # P7-CACHE-12: the cache engine's own cold/warm cycles (specs.Begin, Finalize) on seeded Go, pnpm and Rust trees, plus
  # the throughput of the ssh and agent carriers in both directions. Every number is measured; nothing is simulated.
  # It is a job of its own so that a red CI-46 gate in the bench job cannot skip it.
  cache:
    name: cache (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            budget: perf-budget.json
          - name: macos-arm64
            os: macos-14
            budget: perf-budget-darwin-arm64.json
    env:
      BUDGET: ${{ github.workspace }}/free/ci/bench/cache/${{ matrix.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nself-org/cli
          ref: ${{ env.CLI_SHA }}
          path: cli
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cli/go.mod
          cache: false

      - name: Harness tests
        working-directory: free/ci
        run: go test -mod=vendor -count=1 ./bench/cache/...

      - name: Cache cold and warm (cachebench)
        working-directory: free/ci
        env:
          NSELF_V15: '1'
          NSELF_CACHE_BENCH_RUNS: '20'
          NSELF_CACHE_BENCH_OUT: ${{ runner.temp }}/cache-carriers.json
        run: |
          set -euo pipefail
          export NSELF_REVISION="$(git rev-parse --short=12 HEAD)"
          go test -mod=vendor -tags integration -count=1 -run '^TestRemoteCarrierThroughput$' ./internal/cache/remote/
          for i in 1 2 3; do
            go run -mod=vendor ./bench/cache/cmd/cachebench -runs 20 -carriers "$NSELF_CACHE_BENCH_OUT" -json > "$RUNNER_TEMP/cache-bench-$i.json"
          done
          cp "$RUNNER_TEMP/cache-bench-1.json" "$RUNNER_TEMP/cache-bench.json"
          for i in 1 2 3; do
            echo "repetition $i"
            python3 -c 'import json,sys; [print("%-34s p50 %10.3f p95 %10.3f n %d" % (m["name"],m["p50"],m["p95"],m["n"])) for m in json.load(open(sys.argv[1]))["metrics"]]' "$RUNNER_TEMP/cache-bench-$i.json"
          done
          python3 -c 'import json,sys; [print(f) for f in json.load(open(sys.argv[1]))["fixtures"]]' "$RUNNER_TEMP/cache-bench-1.json"
          python3 -c 'import json,sys; [print(f) for f in json.load(open(sys.argv[1]))["transfers"]]' "$RUNNER_TEMP/cache-bench-1.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cache-bench-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/cache-bench-*.json
            ${{ runner.temp }}/cache-carriers.json
          if-no-files-found: ignore

  schedbench:
    if: github.repository == 'nself-org/plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=vendor
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: free/ci/go.mod
          cache: false
      - name: Measure scheduler and admission on linux-amd64
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          mkdir -p "$RUNNER_TEMP/schedbench"
          {
            echo "revision=$GITHUB_SHA"
            uname -a
            lscpu
            go version
            echo "command=CGO_ENABLED=0 go -C free/ci test -mod=vendor -run ^$ -bench Benchmark(Place|Admit)$ -benchmem -count=10 ./internal/sched/ ./internal/dispatch/"
          } > "$RUNNER_TEMP/schedbench/machine.txt"
          go -C free/ci test -mod=vendor -run '^$' -bench 'Benchmark(Place|Admit)$' -count=2 ./internal/sched/ ./internal/dispatch/ > "$RUNNER_TEMP/schedbench/warmups.txt"
          go -C free/ci test -mod=vendor -run '^$' -bench 'Benchmark(Place|Admit)$' -benchmem -count=10 ./internal/sched/ ./internal/dispatch/ | tee "$RUNNER_TEMP/schedbench/samples.txt"
      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schedbench-linux-amd64
          path: ${{ runner.temp }}/schedbench/
          if-no-files-found: error
