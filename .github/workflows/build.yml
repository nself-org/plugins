name: Build Plugins

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - '.github/wiki/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/wiki/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ts-plugins:
    name: List TypeScript plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: List plugins with a ts directory
        id: list
        run: |
          plugins=$(for d in free/*/ts; do [ -d "$d" ] && basename "$(dirname "$d")"; done | sort | jq -R . | jq -sc .)
          echo "plugins=${plugins:-[]}" >> "$GITHUB_OUTPUT"
          echo "TypeScript plugins: ${plugins:-[]}"

  build-typescript:
    name: TypeScript Build Check
    needs: ts-plugins
    if: needs.ts-plugins.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.ts-plugins.outputs.plugins) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Check if plugin has TypeScript
        id: check-ts
        run: |
          if [ -d "free/${{ matrix.plugin }}/ts" ]; then
            echo "has_ts=true" >> $GITHUB_OUTPUT
          else
            echo "has_ts=false" >> $GITHUB_OUTPUT
            echo "No TypeScript source for ${{ matrix.plugin }} - skipping"
          fi

      - name: Build shared plugin-utils
        if: steps.check-ts.outputs.has_ts == 'true'
        working-directory: shared
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install dependencies
        if: steps.check-ts.outputs.has_ts == 'true'
        working-directory: free/${{ matrix.plugin }}/ts
        run: pnpm install --frozen-lockfile

      - name: Type check
        if: steps.check-ts.outputs.has_ts == 'true'
        working-directory: free/${{ matrix.plugin }}/ts
        run: pnpm type-check || pnpm exec tsc --noEmit
        continue-on-error: false

      - name: Build
        if: steps.check-ts.outputs.has_ts == 'true'
        working-directory: free/${{ matrix.plugin }}/ts
        run: pnpm build
        # ACCEPTED: not all plugins have a build script configured; missing build step is expected during incremental migration.
        # Expiry: 2026-12-01 — remove once all plugins have pnpm build configured and passing.
        continue-on-error: true

  # D-0623: free/file-processing/ts and free/media-processing/ts link
  # @nself/plugin-utils from ../../../shared (link:), which only pnpm can install.
  # Every supported pnpm major installs, typechecks and builds them with
  # shared/dist absent: the typecheck and build scripts compile shared first.
  ts-pnpm-matrix:
    name: pnpm ${{ matrix.pnpm }} / ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        pnpm: [9, 10, 11]
        plugin: [file-processing, media-processing]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm }}

      - name: Install shared dependencies (shared/dist stays absent)
        working-directory: shared
        run: |
          pnpm install --frozen-lockfile
          test ! -e dist

      - name: Install dependencies
        working-directory: free/${{ matrix.plugin }}/ts
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: free/${{ matrix.plugin }}/ts
        run: pnpm run typecheck

      - name: Build
        working-directory: free/${{ matrix.plugin }}/ts
        run: pnpm run build

  lint-typescript:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Lint each TypeScript plugin
        run: |
          errors=0

          for dir in free/*/ts; do
            [ -d "$dir" ] || continue
            plugin=$(echo "$dir" | cut -d'/' -f2)

            printf "Linting %s...\n" "$plugin"
            cd "$dir"

            if [ -f "package.json" ] && pnpm run --if-present lint 2>/dev/null; then
              printf "  OK\n"
            else
              printf "  SKIP (no lint script)\n"
            fi

            cd ../../..
          done

          exit 0
