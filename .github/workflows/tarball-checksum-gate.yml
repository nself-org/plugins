name: Tarball Checksum Gate

# Rebuilds every free plugin's source tarball from the checked-out tree
# using the SAME recipe (scripts/deterministic-tar.sh) that
# release-tarballs.yml uses to build the assets a tag push actually
# publishes, then asserts the freshly built sha256 matches registry.json's
# `checksum` (and, when present, `checksums.sha256`) for that plugin.
#
# Why this exists: registry.json can carry a checksum that was computed by
# ANY build (a contributor's laptop, an earlier CI run, hand-editing) at ANY
# point, with no guarantee it still matches what the release pipeline would
# produce today. `nself plugin install` hard-fails on a checksum mismatch
# (internal/plugin/security.go verifyChecksum) — so a stale or
# wrongly-computed checksum in registry.json is a shipped defect, not a
# cosmetic one. This gate makes that defect impossible to merge: it rebuilds
# the real bytes and fails the PR the moment they disagree, rather than
# discovering it after users start getting failed installs post-release.
#
# A second job, per-platform-checksum-gate, does the same thing for the
# per-platform binary tarballs: for every plugin with a binaryName, it
# cross-compiles all 5 platform builds (the same Go build + deterministic-tar.sh
# recipe release-tarballs.yml uses — via scripts/build-tarballs.sh's
# build_platform_tarballs(), sourced rather than re-implemented, so there is
# exactly one recipe for this) and diffs the result against registry.json's
# checksums.platforms.<platform> for that plugin. internal/plugin/download.go
# tries this asset before the source tarball whenever binaryName is set, and
# internal/plugin/security.go's install-time verification refuses the install
# outright if the matching entry here is absent or wrong (plugins#83) — so a
# missing or stale platform checksum is exactly as much a shipped defect as a
# stale source checksum, and this gate makes it exactly as unmergeable.

on:
  pull_request:
    branches: [main]
    paths:
      - 'free/**'
      - 'registry.json'
      - 'scripts/deterministic-tar.sh'
      - 'scripts/build-tarballs.sh'
      - '.github/workflows/tarball-checksum-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checksum-gate:
    name: Verify registry.json checksums match rebuilt tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Rebuild every free plugin's source tarball and diff against registry.json
        run: |
          set -euo pipefail

          WORK="$(mktemp -d)"
          FAIL=0
          CHECKED=0
          SKIPPED_NO_CHECKSUM=0

          # tar's own --sort=name inside deterministic-tar.sh makes each
          # individual archive's member order stable; sort here too so the
          # gate's own iteration order (and therefore its log/output) is
          # deterministic across runs.
          while IFS= read -r plugin_dir; do
            name="$(basename "$plugin_dir")"

            # ollama is the one deliberate, permanent exception (see
            # .github/RELEASE-v1.0.1.md "Two exceptions"): it ships under its
            # own pre-existing v1.1.1 GitHub release, built independently of
            # this repo's tarball pipeline, and its registry.json checksum was
            # verified by downloading and hashing that real live asset
            # directly — not by this pipeline rebuilding free/ollama from the
            # checked-out tree. Rebuilding it here would compare against a
            # tarball this gate has no way of reproducing (a different
            # release, built on a different date, by a different process) and
            # would fail forever regardless of whether free/ollama/ is fine.
            if [ "$name" = "ollama" ]; then
              echo "SKIP ollama — checksum verified against its own external v1.1.1 release, not this pipeline's build"
              continue
            fi

            entry="$(jq -c --arg n "$name" '.plugins[$n] // empty' registry.json)"
            if [ -z "$entry" ]; then
              # A free/* directory with no registry.json entry at all is
              # registry-check.yml's concern (presence parity), not this
              # gate's (checksum correctness) — skip rather than duplicate it.
              continue
            fi

            expected_checksum="$(printf '%s' "$entry" | jq -r '.checksum // empty')"
            expected_nested="$(printf '%s' "$entry" | jq -r '.checksums.sha256 // empty')"

            if [ -z "$expected_checksum" ] && [ -z "$expected_nested" ]; then
              # e.g. shared-utils: installable:false, no tarball/download_url,
              # no checksum to attest to — deliberately not distributed.
              SKIPPED_NO_CHECKSUM=$((SKIPPED_NO_CHECKSUM + 1))
              continue
            fi

            out="${WORK}/${name}.tar.gz"
            bash scripts/deterministic-tar.sh "$out" "$plugin_dir"
            actual="$(sha256sum "$out" | cut -d' ' -f1)"
            CHECKED=$((CHECKED + 1))

            # Case-insensitive compare, matching internal/plugin/security.go's
            # verifyChecksum (strings.EqualFold) — the actual install-time check.
            if [ -n "$expected_checksum" ]; then
              lhs="$(printf '%s' "$expected_checksum" | tr '[:upper:]' '[:lower:]')"
              rhs="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]')"
              if [ "$lhs" != "$rhs" ]; then
                echo "MISMATCH $name: registry .checksum=$expected_checksum  rebuilt=$actual"
                FAIL=1
              fi
            fi

            # checksums.sha256 may carry a "sha256:" prefix (the release
            # workflow's backfill step writes it that way); strip it before
            # comparing so both conventions are handled.
            if [ -n "$expected_nested" ]; then
              nested_hex="${expected_nested#sha256:}"
              lhs="$(printf '%s' "$nested_hex" | tr '[:upper:]' '[:lower:]')"
              rhs="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]')"
              if [ "$lhs" != "$rhs" ]; then
                echo "MISMATCH $name: registry .checksums.sha256=$expected_nested  rebuilt=$actual"
                FAIL=1
              fi
            fi
          done < <(find free -maxdepth 1 -mindepth 1 -type d | sort)

          echo ""
          echo "Checked: $CHECKED plugin(s) with a registry checksum"
          echo "Skipped (no checksum recorded): $SKIPPED_NO_CHECKSUM"

          rm -rf "$WORK"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "ERROR: one or more registry.json checksums do not match the tarball" >&2
            echo "scripts/deterministic-tar.sh builds from the checked-out free/<name>" >&2
            echo "tree right now. Rebuild with:" >&2
            echo "  bash scripts/build-tarballs.sh <version>" >&2
            echo "and update the mismatched entries' checksum / checksums.sha256." >&2
            exit 1
          fi

          echo "OK: every registry.json checksum matches a freshly rebuilt tarball"

  platform-checksum-gate:
    name: Verify registry.json checksums.platforms match rebuilt binary tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get install -y jq

      # Matches release-tarballs.yml's Go version — the per-platform binaries
      # this job cross-compiles have to be built the same way the real
      # release build compiles them, or a Go-version-specific bug could pass
      # here and still ship broken.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'
          cache: false

      - name: Rebuild every binaryName plugin's platform tarballs and diff against registry.json
        run: |
          set -euo pipefail

          # Sourced, not re-implemented: build_platform_tarballs() and
          # sha256_file() (and the PLATFORMS list) are defined once in
          # scripts/build-tarballs.sh and used both by a contributor running
          # it locally and by this gate — see that file's own doc comment for
          # why it is written to be sourceable without running its main().
          # shellcheck source=scripts/build-tarballs.sh
          source scripts/build-tarballs.sh

          WORK="$(mktemp -d)"
          FAIL=0
          CHECKED=0
          SKIPPED_NO_BINARY=0

          while IFS= read -r plugin_dir; do
            name="$(basename "$plugin_dir")"

            # ollama has no binaryName (it is not a CLI-command plugin) and is
            # excluded from the source-checksum gate above for the same
            # external-release reason; it never reaches the binaryName check
            # below anyway, but skip explicitly for the same documented
            # reason as that job.
            if [ "$name" = "ollama" ]; then
              continue
            fi

            bin_name="$(jq -r '.binaryName // .implementation.binaryName // ""' "${plugin_dir}/plugin.json" 2>/dev/null || printf '')"
            if [ -z "$bin_name" ]; then
              # No command binary to build or verify — this plugin's package
              # is source and works everywhere; the source-checksum gate
              # already covers it.
              SKIPPED_NO_BINARY=$((SKIPPED_NO_BINARY + 1))
              continue
            fi

            entry="$(jq -c --arg n "$name" '.plugins[$n] // empty' registry.json)"
            if [ -z "$entry" ]; then
              continue
            fi
            version="$(printf '%s' "$entry" | jq -r '.version // empty')"
            if [ -z "$version" ]; then
              echo "ERROR $name: registry entry has no version; cannot name or compare a platform tarball"
              FAIL=1
              continue
            fi

            if ! build_platform_tarballs "$plugin_dir" "$name" "$version" "$WORK"; then
              echo "ERROR $name: failed to build one or more platform tarballs"
              FAIL=1
              continue
            fi

            for platform in $PLATFORMS; do
              ptar="${WORK}/${name}-${version}-${platform}.tar.gz"
              if [ ! -f "$ptar" ]; then
                echo "ERROR $name/$platform: expected $ptar was not produced"
                FAIL=1
                continue
              fi
              actual="$(sha256_file "$ptar")"
              CHECKED=$((CHECKED + 1))

              expected="$(printf '%s' "$entry" | jq -r --arg p "$platform" '.checksums.platforms[$p] // empty')"

              # A missing checksums.platforms entry for a plugin that DOES
              # ship a binary for this platform is refused here, the same as
              # a mismatch — not skipped the way an absent SOURCE checksum
              # is (shared-utils, etc. above). internal/plugin's install-time
              # policy (installer_locked.go's resolveArtifactChecksum) is
              # equally unconditional: a downloaded platform binary with no
              # matching registry checksum refuses the install outright,
              # with no leniency and no env var to bypass it — so an entry
              # missing here is not a softer finding than a wrong one, it is
              # the exact defect that policy exists to catch before release.
              if [ -z "$expected" ]; then
                echo "MISSING $name/$platform: no registry checksums.platforms.$platform recorded (install-time verification refuses this unconditionally)"
                FAIL=1
                rm -f "$ptar" "${ptar}.sha256"
                continue
              fi

              # Plain lowercase hex, matching how registry-schema.json
              # documents this field and how the CLI's raw hex comparison
              # reads it — no "sha256:" prefix stripping needed here (that
              # convention is checksums.sha256's, the source-tarball
              # sibling field, not this one's).
              lhs="$(printf '%s' "$expected" | tr '[:upper:]' '[:lower:]')"
              rhs="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]')"
              if [ "$lhs" != "$rhs" ]; then
                echo "MISMATCH $name/$platform: registry .checksums.platforms.$platform=$expected  rebuilt=$actual"
                FAIL=1
              fi
              rm -f "$ptar" "${ptar}.sha256"
            done
          done < <(find free -maxdepth 1 -mindepth 1 -type d | sort)

          echo ""
          echo "Checked: $CHECKED platform tarball(s)"
          echo "Skipped (no binaryName): $SKIPPED_NO_BINARY"

          rm -rf "$WORK"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "ERROR: one or more registry.json checksums.platforms entries are missing or do not match a freshly rebuilt platform tarball" >&2
            echo "Rebuild with:" >&2
            echo "  bash scripts/build-tarballs.sh <version>" >&2
            echo "and update the mismatched/missing checksums.platforms.<platform> entries." >&2
            exit 1
          fi

          echo "OK: every binaryName plugin's checksums.platforms matches a freshly rebuilt tarball"
