name: Gitleaks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
      - name: Configure git for gitleaks
        run: git config diff.renameLimit 1861
      - name: Scan for secrets
        # Scan only this change's own history. A bare `gitleaks detect` walks every ref the
        # checkout fetched (`git log --all`), so a synthetic fixture on one open branch failed
        # every other PR (D-1031).
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          else
            RANGE="HEAD"
          fi
          echo "Gitleaks scope: $RANGE"
          gitleaks detect --source=. --log-level=warn --redact --config .github/gitleaks.toml --log-opts="$RANGE"
