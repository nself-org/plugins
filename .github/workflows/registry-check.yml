name: Registry Consistency Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  registry-consistency:
    name: Registry Consistency Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Check all free/ plugins have registry.json entries
        run: |
          errors=0

          # Build list of plugin directories in free/
          disk_plugins=$(find free -maxdepth 1 -mindepth 1 -type d \
            | xargs -I{} basename {} \
            | sort)

          # Build list of plugin names from registry.json
          registry_plugins=$(python3 -c "
          import json, sys
          with open('registry.json') as f:
            data = json.load(f)
          plugins = data.get('plugins', {})
          if isinstance(plugins, dict):
            for name in sorted(plugins.keys()):
              print(name)
          elif isinstance(plugins, list):
            for p in sorted(plugins, key=lambda x: x.get('name','')):
              print(p.get('name',''))
          ")

          echo "Plugins on disk (free/):"
          echo "$disk_plugins"
          echo ""
          echo "Plugins in registry.json:"
          echo "$registry_plugins"
          echo ""

          # Check every disk plugin has a registry entry
          while IFS= read -r plugin; do
            [ -z "$plugin" ] && continue
            if ! echo "$registry_plugins" | grep -qx "$plugin"; then
              echo "ERROR: Plugin '$plugin' exists in free/ but has no entry in registry.json"
              errors=$((errors + 1))
            fi
          done <<EOF
          $disk_plugins
          EOF

          # Check every registry entry has a corresponding disk directory
          while IFS= read -r plugin; do
            [ -z "$plugin" ] && continue
            if ! echo "$disk_plugins" | grep -qx "$plugin"; then
              echo "WARNING: Plugin '$plugin' is in registry.json but not found in free/ (may be pro or community)"
            fi
          done <<EOF
          $registry_plugins
          EOF

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "FAILED: $errors plugin(s) are missing from registry.json"
            echo "Run 'pnpm build:registry' or manually add the entry to registry.json"
            exit 1
          fi

          echo "All free/ plugins have entries in registry.json"

      - name: Validate plugin.json required fields for all plugins
        run: |
          errors=0
          REQUIRED_FIELDS="name version description category"

          # `find ... | while read` runs the loop in a SUBSHELL, so every
          # errors=$((errors+1)) below was discarded and this gate could never
          # fail. Redirecting from a process substitution keeps the loop in this
          # shell so the counter survives.
          while read -r file; do
            plugin=$(dirname "$file" | xargs basename)

            # Validate JSON syntax first
            if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "ERROR: Invalid JSON syntax in $file"
              errors=$((errors + 1))
              continue
            fi

            # Check required fields
            for field in $REQUIRED_FIELDS; do
              value=$(python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(d.get(sys.argv[2], ''))
              " "$file" "$field" 2>/dev/null)

              if [ -z "$value" ]; then
                echo "ERROR: '$plugin/plugin.json' missing required field: $field"
                errors=$((errors + 1))
              fi
            done

            # Validate entrypoint field exists (under implementation or as top-level)
            entrypoint=$(python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          impl = d.get('implementation', {})
          if isinstance(impl, dict):
            print(impl.get('entryPoint', ''))
          else:
            print(d.get('entrypoint', ''))
            " "$file" 2>/dev/null)

            if [ -z "$entrypoint" ]; then
              echo "WARNING: '$plugin/plugin.json' has no entrypoint defined (implementation.entryPoint)"
            fi
          done < <(find free -name "plugin.json" | sort)

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "FAILED: $errors field validation error(s) across plugin.json files"
            exit 1
          fi

          echo "All plugin.json files passed required field checks"

      - name: Run shared registry validator
        run: |
          chmod +x shared/validate-registry.sh
          bash shared/validate-registry.sh

      - name: Registry version consistency check
        run: |
          errors=0

          # For each free plugin, compare version in plugin.json vs registry.json.
          # Same subshell trap as the field check above: read from a process
          # substitution, not a pipe, or the mismatch counter is thrown away.
          while read -r file; do
            plugin=$(dirname "$file" | xargs basename)

            disk_version=$(python3 -c "
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(d.get('version', ''))
            " "$file" 2>/dev/null)

            registry_version=$(python3 -c "
          import json, sys
          with open('registry.json') as f:
            data = json.load(f)
          plugins = data.get('plugins', {})
          if isinstance(plugins, dict):
            p = plugins.get(sys.argv[1], {})
            print(p.get('version', ''))
          elif isinstance(plugins, list):
            match = next((p for p in plugins if p.get('name') == sys.argv[1]), {})
            print(match.get('version', ''))
            " "$plugin" 2>/dev/null)

            if [ -z "$registry_version" ]; then
              # Not in registry — already caught by the consistency check above
              continue
            fi

            if [ "$disk_version" != "$registry_version" ]; then
              echo "ERROR: Version mismatch for '$plugin': plugin.json=$disk_version, registry.json=$registry_version"
              errors=$((errors + 1))
            fi
          done < <(find free -name "plugin.json" | sort)

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "FAILED: $errors version mismatch(es) between plugin.json and registry.json"
            exit 1
          fi

          echo "All plugin versions are consistent between plugin.json and registry.json"

      - name: Validate non-Go plugin config shape
        run: |
          # build-test.yml's Go matrix covers every free/*/ dir with a
          # go.mod. As of P6 that is 59 of 60 — the one exclusion is
          # `forgejo` (docker-compose + shell, no Go code). `monitoring`
          # DOES have a go.mod despite registry.json's stale "language":
          # "config" label, so it is already Go-tested and is not a plugin
          # this step needs to cover.
          #
          # This step is the config-tier equivalent for whatever plugins
          # genuinely have no go.mod: it validates their docker-compose
          # file(s) parse as valid YAML, so a non-Go plugin is never
          # silently untested. It targets any go.mod-less free/ plugin, not
          # a hardcoded name, so it keeps working if the split changes.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          errors=0
          for d in free/*/; do
            name=$(basename "$d")
            if [ -f "$d/go.mod" ]; then
              continue
            fi
            found_config=0
            for f in "$d"*.yml "$d"*.yaml; do
              [ -f "$f" ] || continue
              found_config=1
              if ! python3 -c "import yaml, sys; yaml.safe_load(open(sys.argv[1]))" "$f" 2>/dev/null; then
                echo "ERROR: '$name/$(basename "$f")' is not valid YAML"
                errors=$((errors + 1))
              else
                echo "OK: $name/$(basename "$f") is valid YAML"
              fi
            done
            if [ "$found_config" -eq 0 ]; then
              echo "ERROR: '$name' has no go.mod and no top-level *.yml/*.yaml config to validate"
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "FAILED: $errors non-Go plugin config validation error(s)"
            exit 1
          fi

          echo "All non-Go free plugins have valid config"

      - name: Validate bundles[] field shape
        run: |
          python3 -c "
          import json, sys

          with open('registry.json') as f:
            data = json.load(f)

          plugins = data.get('plugins', {})
          errors = 0

          def check_entry(name, entry):
            global errors
            if 'bundles' not in entry:
              return
            bundles = entry['bundles']
            if not isinstance(bundles, list):
              print(f\"ERROR: '{name}' has non-array bundles field: {bundles!r}\")
              errors += 1
              return
            for item in bundles:
              if not isinstance(item, str):
                print(f\"ERROR: '{name}' bundles array contains non-string item: {item!r}\")
                errors += 1

          if isinstance(plugins, dict):
            for name, entry in plugins.items():
              check_entry(name, entry)
          elif isinstance(plugins, list):
            for entry in plugins:
              check_entry(entry.get('name', '<unknown>'), entry)

          if errors:
            print(f'FAILED: {errors} bundles[] shape violation(s) found')
            sys.exit(1)

          print('All bundles[] fields (where present) are arrays of strings')
          "

      - name: Check for PLUGINS_PRO_CHECKOUT_TOKEN
        # `secrets.X` cannot be referenced directly in a step/job `if:` —
        # GitHub's workflow_dispatch validator rejects it ("Unrecognized
        # named-value: 'secrets'"), confirmed 2026-08-31 dispatching this
        # workflow. The proven pattern already used elsewhere in this org
        # (nchat/.github/workflows/deploy-k8s.yml's check-secrets job) is to
        # resolve the secret into an env var here, write it to
        # $GITHUB_OUTPUT, and gate later steps on steps.*.outputs.* instead.
        id: check-token
        env:
          HAS_TOKEN: ${{ secrets.PLUGINS_PRO_CHECKOUT_TOKEN != '' }}
        run: echo "has-token=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Checkout plugins-pro (cross-repo counts, Mode A only)
        if: steps.check-token.outputs.has-token == 'true'
        uses: actions/checkout@v7
        with:
          repository: nself-org/plugins-pro
          path: ../plugins-pro
          token: ${{ secrets.PLUGINS_PRO_CHECKOUT_TOKEN }}

      - name: Checkout cli (plugin-counts.sh source, Mode A only)
        if: steps.check-token.outputs.has-token == 'true'
        uses: actions/checkout@v7
        with:
          repository: nself-org/cli
          path: ../cli
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify plugin counts pipeline (Mode A — cross-repo, free+pro)
        if: steps.check-token.outputs.has-token == 'true'
        run: |
          # Full cross-repo drift gate: checks free registry.json (this repo,
          # already validated above) plus pro registry.json against the
          # plugins-pro disk layout, via the shared generator script. Requires
          # a PLUGINS_PRO_CHECKOUT_TOKEN secret (PAT or deploy key scoped to
          # nself-org/plugins-pro, which is private) — GITHUB_TOKEN cannot
          # check out a different private repo. No such secret exists in this
          # org as of P6; this step is inert until an owner provisions one.
          bash ../cli/scripts/plugin-counts.sh

      - name: Verify plugin counts pipeline (Mode B — free-side only, no cross-repo secret)
        if: steps.check-token.outputs.has-token == 'false'
        run: |
          # No PLUGINS_PRO_CHECKOUT_TOKEN secret exists, so plugins-pro cannot
          # be checked out here (GITHUB_TOKEN is scoped to this repo only).
          # The free-side half of the same guarantee is already enforced by
          # this workflow's "Check all free/ plugins have registry.json
          # entries" step above (disk == registry.json, zero drift). This step
          # exists so the job log always states, explicitly, which mode ran
          # and why — never a silent skip.
          free_n=$(python3 -c "import json; print(len(json.load(open('registry.json'))['plugins']))")
          echo "Mode B: PLUGINS_PRO_CHECKOUT_TOKEN not set — cross-repo (free+pro) count"
          echo "verification skipped. Free-side registry has $free_n entries and is"
          echo "already disk-verified by the step above. Provision"
          echo "PLUGINS_PRO_CHECKOUT_TOKEN to enable the full cross-repo gate."
