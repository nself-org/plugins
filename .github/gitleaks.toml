title = "nSelf Plugins gitleaks config"

[extend]
useDefault = true

[allowlist]
# Documentation, examples, and test fixture paths — contain example/placeholder values only
paths = [
  '''\.github/wiki/''',
  '''\.github/docs/''',
  '''\.claude/''',
  '''free/.*\.md$''',
  '''sdk/.*\.md$''',
  '''monitoring/.*\.md$''',
  '''\.workers/.*\.md$''',
  '''\.md$''',
  '''\.env\.example$''',
  '''\.env\.template$''',
  '''\.env\.sample$''',
  '''\.example$''',
]
# Known AWS documentation example credentials — not real secrets
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI''',
  '''bPxRfiCYEXAMPLEKEY''',

  # Test fixtures that arrived with the CLI-R11 command extractions. Each was
  # allowlisted in the cli repo; the allowlist did not travel with the code, so
  # they surfaced here as new findings the moment the plugins landed.
  #
  # Deliberately narrow — the exact literals, not a blanket rule over _test.go.
  # A real credential pasted into a test file must still be caught.

  # sentry: the fake API key isolateSentryEnv sets so the cloud tests never
  # touch a real instance. `nsk_` is the ɳSentry key prefix; "cmdtest" is the
  # tell.
  '''nsk_cmdtest12345''',

  # ai-studio: two tokens in the redactor's table test, proving it prints
  # "a1b2c3d4****" normally and the full value under --debug. Both are the
  # digits 1-9 repeating, not keys. One regex covers both lengths.
  '''a1b2c3d4e5f6789012345678901234567890[0-9]*''',

  # Test fixtures that arrived with the P6-E4-W2-S1-T3 free-by-default
  # migration (62 plugins moved plugins-pro -> plugins/free). Each allowlist
  # entry below was verified against source: a synthetic value with no
  # corresponding real credential, used only to exercise rejection/mock paths.

  # nself-saas-gateway/spoof_test.go: a deliberately invalid JWT (payload
  # signature is the literal string "bogussignature") used to assert that a
  # garbage token is rejected with 401 even alongside a spoofed tenant header.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJ0ZW5hbnRfaWQiOiJ4In0\.bogussignature''',

  # plugin-gauth/tests/integration_refresh.rs: mockito intercepts the Google
  # OAuth endpoint in-process (see file header comment) and returns this
  # literal string as the mocked access_token — never a real Google token.
  '''ya29\.integration-test''',

  # post/internal/providers/ghost/client_test.go: hexSecret is a 32-byte hex
  # string built from the sequential byte pattern aabbccdd...8899 repeated,
  # documented in-file as matching the SHAPE of a real Ghost Admin API key
  # without being one.
  '''aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899''',
]
