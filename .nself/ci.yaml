# nself-ci configuration for the plugins repo (contract:ci.pipeline-config v1).
#
# Purpose: declare the jobs `nself ci` plans for this repository.
# Precedence: flag > env > this file > detected default (`nself ci config show`).

version: 1

jobs:
  # The default pipeline is the gate the `nself-ci` and `nself-ci/source` workflow
  # jobs run (P7-CI-07). Declaring jobs turns catalogue detection off (217 Go
  # modules would plan about a thousand jobs), so the gate is exactly this list.
  # Rule: a job here may be tuned (workdir, when.paths, timeout) but never made
  # optional to get a green run (Epic D28).
  #
  # Secrets in the working tree. No `when`: this is the job every pull request
  # runs, so a change that touches only docs still has a substantive check. The
  # git-history scan stays in gitleaks.yml (it scopes the range to the change).
  secrets-tree:
    kind: static
    run: [gitleaks, detect, --no-git, --source, ., --config, .github/gitleaks.toml, --redact, --log-level, warn]
    timeout: 300s

  # Truth gate (P7-CI-08, Epic D21): no dead host, retired term or banned literal in this
  # tree. The rules are data in .github/truth/org.yaml (listed under `checks.truth.rules`
  # below); the engine is free/ci/internal/gates/truth, run from source until the V15
  # engine links it. One job per rule kind so the evidence shows which kind of truth
  # broke; `truth` validates the rule files and waits for the three. No `when`: any
  # change can add a forbidden string, and a skipped required job would fail the run
  # (Epic D28).
  truth-banned-literal:
    kind: static
    run: [go, run, -mod=vendor, ./internal/gates/truth/run.go, truth, --kind, banned-literal, --root, ../.., .github/truth/org.yaml]
    workdir: free/ci
    env:
      CGO_ENABLED: "0"
    timeout: 600s

  truth-retired-term:
    kind: static
    run: [go, run, -mod=vendor, ./internal/gates/truth/run.go, truth, --kind, retired-term, --root, ../.., .github/truth/org.yaml]
    workdir: free/ci
    env:
      CGO_ENABLED: "0"
    timeout: 600s

  truth-dead-host:
    kind: static
    run: [go, run, -mod=vendor, ./internal/gates/truth/run.go, truth, --kind, dead-host, --root, ../.., .github/truth/org.yaml]
    workdir: free/ci
    env:
      CGO_ENABLED: "0"
    timeout: 600s

  truth:
    kind: static
    run: [go, run, -mod=vendor, ./internal/gates/truth/run.go, truth, --kind, rules, --root, ../.., .github/truth/org.yaml]
    workdir: free/ci
    deps: [truth-banned-literal, truth-retired-term, truth-dead-host]
    env:
      CGO_ENABLED: "0"
    timeout: 600s

  # The nself-ci engine itself (free/ci). The model package holds the result
  # rule (one failing required check fails the run), which the mutation leg of
  # nself-ci-source.yml breaks on purpose to prove this gate notices.
  ci-vet:
    kind: static
    run: [go, vet, -mod=vendor, ./...]
    workdir: free/ci
    env:
      CGO_ENABLED: "0"
    timeout: 600s
    when:
      paths: [free/ci/**]

  ci-test:
    kind: test
    run: [go, test, -mod=vendor, -count=1, ./internal/model/..., ./internal/config/..., ./internal/evidence/..., ./internal/protect/..., ./architecture/...]
    workdir: free/ci
    env:
      CGO_ENABLED: "0"
    timeout: 900s
    when:
      paths: [free/ci/**]

  # The cmd package holds the tests of `policy protect` and the error-code registry. The whole package is not
  # run here: TestArtifactsUsageListsEverySub is red on main (debt row for artifactsUsage), so only these
  # tests are named. Remove the -run filter when that debt row closes.
  ci-test-cmd:
    kind: test
    run: [go, test, -mod=vendor, -count=1, -run, "TestPolicyProtect|TestCodeRegistry", ./cmd/]
    workdir: free/ci
    env:
      CGO_ENABLED: "0"
    timeout: 900s
    when:
      paths: [free/ci/**]

  # plugin-gauth (converted by hand from free/plugin-gauth/.ci.yaml, P7-CI-36).
  # Registers the crate so merges are blocked until clippy and the unit tests
  # pass. Google OAuth credentials are not needed for the unit tests.
  gauth-clippy:
    kind: static
    run: [cargo, clippy, --all-targets, --all-features, --, --deny, warnings]
    workdir: free/plugin-gauth
    timeout: 180s
    when:
      paths: [free/plugin-gauth/**]

  gauth-test:
    kind: test
    run: [cargo, test, --all-features]
    workdir: free/plugin-gauth
    timeout: 300s
    when:
      paths: [free/plugin-gauth/**]

  # Needs a database and an encryption key, so it is optional: without both
  # variables the job is skipped, and a skipped optional job does not fail the
  # run (a skipped required job would, Epic D28).
  gauth-integration:
    kind: test
    run: [cargo, test, --test, integration_refresh, --all-features]
    workdir: free/plugin-gauth
    timeout: 300s
    required: false
    when:
      paths: [free/plugin-gauth/**]
      env_present: [NSELF_DB_URL, GAUTH_ENCRYPTION_KEY]

# Drill jobs that build and run nself-ci themselves (P7-CI-47). A job defined here replaces the discovered one of the same
# name; these two take minutes, so they get a timeout beyond the 10 minute default.
  drill-scenario-01-local-only:
    kind: drill
    run: [./scripts/drill/scenario-01-local-only/run]
    timeout: 30m
  drill-scenario-12-external-consumer:
    kind: drill
    run: [./scripts/drill/scenario-12-external-consumer/run]
    timeout: 30m

# Drill jobs that build and run nself-ci themselves (P7-CI-47). A job defined here replaces the discovered one of the same
# name; these two take minutes, so they get a timeout beyond the 10 minute default.
  drill-scenario-01-local-only:
    kind: drill
    run: [./scripts/drill/scenario-01-local-only/run]
    timeout: 30m
  drill-scenario-12-external-consumer:
    kind: drill
    run: [./scripts/drill/scenario-12-external-consumer/run]
    timeout: 30m

# Pipelines. `drills` is a scheduled pipeline of `kind: drill` jobs (P7-CI-02):
# every directory of scripts/drill that holds an executable `run` is one job,
# so adding a drill needs no edit here (scripts/drill/README.md). The drills
# live outside free/ci because the plugin tarball ships the whole plugin
# directory (Epic D17). max_age is what `nself ci evidence --pipeline drills`
# reports as overdue (exit 10) when a drill has not passed within it.
pipelines:
  drills:
    triggers: [schedule, manual]
    schedule: "17 3 * * *"
    max_age: 36h
    drills_dir: scripts/drill
