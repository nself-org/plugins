# nself-ci configuration for the plugins repo (contract:ci.pipeline-config v1).
#
# Purpose: declare the jobs `nself ci` plans for this repository. Later Tickets
#   (P7-CI-02, 07, 08) add the drill, policy and truth-gate jobs to this file.
# Precedence: flag > env > this file > detected default (`nself ci config show`).

version: 1

jobs:
  # plugin-gauth (converted by hand from free/plugin-gauth/.ci.yaml, P7-CI-36).
  # Registers the crate so merges are blocked until clippy and the unit tests
  # pass. Google OAuth credentials are not needed for the unit tests.
  gauth-clippy:
    kind: static
    run: [cargo, clippy, --all-targets, --all-features, --, --deny, warnings]
    workdir: free/plugin-gauth
    timeout: 180s
    when:
      paths: [free/plugin-gauth/**]

  gauth-test:
    kind: test
    run: [cargo, test, --all-features]
    workdir: free/plugin-gauth
    timeout: 300s
    when:
      paths: [free/plugin-gauth/**]

  # Needs a database and an encryption key, so it is optional: without both
  # variables the job is skipped, and a skipped optional job does not fail the
  # run (a skipped required job would, Epic D28).
  gauth-integration:
    kind: test
    run: [cargo, test, --test, integration_refresh, --all-features]
    workdir: free/plugin-gauth
    timeout: 300s
    required: false
    when:
      paths: [free/plugin-gauth/**]
      env_present: [NSELF_DB_URL, GAUTH_ENCRYPTION_KEY]

# Drill jobs that build and run nself-ci themselves (P7-CI-47). A job defined here replaces the discovered one of the same
# name; these two take minutes, so they get a timeout beyond the 10 minute default.
  drill-scenario-01-local-only:
    kind: drill
    run: [./scripts/drill/scenario-01-local-only/run]
    timeout: 30m
  drill-scenario-12-external-consumer:
    kind: drill
    run: [./scripts/drill/scenario-12-external-consumer/run]
    timeout: 30m

# Pipelines. `drills` is a scheduled pipeline of `kind: drill` jobs (P7-CI-02):
# every directory of scripts/drill that holds an executable `run` is one job,
# so adding a drill needs no edit here (scripts/drill/README.md). The drills
# live outside free/ci because the plugin tarball ships the whole plugin
# directory (Epic D17). max_age is what `nself ci evidence --pipeline drills`
# reports as overdue (exit 10) when a drill has not passed within it.
pipelines:
  drills:
    triggers: [schedule, manual]
    schedule: "17 3 * * *"
    max_age: 36h
    drills_dir: scripts/drill
