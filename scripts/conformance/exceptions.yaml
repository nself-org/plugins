# Conformance gate exceptions (PLUG epic D13). One entry per rule and plugin.
# Rule cli-targets (P7-PLUG-55): the release builds no binary for the plugin until the Ticket in owner_ref fixes its manifest.
# Fields: rule, plugin, reason, owner_ref, expires (YYYY-MM-DD, at or before the v1.5.0 release).
# An expired entry fails the gate. Remove an entry when its owner Ticket lands.
exceptions:
  - rule: cli-targets
    plugin: content-acquisition
    reason: "declares subcommands (init, server, ...) as cliCommands: would ship core-verb binaries"
    owner_ref: P7-PLUG-41
    expires: 2026-12-31
  - rule: cli-targets
    plugin: subtitle-manager
    reason: "declares subcommands (init, server, ...) as cliCommands: would ship core-verb binaries"
    owner_ref: P7-PLUG-46
    expires: 2026-12-31
  - rule: cli-targets
    plugin: torrent-manager
    reason: "declares subcommands (init, server, ...) as cliCommands: would ship core-verb binaries"
    owner_ref: P7-PLUG-47
    expires: 2026-12-31
  - rule: cli-targets
    plugin: vpn
    reason: "declares subcommands (init, status, ...) as cliCommands: would ship core-verb binaries"
    owner_ref: P7-PLUG-47
    expires: 2026-12-31
  # Rule migration-idempotent (D-0619): the stricter DO-block lint no longer treats a BEGIN..EXCEPTION block whose handler
  # catches unrelated errors as replay protection. webhooks 002 runs `ALTER TABLE ... ADD COLUMN IF NOT EXISTS` through
  # EXECUTE format() in a loop (replay-safe, but the lint cannot read dynamic SQL).
  - rule: migration-idempotent
    plugin: webhooks
    reason: "002_add_source_account_id.sql line 78 adds a column with ADD COLUMN IF NOT EXISTS inside EXECUTE format() in a loop; the lint cannot read dynamic SQL"
    owner_ref: D-0619
    expires: 2026-12-31
