# NSELF-FIRST EXCEPTION: plugin-fragment — hand-authored plugin service definition, merged by `nself build`. Not side-channel.
services:
  plugin-gamma:
    build:
      context: ${NSELF_PLUGIN_DIR}/gamma
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_plugin_gamma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3903:3903"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      - PORT=3903
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3903/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ${DOCKER_NETWORK}
