# CLI binary-target blocks (P7-PLUG-55). One entry per blocked plugin: the release builds no binary for it
# until its manifest is fixed by the batch Ticket in owner_ref. Rule: cli-targets. Same fields and cap as
# scripts/conformance/exceptions.yaml (checked by scripts/conformance/rules/exceptions.sh; expiry is capped
# at the v1.5.0 release window). Remove an entry when its Ticket lands.
exceptions:
  - rule: cli-targets
    plugin: content-acquisition
    reason: "declares subcommands (init, server, ...) as cliCommands: would ship core-verb binaries"
    owner_ref: P7-PLUG-41
    expires: 2026-12-31
