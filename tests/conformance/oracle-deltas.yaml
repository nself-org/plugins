# Intentional differences the v1.4.12 oracle accepts between a v1 original and its converted twin.
# Fields: slug (the plugin under test the row belongs to), file (the oracle output file), key, from, to,
# owner_ref, expires (YYYY-MM-DD, at or before the v1.5.0 cap fixed in scripts/conformance/lib.sh).
# Matching is literal and per file; a row that matches nothing while its slug is under test is stale and fails;
# an expired row fails. See scripts/conformance/oracle/deltas.sh.
#   from "-": key is the exact whole line the converted output has and the original lacks.
#   to "-":   key is the exact whole line only the ORIGINAL has (removed from the original side; write from "-").
#   otherwise: in `file`, lines containing the literal key have `to` replaced by `from` on the converted side.
deltas:
  # 2026-10-13 P7-PLUG-44: the nself-cloud / nself-sync port rows are gone. Both plugins are kind library (no compose
  # fragment in the original or the twin, D-0066), so neither side produces a compose service line to differ on.
  # v1.4.12 reads dependencies as a JSON array only. The object form {required, optional} that 115 free manifests
  # use makes it drop the whole plugin when it wires PLUGIN_<DEP>_INTERNAL_URL, so a v1 original with the object
  # form never gets the line and its converted twin (array form) does. Batches that convert a depended-on plugin
  # add the same row for it (owner: that batch Ticket).
  - slug: beta
    file: compose-env-urls.txt
    key: "PLUGIN_BETA_INTERNAL_URL=http://plugin-beta:3902"
    from: "-"
    to: "http://plugin-beta:3902"
    owner_ref: P7-PLUG-03
    expires: 2026-12-31
  - slug: gamma
    file: compose-env-urls.txt
    key: "PLUGIN_GAMMA_INTERNAL_URL=http://plugin-gamma:3903"
    from: "-"
    to: "http://plugin-gamma:3903"
    owner_ref: P7-PLUG-03
    expires: 2026-12-31
  # 2026-10-13 P7-PLUG-45: payments lists paypal as an optional dependency in the object form; its converted twin
  # uses the array form v1.4.12 reads, so paypal (converted in the same batch) gains PLUGIN_PAYPAL_INTERNAL_URL.
  - slug: paypal
    file: compose-env-urls.txt
    key: "PLUGIN_PAYPAL_INTERNAL_URL=http://plugin-paypal:3071"
    from: "-"
    to: "http://plugin-paypal:3071"
    owner_ref: P7-PLUG-45
    expires: 2026-12-31
