services:
  observability:
    build:
      context: ${NSELF_PLUGIN_DIR}/observability
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_observability
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3215:3215"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3215"
      OBSERVABILITY_WATCHDOG_ENABLED: "true"
      OBSERVABILITY_CHECK_INTERVAL: "30"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3215/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
