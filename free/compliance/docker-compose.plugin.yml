version: "3.8"

services:
  compliance:
    build:
      context: .
      dockerfile: Dockerfile
    image: nself/nself-compliance:latest
    container_name: nself_compliance
    restart: unless-stopped
    ports:
      - "127.0.0.1:3211:3211"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - COMPLIANCE_PLUGIN_PORT=3211
      - COMPLIANCE_PLUGIN_HOST=0.0.0.0
      - COMPLIANCE_API_KEY=${COMPLIANCE_API_KEY:-}
      - COMPLIANCE_LOG_LEVEL=${COMPLIANCE_LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3211/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
