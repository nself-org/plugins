# np_vendor_registry — SOC 2 vendor registry (CC9) — S1.T11
#
# Convention Wall (PPI Hard Rule 2026-04-20):
#   tenant_id UUID — Cloud multi-tenancy column. Row filter enforced on all read roles.
#   R3-PATTERN (cont.15 fix, S40-fix): pure _eq filter — no _or, no _is_null arm.
#   Self-host: tenant_id IS NULL rows are unreachable via this filter (fail-closed, no leak).
#   Cloud: tenant_id = X-Hasura-Tenant-Id — strict per-tenant isolation.
#   Fixed per CR-C gate 2026-05-17.
#
# Multi-tenancy: Convention B (Cloud multi-tenancy) — tenant_id UUID.
#
# Roles:
#   user             — self-host user; reads metadata columns (not data_shared)
#   tenant_user      — Cloud user; same read scope as user role (R3-PATTERN, added S40-fix)
#   compliance_admin — full CRUD
#
# Security: data_shared excluded from user/tenant_user roles (vendor PII surface).
# R3-T0 note: Cloud principals use tenant_user role; user role is self-host only.

- table:
    schema: public
    name: np_vendor_registry
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - tenant_id
          - vendor_name
          - risk_tier
          - last_reviewed
          - baa_signed
          - created_at
          - updated_at
        filter:
          tenant_id:
            _eq: X-Hasura-Tenant-Id

    - role: tenant_user
      permission:
        columns:
          - id
          - tenant_id
          - vendor_name
          - risk_tier
          - last_reviewed
          - baa_signed
          - created_at
          - updated_at
        filter:
          tenant_id:
            _eq: X-Hasura-Tenant-Id

    - role: compliance_admin
      permission:
        columns: '*'
        filter:
          tenant_id:
            _eq: X-Hasura-Tenant-Id
  insert_permissions:
    - role: compliance_admin
      permission:
        columns:
          - id
          - tenant_id
          - vendor_name
          - data_shared
          - risk_tier
          - last_reviewed
          - baa_signed
        check:
          tenant_id:
            _eq: X-Hasura-Tenant-Id
  update_permissions:
    - role: compliance_admin
      permission:
        columns:
          - vendor_name
          - data_shared
          - risk_tier
          - last_reviewed
          - baa_signed
          - updated_at
        filter:
          tenant_id:
            _eq: X-Hasura-Tenant-Id
  delete_permissions:
    - role: compliance_admin
      permission:
        filter:
          tenant_id:
            _eq: X-Hasura-Tenant-Id
