services:
  plugin-siem:
    build:
      context: ${NSELF_PLUGIN_DIR}/siem
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_plugin-siem
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SIEM_PORT: "8002"
      SIEM_HOST: 0.0.0.0
      NSELF_SIEM: ${NSELF_SIEM:-}
      NSELF_SIEM_HF: ${NSELF_SIEM_HF:-}
      NSELF_SIEM_DEFAULT_SCHEMA: ${NSELF_SIEM_DEFAULT_SCHEMA:-ocsf}
      NSELF_SIEM_BATCH_SIZE: ${NSELF_SIEM_BATCH_SIZE:-500}
      NSELF_SIEM_FLUSH_INTERVAL: ${NSELF_SIEM_FLUSH_INTERVAL:-30}
      NSELF_SIEM_LOKI_URL: ${NSELF_SIEM_LOKI_URL:-http://loki:3100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
