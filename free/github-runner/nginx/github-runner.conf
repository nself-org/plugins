server {
    listen 443 ssl;
    http2 on;
    server_name github-runner.${BASE_DOMAIN};

    ssl_certificate /etc/nginx/ssl/${SSL_DIR}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/${SSL_DIR}/privkey.pem;

    # Private by default (D-0616): nginx refuses every caller except its own loopback.
    # Operators reach the API on the host loopback port; to expose it, add your own
    # server block with authentication. Set at server level so every location inherits it.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://github-runner:3054;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
