services:
  entitlements:
    build:
      context: ${NSELF_PLUGIN_DIR}/entitlements
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_entitlements
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3715:3715"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3715"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3715/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
