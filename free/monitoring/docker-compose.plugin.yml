# NSELF-FIRST EXCEPTION: plugin-fragment — hand-authored plugin service definition, merged by `nself build`. Not side-channel.
# Monitoring Plugin - Docker Compose Services
# All 10 monitoring services for the nself monitoring stack.
#
# Required env vars (from .env.computed):
#   COMPOSE_PROJECT_NAME - Project name prefix for container names
#   DOCKER_NETWORK       - Docker network name
#   POSTGRES_USER        - PostgreSQL username (for postgres-exporter)
#   POSTGRES_PASSWORD    - PostgreSQL password (for postgres-exporter)
#   POSTGRES_DB          - PostgreSQL database (for postgres-exporter)
#
# Optional env vars:
#   GRAFANA_ADMIN_USER       - Grafana admin username (default: admin)
#   GRAFANA_ADMIN_PASSWORD   - Grafana admin password (default: admin)
#   PROMETHEUS_TSDB_RETENTION_TIME - Prometheus data retention (default: 15d)
#   LOKI_RETENTION_DAYS      - Loki log retention in days (informational — applied in loki config)
#   REDIS_ENABLED            - Set to "true" to include redis-exporter

services:
  # --- Metrics Collection ---

  prometheus:
    image: docker.io/prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    container_name: ${COMPOSE_PROJECT_NAME}_prometheus
    user: "65534:65534"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_TSDB_RETENTION_TIME:-15d}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - "${DOCKER_NETWORK}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Visualization ---

  grafana:
    image: docker.io/grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    container_name: ${COMPOSE_PROJECT_NAME}_grafana
    user: "472:472"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_ROUTE:-grafana}.${BASE_DOMAIN:-localhost}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - "${DOCKER_NETWORK}"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- Log Aggregation ---

  loki:
    image: docker.io/grafana/loki:3.1.0@sha256:d947e68a84d9e44915dfa08c3bec27e2124efd5ba6c83443eb53578101ec69e3
    container_name: ${COMPOSE_PROJECT_NAME}_loki
    user: "10001:10001"
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - "${DOCKER_NETWORK}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Grafana Alloy replaces Promtail (end of life). It tails the Docker json-file logs from disk and pushes them to Loki.
  # It never talks to the Docker socket: no discovery.docker, no socket mount (ADR 0027). Runs as root because
  # /var/lib/docker/containers is root-only (mode 0710), the same as the Promtail it replaces. Telemetry is off.
  alloy:
    image: docker.io/grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: ${COMPOSE_PROJECT_NAME}_alloy
    restart: unless-stopped
    command:
      - "run"
      - "--disable-reporting"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - "${DOCKER_NETWORK}"
    depends_on:
      loki:
        condition: service_healthy

  # --- Distributed Tracing ---

  # NOTE: Tempo uses a distroless image with no shell. Do NOT add a healthcheck.
  tempo:
    image: docker.io/grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    container_name: ${COMPOSE_PROJECT_NAME}_tempo
    user: "10001:10001"
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:14268:14268"
    networks:
      - "${DOCKER_NETWORK}"

  # --- Alerting ---

  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: ${COMPOSE_PROJECT_NAME}_alertmanager
    user: "65534:65534"
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - "${DOCKER_NETWORK}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Exporters ---

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    container_name: ${COMPOSE_PROJECT_NAME}_cadvisor
    restart: unless-stopped
    volumes:
      # The host root is mounted NON-recursively: a recursive bind would also expose the Docker API socket under /rootfs/run (ADR 0027).
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          recursive: disabled
      # cAdvisor reads /rootfs/proc/cpuinfo, which lives in a submount that the non-recursive bind hides.
      - /proc:/rootfs/proc:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - "${DOCKER_NETWORK}"

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.1@sha256:fa7fa12a57eff607176d5c363d8bb08dfbf636b36ac3cb5613a202f3c61a6631
    container_name: ${COMPOSE_PROJECT_NAME}_node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Non-recursive for the same reason as cadvisor: a recursive bind exposes the Docker API socket under /rootfs/run (ADR 0027).
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          recursive: disabled
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - "${DOCKER_NETWORK}"

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    container_name: ${COMPOSE_PROJECT_NAME}_postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - "${DOCKER_NETWORK}"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Optional: Redis Exporter ---
  # Only useful if REDIS_ENABLED=true in your .env.
  # If Redis is not part of your stack, this service will fail to connect.
  # To exclude it, remove or comment out this block.
  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.61.0@sha256:4d0bf00eeb6b22d60acc65db79a8c324e3c18c959518c67fc65694770d5c8d72
    container_name: ${COMPOSE_PROJECT_NAME}_redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - "${DOCKER_NETWORK}"
    profiles:
      - redis

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:
  alloy_data:
