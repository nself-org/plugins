# np_cloud_instances — provisioned VPS instances
#
# Convention Wall (PPI Hard Rule 2026-04-20):
#   tenant_id UUID — Cloud multi-tenancy column.
#   Row filter enforced on nself_user role: {"tenant_id":{"_eq":"X-Hasura-Tenant-Id"}}
#   RLS: ENABLE + FORCE ROW LEVEL SECURITY applied in migration 001.
#
# Roles:
#   anonymous   — no access
#   nself_user  — read own instances (tenant_id filter); no direct write (API layer only)
#   nself_admin — full access (no filter)

- table:
    schema: public
    name: np_cloud_instances
  select_permissions:
    - role: nself_user
      permission:
        columns:
          - id
          - tenant_id
          - slug
          - region
          - server_type
          - ipv4
          - status
          - provision_started_at
          - provision_finished_at
          - last_health_check_at
          - health_status
          - nself_version
          - ssl_status
          - custom_domain
          - domain_verified
          - lets_encrypt_issued
          - hourly_rate_cents
          - created_at
          - updated_at
        filter:
          tenant_id:
            _eq: X-Hasura-Tenant-Id
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
  insert_permissions:
    - role: nself_admin
      permission:
        columns: '*'
        check: {}
  update_permissions:
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
  delete_permissions:
    - role: nself_admin
      permission:
        filter: {}
