# nself-jobs: nginx reverse proxy config
#
# nself build copies this file into nginx/sites/ (included at http{} level),
# so it is a full server block served at jobs.${BASE_DOMAIN}. The plugin is
# reached by its compose service name (nself-jobs) on the project network.
# Loopback callers only (see the gate below).

server {
    listen 443 ssl;
    http2 on;
    server_name jobs.${BASE_DOMAIN};

    ssl_certificate /etc/nginx/ssl/${SSL_DIR}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/${SSL_DIR}/privkey.pem;

    # Private by default (D-0616). The plugin API has no authentication, so
    # nginx refuses every caller except the nginx container's own loopback.
    # Private address ranges are not allowed on purpose: behind Docker's
    # userland proxy (IPv6 clients, Docker Desktop, rootless Docker) or a
    # tunnel container, internet traffic arrives from a private address.
    # Operators reach the API on the host loopback port instead; to expose it,
    # add your own server block with authentication (see the plugin README).
    # Set at server level so every location inherits it; a location must not
    # declare its own allow/deny (scripts/ci/tests/test_plugin_nginx_access_gate.py).
    allow 127.0.0.1;
    allow ::1;
    deny all;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://nself-jobs:3105;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
