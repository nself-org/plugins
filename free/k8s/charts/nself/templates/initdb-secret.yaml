{{- /*
Postgres init scripts (compose bind mount /docker-entrypoint-initdb.d): one
Secret per service that lists `initdb` names. The script CONTENTS come from
secrets.yaml (.Values.initdb.<service>.<name>), because an init script may hold
a password; values.yaml carries only the names. A .sql.gz script arrives as
base64 text and goes into `data`; the others are plain text in `stringData`.
The Secret is mounted at /docker-entrypoint-initdb.d (see nself.pod).
*/ -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.initdb }}
{{- $files := index (default dict $.Values.initdb) $name | default dict }}
{{- $text := dict }}
{{- $bin := dict }}
{{- range $svc.initdb }}
{{- if not (hasKey $files .) }}
{{- fail (printf "secrets.yaml has no initdb content for %s of service %s: pass -f secrets.yaml" . $name) }}
{{- end }}
{{- if hasSuffix ".gz" . }}{{ $_ := set $bin . (index $files .) }}{{ else }}{{ $_ := set $text . (index $files .) }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-initdb
  labels:
    {{- include "nself.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
{{- if $text }}
stringData:
  {{- range $k, $v := $text }}
  {{ $k | toJson }}: {{ $v | toJson }}
  {{- end }}
{{- end }}
{{- if $bin }}
data:
  {{- range $k, $v := $bin }}
  {{ $k | toJson }}: {{ $v | toJson }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
