{{- /* Every named compose volume becomes one PersistentVolumeClaim. */ -}}
{{- range $vol, $v := .Values.volumes }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-{{ $v.claim }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ default $.Values.storage $v.storage }}
{{- end }}
