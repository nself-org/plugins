{{- /* Env values live in secrets.yaml (.Values.secrets), one Secret per service. */ -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.env (ne $svc.kind "ingress") }}
{{- $vals := index (default dict $.Values.secrets) $name | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "nself.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $svc.env }}
  {{- if not (hasKey $vals .) }}
  {{- fail (printf "secrets.yaml has no value for %s of service %s: pass -f secrets.yaml" . $name) }}
  {{- end }}
  {{ . }}: {{ index $vals . | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
