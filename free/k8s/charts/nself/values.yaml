# nSelf Helm chart defaults. The chart is generic: every workload comes from
# `services`, `volumes` and `ingress.rules`, which `nself k8s values` writes to
# .nself/generated/k8s/values.yaml from the project's compose model. Env values
# come from the generated secrets.yaml (mode 0600). Install with:
#   helm install nself . -f values.yaml -f secrets.yaml
# No image reference is typed in this chart.

# domain is the base domain of the deployment. When it and baseDomain (the
# project's BASE_DOMAIN, generated) are both set and differ, every ingress host
# equal to baseDomain becomes domain and a host ending in ".<baseDomain>" keeps
# its prefix with the new domain (TLS hosts and NOTES follow). Other hosts stay.
domain: ""
# baseDomain is generated by `nself k8s values`; empty means no rewrite.
baseDomain: ""

# license names a Kubernetes Secret that already exists in the release
# namespace. When secretName is set, every plugin workload (named plugin-*, or
# marked `plugin` in the generated values) gets the env NSELF_PLUGIN_LICENSE_KEY
# from key secretKey of that Secret (secretKeyRef). `nself k8s values` never maps
# that env as a value, so nothing else sets it. The key value is never a chart value: `nself k8s install --license-secret <name>`
# writes only the Secret name here.
license:
  secretName: ""
  secretKey: NSELF_PLUGIN_LICENSE_KEY

# plugins.install lists plugin names to check. Each must exist as the service
# plugin-<name> in `services`, else the render fails (run `nself plugin install
# <name>`, then `nself k8s values`). It adds no workload by itself.
plugins:
  install: []

# services, volumes, secrets and ingress.rules are generated. Keys per service:
# kind (deployment, statefulset, job), image, tag, digest, entrypoint, command,
# env (names), ports, mounts, probe, initdb (script names), notMapped; optional
# replicas and resources.
services: {}
volumes: {}
secrets: {}
# initdb is generated into secrets.yaml: service -> script name -> content
# (a .sql.gz script is base64 text). One Secret per service, mounted read-only
# at /docker-entrypoint-initdb.d.
initdb: {}
unsupported: []
unmappedRoutes: []

ingress:
  # className selects the ingress controller (empty: cluster default).
  className: ""
  rules: []

tls:
  enabled: true
  # certManager asks cert-manager (installed in the cluster) to issue the
  # certificate of each Ingress through the ClusterIssuer issuerName.
  certManager: true
  issuerName: letsencrypt-prod

# Size of every PersistentVolumeClaim (a volume may set its own `storage`).
storage: 10Gi
# storageClass for the PVCs; empty uses the cluster default.
storageClass: ""
