location /plugins/web3/ {
    # Docker's DNS. A variable in proxy_pass makes nginx resolve the name per
    # request, so nginx still starts while the plugin container is down.
    resolver 127.0.0.11 valid=10s;
    set $upstream_web3 web3:3128;
    # proxy_pass carries no URI: with a variable, a URI there replaces the whole
    # request path. The prefix is stripped here instead (D-0600).
    rewrite ^/plugins/web3/(.*)$ /$1 break;
    proxy_pass http://$upstream_web3;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 30s;
}
