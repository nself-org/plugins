services:
  web3:
    build:
      context: ${NSELF_PLUGIN_DIR}/web3
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_web3
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3128:3128"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3128"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3128/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
