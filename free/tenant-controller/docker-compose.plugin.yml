services:
  plugin-tenant-controller:
    build:
      context: ${NSELF_PLUGIN_DIR}/tenant-controller
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_plugin-tenant-controller
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3750:3750"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NSELF_CONTROLLER_PORT: "3750"
      NSELF_CONTROLLER_HOST: 0.0.0.0
      NSELF_CONTROLLER_ENABLED: ${NSELF_CONTROLLER_ENABLED:-false}
      NSELF_FLAG_MULTI_TENANT_CONTROLLER: ${NSELF_FLAG_MULTI_TENANT_CONTROLLER:-false}
      NSELF_FLAG_CLOUD_METERING: ${NSELF_FLAG_CLOUD_METERING:-false}
      NGINX_CONF_PATH: ${NGINX_CONF_PATH:-/etc/nginx/conf.d/nself-projects.conf}
      NSELF_CONTROLLER_ADMIN_TOKEN: ${NSELF_CONTROLLER_ADMIN_TOKEN}
      NSELF_CONTROLLER_BASE_DOMAIN: ${NSELF_CONTROLLER_BASE_DOMAIN}
      NSELF_CONTROLLER_MAX_PROJECTS: ${NSELF_CONTROLLER_MAX_PROJECTS:-50}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_ENDPOINT: ${HASURA_GRAPHQL_ENDPOINT}
      NSELF_PROJECT_SCHEMA_PREFIX: ${NSELF_PROJECT_SCHEMA_PREFIX:-project_}
      NSELF_PROJECT_REDIS_PREFIX: ${NSELF_PROJECT_REDIS_PREFIX:-proj:}
      NSELF_PROJECT_HASURA_PORT_START: ${NSELF_PROJECT_HASURA_PORT_START:-8080}
      REDIS_URL: ${REDIS_URL:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      NSELF_AUDIT_RETENTION_DAYS: ${NSELF_AUDIT_RETENTION_DAYS:-90}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HETZNER_NSELF_TOKEN: ${HETZNER_NSELF_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID_VCPU_HOUR: ${STRIPE_PRICE_ID_VCPU_HOUR:-}
      STRIPE_PRICE_ID_STORAGE_GB_MONTH: ${STRIPE_PRICE_ID_STORAGE_GB_MONTH:-}
      STRIPE_PRICE_ID_EGRESS_GB: ${STRIPE_PRICE_ID_EGRESS_GB:-}
      CLOUD_FREE_VCPU_HOURS: ${CLOUD_FREE_VCPU_HOURS:-}
      CLOUD_FREE_STORAGE_GB: ${CLOUD_FREE_STORAGE_GB:-}
      CLOUD_FREE_EGRESS_GB: ${CLOUD_FREE_EGRESS_GB:-}
      CLOUD_USAGE_ALERT_PCT: ${CLOUD_USAGE_ALERT_PCT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3750/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
