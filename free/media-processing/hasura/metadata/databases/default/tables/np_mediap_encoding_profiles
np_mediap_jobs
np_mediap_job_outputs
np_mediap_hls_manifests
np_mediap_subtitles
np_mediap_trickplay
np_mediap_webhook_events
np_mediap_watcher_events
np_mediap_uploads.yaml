- table:
    schema: public
    name: np_mediap_encoding_profiles
np_mediap_jobs
np_mediap_job_outputs
np_mediap_hls_manifests
np_mediap_subtitles
np_mediap_trickplay
np_mediap_webhook_events
np_mediap_watcher_events
np_mediap_uploads
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
        allow_aggregations: true
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
  insert_permissions:
    - role: user
      permission:
        columns: '*'
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
    - role: nself_admin
      permission:
        columns: '*'
        check: {}
  delete_permissions:
    - role: user
      permission:
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
    - role: nself_admin
      permission:
        filter: {}
