# traefik plugin (ADR 0027): the proxy swap. traefik-config renders .nself/generated/routes.json into Traefik
# file-provider configuration, traefik-acme serves the ACME webroot and fixed answers, traefik is the official
# image pinned by tag and digest. No Docker provider, no Docker socket, no ACME resolver; ssl/ is read-only.
# Build context is anchored with NSELF_PLUGIN_DIR: compose resolves relative paths against the first -f file.
services:
  traefik-config:
    build:
      context: ${NSELF_PLUGIN_DIR}/traefik
      dockerfile: Dockerfile
    image: nself/nself-traefik-render:local
    restart: "no"
    command: ["--routes", "/nself/routes.json", "--out", "/dynamic", "--ssl", "/nself/ssl"]
    volumes:
      - ./.nself/generated/routes.json:/nself/routes.json:ro
      - ./ssl:/nself/ssl:ro
      - ./.nself/generated/traefik:/dynamic
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - nself_network

  traefik-acme:
    image: nself/nself-traefik-render:local
    entrypoint: ["/render"]
    command: ["serve-static", "--root", "/acme-webroot", "--listen", ":8080"]
    restart: unless-stopped
    volumes:
      - ./ssl/.acme-webroot:/acme-webroot:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/render", "healthcheck", "--addr", "127.0.0.1:8080"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      traefik-config:
        condition: service_completed_successfully
    networks:
      - nself_network

  traefik:
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    restart: unless-stopped
    ports:
      - "${NSELF_HTTP_PORT:-80}:80"
      - "${NSELF_HTTPS_PORT:-443}:443"
    volumes:
      - ${NSELF_PLUGIN_DIR}/traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./.nself/generated/traefik:/dynamic:ro
      - ./ssl:/nself/ssl:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      traefik-config:
        condition: service_completed_successfully
      traefik-acme:
        condition: service_healthy
    networks:
      - nself_network

networks:
  nself_network:
    external: true
