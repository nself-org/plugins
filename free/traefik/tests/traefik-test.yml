# TEST-ONLY static configuration: the shipped one plus api.insecure so the parity and golden tests can read /api/rawdata.
# No Docker provider, no socket, no certificatesResolvers (certificates are core-issued and read from ssl/).
global:
  checkNewVersion: false
  sendAnonymousUsage: false
# allowEncodedSlash: false makes %2F a 400. nginx decodes it and merges the path before matching, so blocked paths and
# deny_all prefixes hold there; Traefik matches the still-encoded path, so /x/..%2f.env would reach the upstream.
# Timeouts follow nginx where Traefik can. readTimeout 60s is the nginx client_header_timeout: a request whose
# headers are not complete after 60 s is closed (Traefik v3 has no separate header timeout, so a finite readTimeout is
# the only slowloris guard; 0s would keep such connections open forever). It is also a TOTAL deadline for the body,
# where nginx client_body_timeout times each gap between reads: an upload must finish within 60 s (accepted
# difference, wiki). Hijacked connections (websockets) lose the deadline, so an idle websocket survives. idleTimeout
# 65s is nginx keepalive_timeout 65. writeTimeout 0s: nginx send_timeout times each gap between writes, a total
# deadline here would cut large downloads. Upstream timeouts come from the rendered serversTransports.
entryPoints:
  web:
    address: ":80"
    http:
      encodedCharacters:
        allowEncodedSlash: false
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 65s
  websecure:
    address: ":443"
    http:
      encodedCharacters:
        allowEncodedSlash: false
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 65s
  traefik:
    address: ":8082"
ping:
  entryPoint: traefik
providers:
  file:
    directory: /dynamic
    watch: true
log:
  level: DEBUG
accessLog: {}
api:
  insecure: true
