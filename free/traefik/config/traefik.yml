# Static configuration for the Traefik container (ADR 0027): file provider only.
# No Docker provider, no socket, no certificatesResolvers (certificates are core-issued and read from ssl/).
global:
  checkNewVersion: false
  sendAnonymousUsage: false
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8082"
ping:
  entryPoint: traefik
providers:
  file:
    directory: /dynamic
    watch: true
log:
  level: INFO
accessLog: {}
