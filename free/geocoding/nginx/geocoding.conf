upstream geocoding_backend {
    server geocoding:3856;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name geocoding.${NSELF_DOMAIN};

    ssl_certificate     /etc/nginx/ssl/${NSELF_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/${NSELF_DOMAIN}/privkey.pem;

    client_max_body_size 5m;

    # Private by default (D-0616): nginx refuses every caller except its own loopback.
    # Operators reach the API on the host loopback port; to expose it, add your own
    # server block with authentication. Set at server level so every location inherits it.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    location / {
        proxy_pass         http://geocoding_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://geocoding_backend/health;
        access_log off;
    }
}
