services:
  retro-gaming:
    build:
      context: ${NSELF_PLUGIN_DIR}/retro-gaming
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_retro-gaming
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3124:3124"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3124"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3124/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
