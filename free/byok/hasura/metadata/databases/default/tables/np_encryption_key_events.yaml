# np_encryption_key_events — Key rotation and event audit trail (S1.T12)
#
# Convention Wall (PPI Hard Rule 2026-04-20):
#   tenant_id UUID — Cloud multi-tenancy column. Row filter enforced on all read roles.
#   R3-PATTERN (cont.15 fix, S40-fix): pure _eq filter — no _or, no _is_null arm.
#   Self-host: tenant_id IS NULL rows are unreachable via this filter (fail-closed, no leak).
#   Cloud: tenant_id = X-Hasura-Tenant-Id — strict per-tenant isolation.
#   Fixed per CR-C gate 2026-05-17.
#
# Multi-tenancy: Convention B (Cloud multi-tenancy) — tenant_id UUID.
# Row filter enforced on all role reads.
#
# Roles:
#   user         — self-host user; read-only access to own tenant key events
#   tenant_user  — Cloud user; same read scope as user role (R3-PATTERN, added S40-fix)
#   nself_admin  — full CRUD
#
# All columns are safe to expose to user/tenant_user roles (no raw ciphertext here).
# R3-T0 note: Cloud principals use tenant_user role; user role is self-host only.

table:
  schema: public
  name: np_encryption_key_events

configuration:
  custom_root_fields:
    select: byok_key_events
    select_by_pk: byok_key_event
    select_aggregate: byok_key_events_aggregate
  column_config: {}

select_permissions:
  - role: user
    permission:
      columns:
        - id
        - tenant_id
        - event_type
        - key_ref
        - triggered_by
        - occurred_at
        - details
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      allow_aggregations: true

  - role: tenant_user
    permission:
      columns:
        - id
        - tenant_id
        - event_type
        - key_ref
        - triggered_by
        - occurred_at
        - details
      filter:
        tenant_id:
          _eq: X-Hasura-Tenant-Id
      allow_aggregations: true

  - role: nself_admin
    permission:
      columns: '*'
      filter: {}
      allow_aggregations: true

insert_permissions:
  - role: nself_admin
    permission:
      check: {}
      columns:
        - tenant_id
        - event_type
        - key_ref
        - triggered_by
        - occurred_at
        - details

update_permissions:
  - role: nself_admin
    permission:
      columns:
        - details
      filter: {}
      check: {}

delete_permissions:
  - role: nself_admin
    permission:
      filter: {}
