# np_storage_metadata — Object metadata key-value pairs (plugin-storage port 9007)
#
# Convention Wall: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id": {"_eq": "X-Hasura-Source-Account-Id"}}

- table:
    schema: public
    name: np_storage_metadata
  object_relationships:
    - name: object
      using:
        foreign_key_constraint_on: object_id
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
        allow_aggregations: true
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
  insert_permissions:
    - role: user
      permission:
        columns:
          - source_account_id
          - object_id
          - key
          - value
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  delete_permissions:
    - role: user
      permission:
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
