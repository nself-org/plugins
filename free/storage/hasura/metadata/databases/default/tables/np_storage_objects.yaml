# np_storage_objects — Storage object records (plugin-storage port 9007)
#
# Convention Wall: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id": {"_eq": "X-Hasura-Source-Account-Id"}}

- table:
    schema: public
    name: np_storage_objects
  object_relationships:
    - name: bucket
      using:
        foreign_key_constraint_on: bucket_id
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
        allow_aggregations: true
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
  insert_permissions:
    - role: user
      permission:
        columns:
          - source_account_id
          - bucket_id
          - key
          - size_bytes
          - content_type
          - etag
          - metadata
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  delete_permissions:
    - role: user
      permission:
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
