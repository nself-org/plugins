# NSELF-FIRST EXCEPTION: plugin-fragment — hand-authored plugin service definition, merged by `nself build`. Not side-channel.

services:
  storage:
    build:
      context: ${NSELF_PLUGIN_DIR}/storage
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_storage
    restart: unless-stopped
    ports:
      - "127.0.0.1:9007:9007"
    environment:
      - NSELF_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENC:-${POSTGRES_PASSWORD}}@postgres:5432/${POSTGRES_DB}
      - STORAGE_PLUGIN_PORT=9007
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - STORAGE_MAX_LARGE_UPLOADS=${STORAGE_MAX_LARGE_UPLOADS:-}
      - STORAGE_MAX_UPLOADS=${STORAGE_MAX_UPLOADS:-}
      - STORAGE_UPLOAD_SLOT_WAIT=${STORAGE_UPLOAD_SLOT_WAIT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ${DOCKER_NETWORK}
