# np_email_templates — Email template store (plugin-email port 9008)
#
# Convention Wall: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id": {"_eq": "X-Hasura-Source-Account-Id"}}

- table:
    schema: public
    name: np_email_templates
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
        allow_aggregations: true
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
  insert_permissions:
    - role: user
      permission:
        columns:
          - source_account_id
          - name
          - subject
          - body_html
          - body_text
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - subject
          - body_html
          - body_text
          - updated_at
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  delete_permissions:
    - role: user
      permission:
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
