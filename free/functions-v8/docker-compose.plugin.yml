# NSELF-FIRST EXCEPTION: plugin-fragment — hand-authored plugin service definition, merged by `nself build`. Not side-channel.
# functions-v8 — edge functions plugin (Deno V8 isolate pool)
# Injected by: nself build → DiscoverPluginComposeFiles()
# Port: 3088 (F10-PORT-REGISTRY canonical)
# Generated by: plugins-pro canonical deploy pattern

version: "3.8"

services:
  functions-v8:
    build:
      context: ${NSELF_PLUGIN_DIR}/functions-v8
      dockerfile: Dockerfile
    image: functions-v8:latest
    container_name: functions-v8
    restart: unless-stopped
    environment:
      - FUNCTIONS_EDGE_PORT=3088
      - FUNCTIONS_EDGE_BIND_HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - DENO_BINARY_PATH=/usr/local/bin/deno
      - FUNCTIONS_EDGE_POOL_SIZE=${FUNCTIONS_EDGE_POOL_SIZE:-5}
      - FUNCTIONS_EDGE_MAX_DURATION_MS=${FUNCTIONS_EDGE_MAX_DURATION_MS:-30000}
      - FUNCTIONS_EDGE_MAX_MEMORY_MB=${FUNCTIONS_EDGE_MAX_MEMORY_MB:-128}
      - FUNCTIONS_EDGE_LOG_RETENTION_DAYS=${FUNCTIONS_EDGE_LOG_RETENTION_DAYS:-7}
      - PLUGIN_INTERNAL_SECRET=${PLUGIN_INTERNAL_SECRET:-}
    ports:
      - "127.0.0.1:3088:3088"
    networks:
      - ${DOCKER_NETWORK:-nself_network}
    healthcheck:
      test: ["CMD", "deno", "eval", "--allow-net=127.0.0.1:3088", "const r = await fetch('http://127.0.0.1:3088/health'); Deno.exit(r.ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
