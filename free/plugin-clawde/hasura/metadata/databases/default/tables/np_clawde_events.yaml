# np_clawde_events — append-only ClawDE event log (plugin-clawde port 3847)
#
# Multi-App Isolation Convention: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id":{"_eq":"X-Hasura-Source-Account-Id"}}

- table:
    schema: public
    name: np_clawde_events
  select_permissions:
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
    - role: nself_user
      permission:
        columns: [id, session_id, source_account_id, event_type, payload, created_at]
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  insert_permissions:
    - role: nself_user
      permission:
        columns: [session_id, source_account_id, event_type, payload]
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
