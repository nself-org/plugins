# np_clawde_sessions — ClawDE session lifecycle (plugin-clawde port 3847)
#
# Multi-App Isolation Convention: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id":{"_eq":"X-Hasura-Source-Account-Id"}}

- table:
    schema: public
    name: np_clawde_sessions
  select_permissions:
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
    - role: nself_user
      permission:
        columns: [id, source_account_id, status, created_at, last_heartbeat, closed_at]
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  insert_permissions:
    - role: nself_user
      permission:
        columns: [id, source_account_id, status]
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  update_permissions:
    - role: nself_user
      permission:
        columns: [status, last_heartbeat, closed_at]
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
        check: {}
  delete_permissions:
    - role: nself_user
      permission:
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
