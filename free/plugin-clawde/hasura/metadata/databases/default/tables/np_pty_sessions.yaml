# np_pty_sessions — PTY relay session tracking for nself-ai-cc :3760 (plugin-clawde E7)
#
# Multi-App Isolation Convention: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id":{"_eq":"X-Hasura-Source-Account-Id"}}

- table:
    schema: public
    name: np_pty_sessions
  select_permissions:
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
    - role: nself_operator
      permission:
        columns: [id, source_account_id, session_id, binary_path, args, status, started_at, ended_at]
        filter: {}
    - role: nself_user
      permission:
        columns: [id, source_account_id, session_id, status, started_at, ended_at]
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  insert_permissions:
    - role: nself_operator
      permission:
        columns: [source_account_id, session_id, binary_path, args, status]
        check: {}
  update_permissions:
    - role: nself_operator
      permission:
        columns: [status, ended_at]
        filter: {}
        check: {}
  delete_permissions:
    - role: nself_admin
      permission:
        filter: {}
