      - {name: "json", type: "bool", cli_only: true}
  - path: runs approve
    summary: "Approve a run that waits for approval"
    side_effect: remote
    output: document
    json: envelope
    confirm: {flags: []}
    args: [{name: run}]
    flags:
      - {name: "json", type: "bool", cli_only: true}
      - {name: "sha", type: "string"}
      - {name: "spend", type: "bool"}
  - path: runs cancel
    summary: "Cancel a run"
    side_effect: remote
    output: document
    json: envelope
    confirm: {flags: []}
    args: [{name: run}]
  - path: runs decisions
    summary: "Show the scheduling decisions of a run"
    side_effect: read
    output: document
    json: envelope
    args: [{name: run}]
  - path: runs follow
    summary: "Follow the events of a run as an NDJSON stream"
    side_effect: read
    output: stream
    json: envelope
    args: [{name: run}]
    flags:
      - {name: "coordinator", type: "string"}
      - {name: "from-seq", type: "int", default: "0"}
      - {name: "json", type: "bool", cli_only: true}
  - path: runs list
    summary: "List recent runs"
    side_effect: read
    output: document
    json: envelope
    flags:
      - {name: "json", type: "bool", cli_only: true}
      - {name: "limit", type: "int", default: "20"}
      - {name: "repo", type: "string"}
  - path: runs outbox
    summary: "Show queued status and event deliveries"
    side_effect: read
    output: document
    json: envelope
  - path: runs pending
    summary: "List runs waiting for approval"
    side_effect: read
    output: document
    json: envelope
  - path: runs prune
    summary: "Remove old runs and logs (--dry-run previews; --tidy [--apply] also tidies cache and job roots)"
    side_effect: destructive
    output: document
    json: envelope
    confirm: {flags: []}
    flags:
      - {name: "apply", type: "bool"}
      - {name: "dry-run", type: "bool"}
      - {name: "json", type: "bool", cli_only: true}
      - {name: "keep", type: "int", default: "0"}
      - {name: "limit", type: "int", default: "20"}
      - {name: "max-age-days", type: "int", default: "0"}
      - {name: "max-log-bytes", type: "int"}
      - {name: "repo", type: "string"}
      - {name: "tidy", type: "bool"}
  - path: runs queue
    summary: "Show the run queue"
    side_effect: read
    output: document
    json: envelope
  - path: runs reproduce
    summary: "Reproduce a job at its recorded inputs"
    side_effect: remote
    output: document
    json: envelope
    confirm: {flags: []}
    args: [{name: job}]
    flags:
      - {name: "check", type: "bool"}
      - {name: "json", type: "bool", cli_only: true}
      - {name: "repo", type: "string"}
      - {name: "run", type: "string"}
      - {name: "shell", type: "bool"}
  - path: runs rerun
    summary: "Run a recorded revision again on a chosen target"
    side_effect: remote
    output: document
    json: envelope
    confirm: {flags: []}
    args: [{name: run-or-sha}]
    flags:
      - {name: "job", type: "string"}
      - {name: "json", type: "bool", cli_only: true}
      - {name: "repo", type: "string"}
      - {name: "where", type: "string"}
  - path: runs resolve
    summary: "Resolve a pending run decision"
    side_effect: write
    output: document
    json: envelope
    args: [{name: run}]
  - path: runs stats
    summary: "Show run statistics"
    side_effect: read
    output: document
    json: envelope
  - path: runs wait
    summary: "Wait for a run to finish and print its result"
    side_effect: read
    output: document
    json: envelope
    args: [{name: run}]
    flags:
      - {name: "coordinator", type: "string"}
      - {name: "json", type: "bool", cli_only: true}
      - {name: "timeout", type: "duration", default: "4m0s"}
  - path: serve
    summary: "Start the nself-ci webhook listener daemon (port 3845)"
    side_effect: write
    output: stream
    json: none
    surface: cli-only
    flags:
      - {name: "addr", type: "string", default: ":3845", usage: "Listen address (host:port). Port 3845 = nself-ci-serve per F10 port registry"}
      - {name: "allow-unsandboxed", type: "bool", default: "false", side_effect: "destructive", usage: "DANGEROUS: run the gate directly on this host when Docker is unavailable, instead of refusing the job. Default: refuse."}
      - {name: "allowed-repos", type: "stringSlice", default: "[]", usage: "Comma-separated or repeatable \"owner/repo\" allowlist. Default: empty, which rejects every job (fail-closed, no \"allow all\")."}
      - {name: "concurrency", type: "int", default: "2", usage: "Max concurrent CI jobs"}
      - {name: "insecure", type: "bool", default: "false", usage: "DANGEROUS: start without a webhook secret (disables signature verification). Default: refuse to start when no secret is configured."}
      - {name: "secret", type: "string", usage: "HMAC-SHA256 webhook secret (overrides GITHUB_WEBHOOK_SECRET env)"}
      - {name: "timeout", type: "int", default: "600", usage: "Per-job timeout in seconds"}
      - {name: "verbose", type: "bool", default: "false", shorthand: "v", usage: "Verbose gate output"}
      - {name: "workdir", type: "string", default: "/tmp/nself-ci-workdirs", usage: "Base directory for ephemeral checkout workdirs"}
  - path: serve admin
    summary: "Coordinator admin group help"
    side_effect: read
    output: document
    json: none
    surface: cli-only
  - path: serve admin audit
    summary: "Read or verify the audit log"
    side_effect: read
    output: document
    json: envelope
    flags:
      - {name: "json", type: "bool", cli_only: true}
      - {name: "since", type: "string"}
      - {name: "verify", type: "bool"}
  - path: serve admin audit checkpoint
    summary: "Write a signed audit checkpoint"
    side_effect: write
    output: document
    json: envelope
    surface: cli-only
    flags:
      - {name: "json", type: "bool", cli_only: true}
      - {name: "pubkey", type: "string"}
  - path: serve admin cert
    summary: "Issue a user mTLS certificate (printed once)"
    side_effect: write
    output: document
    json: envelope
    surface: cli-only
    args: [{name: verb}, {name: principal}]
    flags:
      - {name: "json", type: "bool", cli_only: true}
      - {name: "self", type: "bool"}
      - {name: "ttl", type: "duration", default: "168h0m0s"}
  - path: serve admin roles
    summary: "Grant, revoke or list roles"
    side_effect: destructive
    output: document
    json: envelope
    surface: cli-only
    confirm: {flags: []}
    args: [{name: verb}, {name: principal}]
    flags:
      - {name: "json", type: "bool", cli_only: true}
      - {name: "project", type: "stringSlice"}
      - {name: "role", type: "string"}
      - {name: "self", type: "bool"}
  - path: serve admin token
    summary: "Issue, revoke or list scoped user tokens"
    side_effect: destructive
    output: document
    json: envelope
    surface: cli-only
    confirm: {flags: []}
    args: [{name: verb}, {name: principal}]
    flags:
      - {name: "json", type: "bool", cli_only: true}
      - {name: "project", type: "stringSlice"}
      - {name: "role", type: "string"}
      - {name: "self", type: "bool"}
      - {name: "ttl", type: "duration", default: "0s"}
  - path: serve backup
    summary: "Back up the coordinator data directory"
    side_effect: read
    output: document
    json: envelope
    surface: cli-only
    flags:
      - {name: "data-dir", type: "string"}
      - {name: "json", type: "bool", cli_only: true}
      - {name: "out", type: "string"}
  - path: serve restore
    summary: "Restore the coordinator data directory from a backup"
    side_effect: destructive
    output: interactive
    json: none
    surface: cli-only
    flags:
      - {name: "data-dir", type: "string"}
      - {name: "in", type: "string"}
      - {name: "json", type: "bool", cli_only: true}
      - {name: "kek", type: "string", secret: true}
  - path: serve install
    summary: "Install the watcher service and hourly selftest"
    side_effect: write
    output: document
    json: none
    surface: cli-only
    flags:
      - {name: "launchd", type: "bool"}
      - {name: "systemd", type: "bool"}
      - {name: "user", type: "bool"}
      - {name: "system", type: "bool"}
      - {name: "dry-run", type: "bool"}
      - {name: "binary", type: "string"}
      - {name: "repo", type: "string"}
      - {name: "env-file", type: "string"}
  - path: serve watch
    summary: "Keep commit CI current by polling, without an inbound port"
    side_effect: remote
    output: stream
    json: envelope
    surface: cli-only
    flags:
      - {name: "interval", type: "duration", default: "0s"}
      - {name: "json", type: "bool", cli_only: true}
      - {name: "once", type: "bool"}
      - {name: "repos", type: "stringSlice"}
  - path: serve uninstall
    summary: "Remove unchanged watcher service files"
    side_effect: destructive
    output: document
    json: none
    surface: cli-only
    flags:
      - {name: "launchd", type: "bool"}
      - {name: "systemd", type: "bool"}
      - {name: "user", type: "bool"}
      - {name: "system", type: "bool"}
      - {name: "dry-run", type: "bool"}
      - {name: "binary", type: "string"}
      - {name: "repo", type: "string"}
      - {name: "env-file", type: "string"}
