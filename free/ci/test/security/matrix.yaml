# P7-TRUST-17 matrix: item -> test. matrix_test.go checks it: every `test:` names a function of this
# package, every `proof:` names a function that exists in the module package beside it, every item and
# every threat row of hq architecture/ci-threat-model.md has a case, and every test of the suite is
# named here. A `test:` line is a case this suite runs; `proof:` is an existing test of the owning
# Ticket; `owner:` is the Ticket whose own acceptance carries the proof (its test lives in another repo,
# on another host class or in a Ticket not yet merged).
version: 1
scenarios:
  - id: scenario-7
    item: public fork PR is untrusted, gets no secrets, runs on a hosted-disposable fake or gVisor with no LAN only, approval bound to the head SHA
    cases:
      - test: TestScenario7_PublicForkPR
      - test: TestScenario7_OnlyLANNodeLeft
      - test: TestScenario7_NoGVisorNoHostedWaits
      - test: TestApprovalBoundToHeadSHA
  - id: scenario-8
    item: private-infrastructure work never reaches a hosted provider under LAN saturation. The gate is placement, so no job, source checkout, artifact, cache entry or log is ever sent to the provider (the delivery and the provider fake are asserted empty)
    cases:
      - test: TestScenario8_PrivateNeverHosted
      - test: TestScenario8_LocalOnlyStaysOnPersonalNode
directive_items:
  - id: untrusted-pr-no-lan-no-secrets
    item: untrusted PR cannot reach the trusted LAN or protected secrets
    cases:
      - test: TestScenario7_PublicForkPR
      - test: TestUntrustedNeverReceivesSecret
      - test: TestSecretNeverOnAHostedOrUntrustedRunner
      - test: TestUntrustedNetworkScopeFloor
  - id: private-only-never-external
    item: private-only work never leaves private infrastructure
    cases:
      - test: TestScenario8_PrivateNeverHosted
      - test: TestPlantedPRCannotAuthorizeHosted
      - test: TestNoRequestReachesTelemetry
  - id: scoped-runner-credentials
    item: runner credentials are scoped (a node certificate is not a user certificate, a signature is bound to the lease holder)
    cases:
      - test: TestNodeCertRefusedByAdminAPI
      - test: TestNodeListenerRefusesForeignAndRevokedCerts
      - test: TestForgedEvidenceRefused
  - id: revoked-runner-no-jobs
    item: a revoked runner gets no jobs
    cases:
      - test: TestRevokedNodeGetsNoJob
      - test: TestNodeListenerRefusesForeignAndRevokedCerts
  - id: log-redaction
    item: log redaction
    cases:
      - test: TestSecretValueNeverInOutput
      - test: TestContainerGetsSecretNamesOnly
  - id: no-workspace-leakage
    item: no workspace leakage between attempts
    cases:
      - test: TestWorkspaceHygieneBetweenAttempts
      - test: TestPerSlotUIDSeparation
  - id: artifacts-authorized
    item: artifacts stay authorized
    cases:
      - test: TestArtifactsStayAuthorized
  - id: cache-respects-trust
    item: the cache respects trust
    cases:
      - test: TestCacheRespectsTrust
  - id: no-isolation-downgrade
    item: no isolation downgrade
    cases:
      - test: TestRetryNeverLowersIsolation
      - test: TestScenario7_NoGVisorNoHostedWaits
  - id: forged-stale-evidence
    item: forged or stale evidence cannot pass a current-revision gate
    cases:
      - test: TestStaleEvidenceNeverSatisfiesGate
      - test: TestForgedEvidenceRefused
      - test: TestSelfReportedAndUnverifiableEvidenceNeverGates
  - id: authenticated-webhooks
    item: webhooks and provider requests are authenticated
    cases:
      - test: TestWebhookAuthenticity
      - test: TestRecordedForkPRToClassToPlacement
  - id: authorized-control-plane
    item: control-plane operations are authorized
    cases:
      - test: TestMemberCannotRunControlPlaneActions
      - test: TestRunApprovalNeedsAnotherPerson
      - test: TestRevokedTokenEndsAccess
      - test: TestDecisionsAreAuditedAndTamperEvident
  - id: prod-infra-ineligible
    item: production infrastructure is CI-ineligible by default
    cases:
      - test: TestDeployHostNeverSelectedWithoutOverride
      - test: TestDeployHostPlacementThroughDispatcher
      - test: TestCoordinatorHostFloor
review_additions:
  - id: dispatcher-invariants
    item: I01, I03 and I07 through invariants.CheckDispatcher against the real dispatcher (R-SEC-22)
    cases:
      - test: TestInvariant_I01
      - test: TestInvariant_I03
      - test: TestInvariant_I07
  - id: planted-pr-policy
    item: a planted PR widening policy (I16)
    cases:
      - test: TestPlantedPRCannotWidenPolicy
      - test: TestPlantedPRCannotAuthorizeHosted
      - test: TestRevisionMayTighten
  - id: payload-to-class
    item: recorded payload to facts to class, end to end (P7-HOST-05)
    cases:
      - test: TestRecordedForkPRToClassToPlacement
  - id: approval-voided-by-push
    item: approval voided by a push
    cases:
      - test: TestApprovalBoundToHeadSHA
      - test: TestApprovalDoesNotTravel
  - id: revoked-node-no-job
    item: revoked node gets no job
    cases:
      - test: TestRevokedNodeGetsNoJob
  - id: node-cert-admin-api
    item: node certificate refused by the admin API
    cases:
      - test: TestNodeCertRefusedByAdminAPI
  - id: untrusted-exclusion-onlink
    item: untrusted cannot reach an exclusion address or an on-link prefix (I18)
    cases:
      - test: TestUntrustedCannotReachExclusionOrOnLink
  - id: telemetry-zero
    item: no request reaches a telemetry fake from the plugin or the agent in any mode (X15)
    cases:
      - test: TestNoRequestReachesTelemetry
      - test: TestNoTelemetryClientInTheProduct
  - id: publication-profile
    item: publication profile on a public fixture
    cases:
      - test: TestPublicationProfileOnPublicFixture
  - id: cotenancy
    item: untrusted never beside a secret-bearing attempt on one node
    cases:
      - test: TestCotenancyUntrustedNeverBesideSecrets
  - id: uid-separation
    item: per-slot UID separation
    cases:
      - test: TestPerSlotUIDSeparation
  - id: lease-holder-signature
    item: lease-holder-bound signatures
    cases:
      - test: TestForgedEvidenceRefused
  - id: approval-checkout-binding
    item: approval-to-checkout binding
    cases:
      - test: TestApprovalBindsLeaseCheckout
      - test: TestUntrustedRunWithNoFactsIsHeld
