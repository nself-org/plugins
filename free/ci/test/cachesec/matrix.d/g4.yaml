version: 1
cases:
  - id: C18-TEAM-01
    threat: TM-18
    carrier: coordinator
    title: a TEAM member (below the release role) fetches release inputs and a release blob from the coordinator
    expected: refused
    code: E687
    reason: role
    audit: authorize
  - id: C18-TEAM-02
    threat: TM-18
    carrier: coordinator
    title: a release holder of another project asks for this project's release inputs and blob and gets the same E713 body as an unknown run
    expected: refused
    code: E713
    reason: not_found
    audit: authorize
  - id: C17-REL-01
    threat: TM-17
    carrier: local
    title: a release job is submitted after a lockfile appeared since its dependency evidence (stale evidence)
    expected: refused
    code: E715
    reason: deps_stale
    audit: sched_refusal
  - id: C17-REL-02
    threat: TM-17
    carrier: local
    title: a release job is judged on dependency evidence that names another repository
    expected: refused
    code: E715
    reason: deps_mismatch
    audit: sched_refusal
  - id: C17-REL-03
    threat: TM-17
    carrier: local
    title: a release job whose run came from an untrusted source is submitted (untrusted output promoted into a release)
    expected: refused
    code: E715
    reason: trust
    audit: sched_refusal
  - id: C17-REL-04
    threat: TM-17
    carrier: local
    title: a release job whose dependency ran on a remote node with signed-remote evidence is admitted (positive)
    expected: admitted
  - id: C17-REL-05
    threat: TM-17
    carrier: local
    title: the same signed-remote evidence is submitted again after the signing node was revoked
    expected: refused
    code: E715
    reason: deps_invalid
    audit: evidence.revoke
  - id: C17-REL-06
    threat: TM-17
    carrier: local
    title: a published release whose run was quarantined by the revocation of a node that signed its evidence is verified
    expected: refused
    code: E719
    reason: quarantined
    audit: release.quarantine
  - id: C18-SIG-01
    threat: TM-18
    carrier: signer
    title: a release manifest re-signed with a plugins-purpose key (and naming that key) is verified
    expected: refused
    code: E719
    reason: key_purpose
    audit: none
    gap: D-1453
  - id: C18-SIG-02
    threat: TM-18
    carrier: signer
    title: a release manifest re-signed with an agent-purpose key (and naming that key) is verified
    expected: refused
    code: E719
    reason: key_purpose
    audit: none
    gap: D-1453
  - id: C18-SIG-03
    threat: TM-18
    carrier: signer
    title: the signer is asked to sign a manifest whose artifact digest is not a committed record of the run
    expected: refused
    code: E717
    reason: digest_not_committed
    audit: none
    gap: D-1453
  - id: C18-SIG-04
    threat: TM-18
    carrier: signer
    title: the signer is asked to sign a run while one of its jobs still has a running attempt
    expected: refused
    code: E717
    reason: payload_rejected
    audit: none
    gap: D-1453
  - id: C18-SIG-05
    threat: TM-18
    carrier: signer
    title: an untrusted job asks the secret layer for a release-class secret (the signing key ref itself is refused at parse, E674)
    expected: refused
    code: E677
    reason: untrusted
    audit: none
    gap: D-1453
  - id: C17-REL-07
    threat: TM-17
    carrier: local
    title: a release attempt is submitted twice while the first submission is in flight (at-most-once)
    expected: refused
    code: E715
    reason: duplicate_submission
    audit: none
    gap: D-1453
