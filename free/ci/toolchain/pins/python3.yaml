# Pin source of the toolchain image (P7-CI-43, P7-CI-64). `go generate ./internal/toolchain/...`
# turns every pins/*.yaml into toolchain/versions.yaml; Dockerfile carries the same values.
# CPython comes from python-build-standalone (release 20261013, install_only archives): the
# archives are checksum-pinned, unlike a distro package. Its tags are dates, not versions, so
# the upstream drill has no feed for it and a bump is a manual pin edit.
name: python3
kind: tool
version: "3.13.16"
purpose: python-test checks (python -m pytest, venv for pip projects) and the interpreter uv uses
owner: internal/gates
probe: [python3, --version]
upstream:
  type: none
  ref: ""
sources:
