# Pin source of the toolchain image (P7-CI-43). `go generate ./internal/toolchain/...`
# turns every pins/*.yaml into toolchain/versions.yaml; Dockerfile carries the same values.
name: rust
kind: tool
version: "1.99.1"
purpose: rust.* checks (clippy, test); standalone installer with cargo, clippy and rustfmt
owner: internal/gates
probe: [cargo, --version]
upstream:
  type: rust
  ref: static.rust-lang.org/dist
sources:
  - os: linux
    arch: amd64
    url: https://static.rust-lang.org/dist/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
    sha256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
  - os: linux
    arch: arm64
    url: https://static.rust-lang.org/dist/rust-1.99.1-aarch64-unknown-linux-gnu.tar.xz
    sha256: a48fb1e853be56ce9b8e2751f5464dbd5e16440cd81e237920f3a5e7e806333e
