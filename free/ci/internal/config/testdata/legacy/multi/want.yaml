# Generated by `nself ci config migrate`; review it, then delete the legacy .ci.yaml files.
version: 1
jobs:
  # from .ci.yaml stage go:vet
  retrieval-vet:
    kind: static
    run: [go, vet, ./...]
    timeout: 120s
  # from .ci.yaml stage go:test
  retrieval-test:
    kind: test
    run: [go, test, ./...]
  # from .ci.yaml stage build
  retrieval-build:
    kind: build
    run: [make, build]
    timeout: 600s
  # from free/other/.ci.yaml stage lint
  other-lint:
    kind: static
    run: [npm, run, lint]
    workdir: free/other
    when:
      paths: [free/other/**]
  # legacy env_required (E2E_URL) was not enforced because skip_if_env_missing was false
  # from free/other/.ci.yaml stage e2e
  other-e2e:
    kind: test
    run: [npm, run, e2e]
    workdir: free/other
    timeout: 90s
    when:
      paths: [free/other/**]
  # from free/other/.ci.yaml stage smoke
  other-smoke:
    kind: test
    run: [sh, -c, echo ok]
    workdir: free/other
    required: false
    when:
      paths: [free/other/**]
      env_present: [SMOKE_HOST, SMOKE_TOKEN_REF]
