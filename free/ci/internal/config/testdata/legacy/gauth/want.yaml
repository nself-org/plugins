# Generated by `nself ci config migrate`; review it, then delete the legacy .ci.yaml files.
version: 1
jobs:
  # from free/plugin-gauth/.ci.yaml stage rust:clippy
  gauth-clippy:
    kind: static
    run: [cargo, clippy, --all-targets, --all-features, --, --deny, warnings]
    workdir: free/plugin-gauth
    timeout: 180s
    when:
      paths: [free/plugin-gauth/**]
  # from free/plugin-gauth/.ci.yaml stage rust:test
  gauth-test:
    kind: test
    run: [cargo, test, --all-features]
    workdir: free/plugin-gauth
    timeout: 300s
    when:
      paths: [free/plugin-gauth/**]
  # from free/plugin-gauth/.ci.yaml stage rust:integration
  gauth-integration:
    kind: test
    run: [cargo, test, --test, integration_refresh, --all-features]
    workdir: free/plugin-gauth
    timeout: 300s
    required: false
    when:
      paths: [free/plugin-gauth/**]
      env_present: [NSELF_DB_URL, GAUTH_ENCRYPTION_KEY]
