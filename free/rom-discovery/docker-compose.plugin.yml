services:
  rom-discovery:
    build:
      context: ${NSELF_PLUGIN_DIR}/rom-discovery
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_rom-discovery
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3125:3125"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3125"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3125/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
