services:
  sports:
    build:
      context: ${NSELF_PLUGIN_DIR}/sports
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_sports
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3126:3126"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3126"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3126/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
