services:
  meetings:
    build:
      context: ${NSELF_PLUGIN_DIR}/meetings
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_meetings
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3130:3130"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3130"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3130/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
