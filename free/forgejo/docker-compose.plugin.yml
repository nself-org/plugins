# NSELF-FIRST EXCEPTION: plugin-fragment — hand-authored plugin service definition, merged by `nself build`. Not side-channel.
#
# Forgejo git forge — ops profile plugin
# Port:  3844 (HTTP)  ·  3222 (SSH)  ·  F10-PORT-REGISTRY
# Profile: ops  (include via nself build --profile ops)
#
# Trust model (ADR 0027, Epic TRUST D22): this stack runs NO CI job code. There is
# no in-stack runner and no Docker socket mount. Forgejo Actions stays enabled so
# an external runner on a CI node that is not a deploy host can register (README).
#
# Auto-bootstrap (zero manual steps):
#   forgejo-init runs once after Forgejo is healthy and creates the admin user
#   (idempotent — safe to re-run).
#
# Resource limits:
#   - forgejo:        mem=512m  cpu=1.0  (idle ~80MB)
#   - forgejo-init:   mem=128m  cpu=0.25 (short-lived bootstrap)
#
# Required env vars (set in .env or pass via nself secrets):
#   NSELF_FORGEJO_ADMIN_USER          — Forgejo admin username (first boot)
#   NSELF_FORGEJO_ADMIN_PASSWORD      — Forgejo admin password (min 8 chars)
#   NSELF_FORGEJO_ADMIN_EMAIL         — Forgejo admin email address
#
# Optional env vars (defaults shown):
#   FORGEJO_HTTP_PORT=3844
#   FORGEJO_SSH_PORT=3222
#   FORGEJO_DOMAIN=localhost
#   FORGEJO_DISABLE_REGISTRATION=true   (false opens self-service sign-up)

services:

  # ─── Forgejo server ────────────────────────────────────────────────────────
  forgejo:
    image: codeberg.org/forgejo/forgejo:9.0.3@sha256:3c34f11fe8b9983096eef3f8f25c2d2c21c4ae7504960cb203f0b075d1d8ed73
    container_name: ${COMPOSE_PROJECT_NAME:-nself}_forgejo
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      # Double-underscore env vars are the Forgejo/Gitea config injection mechanism.
      # See: https://forgejo.org/docs/latest/admin/config-cheat-sheet/
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: ${FORGEJO_DOMAIN:-localhost}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: "http://${FORGEJO_DOMAIN:-localhost}:${FORGEJO_HTTP_PORT:-3844}/"
      GITEA__server__SSH_DOMAIN: ${FORGEJO_DOMAIN:-localhost}
      GITEA__server__SSH_PORT: "${FORGEJO_SSH_PORT:-3222}"
      # Built-in git-over-SSH is disabled by default: CI clones over HTTPS and an
      # external Actions runner doesn't need it, and the embedded SSH server's :22 bind can
      # collide. Set FORGEJO_ENABLE_SSH=true (+ re-add the SSH port mapping) to enable.
      GITEA__server__START_SSH_SERVER: "${FORGEJO_ENABLE_SSH:-false}"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__BUILTIN_SSH_SERVER_USER: git
      GITEA__security__INSTALL_LOCK: "true"
      # Closed by default; FORGEJO_DISABLE_REGISTRATION=false opens self-service sign-up.
      GITEA__service__DISABLE_REGISTRATION: "${FORGEJO_DISABLE_REGISTRATION:-true}"
      GITEA__log__LEVEL: Warn
      # Forgejo Actions must be explicitly enabled; jobs run on external runners only.
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: "https://code.forgejo.org"
    ports:
      - "127.0.0.1:${FORGEJO_HTTP_PORT:-3844}:3000"
      - "127.0.0.1:${FORGEJO_SSH_PORT:-3222}:22"
    volumes:
      - forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - ${DOCKER_NETWORK}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Bootstrap init container ──────────────────────────────────────────────
  # restart: "no"  — runs exactly once per stack lifecycle.
  # forgejo-init completes when forgejo-bootstrap.sh exits 0 (admin user created).
  forgejo-init:
    image: codeberg.org/forgejo/forgejo:9.0.3@sha256:3c34f11fe8b9983096eef3f8f25c2d2c21c4ae7504960cb203f0b075d1d8ed73
    container_name: ${COMPOSE_PROJECT_NAME:-nself}_forgejo_init
    restart: "no"
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      NSELF_FORGEJO_ADMIN_USER: ${NSELF_FORGEJO_ADMIN_USER}
      NSELF_FORGEJO_ADMIN_PASSWORD: ${NSELF_FORGEJO_ADMIN_PASSWORD}
      NSELF_FORGEJO_ADMIN_EMAIL: ${NSELF_FORGEJO_ADMIN_EMAIL}
    volumes:
      - forgejo_data:/data
      # Anchored on the plugin dir: a relative ./ path would resolve against the first -f file (the project).
      - ${NSELF_PLUGIN_DIR:-.}/forgejo/forgejo-bootstrap.sh:/forgejo-bootstrap.sh:ro
    networks:
      - ${DOCKER_NETWORK}
    entrypoint: ["/bin/sh", "/forgejo-bootstrap.sh"]
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  forgejo_data:
    name: ${COMPOSE_PROJECT_NAME:-nself}_forgejo_data

# ─── Networks ─────────────────────────────────────────────────────────────────
# The project network comes from the main compose file (${DOCKER_NETWORK});
# nself build merges this fragment into it. This plugin declares no network of its own.
