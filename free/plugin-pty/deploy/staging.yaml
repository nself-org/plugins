# plugin-pty staging deploy config — nself-first, DO NOT hand-edit
# Applied by: nself plugin install plugin-pty --env staging
# Target:     167.235.233.65 (nSelf staging server)
# Ticket:     P4-E7-W3-S21-T09

service:
  name: nself-ai-cc
  plugin: plugin-pty
  env: staging
  port: 3760
  # Note: plugin.json declares default port 9100; staging uses 3760 per F10-PORT-REGISTRY.md.
  # CLAWDE_PTY_PORT overrides PTY_PORT at deploy time (see env block below).
  health_path: /health
  health_interval: 30s
  health_timeout: 5s
  restart_policy: on-failure

env:
  # Required
  NSELF_DB_URL: "${NSELF_STAGING_DB_URL}"
  NSELF_LICENSE_KEY: "${NSELF_PLUGIN_LICENSE_KEY_OWNER}"
  # Port override — staging uses 3760 (F10-PORT-REGISTRY.md)
  PTY_PORT: "3760"
  CLAWDE_PTY_PORT: "3760"
  # Pool limits — conservative for staging
  PTY_MAX_PER_TENANT: "5"
  PTY_SESSION_TIMEOUT_SECS: "300"

resources:
  cpu_shares: 512
  memory_limit: "256m"
  pids_limit: 64

# nself-first: no direct docker-compose. nself CLI applies this config.
