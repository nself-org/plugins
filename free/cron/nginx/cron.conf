# nself-cron: nginx reverse proxy config
#
# nself build copies this file into nginx/sites/, which the main nginx
# includes at http{} level, so it is a full server block. It serves the
# cron plugin API at cron.${BASE_DOMAIN} and reaches the plugin by its compose
# service name (plugin-cron) on the project network, never the loopback address.
# Only /v1/ is exposed.

server {
    listen 443 ssl;
    http2 on;
    server_name cron.${BASE_DOMAIN};

    ssl_certificate /etc/nginx/ssl/${SSL_DIR}/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/${SSL_DIR}/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://plugin-cron:3051;

    location /v1/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 1m;
    }
}
