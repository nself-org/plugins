# NSELF-FIRST EXCEPTION: plugin-fragment — hand-authored plugin service definition, merged by `nself build`. Not side-channel.
services:
  audit-log:
    build:
      context: ${NSELF_PLUGIN_DIR}/../..
      dockerfile: free/audit-log/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_audit_log
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3308"
      PLUGIN_INTERNAL_SECRET: ${PLUGIN_INTERNAL_SECRET:-}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-}
    ports:
      - "127.0.0.1:3308:3308"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3308/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${PLUGIN_AUDIT_LOG_MEMORY:-256m}
          cpus: '${PLUGIN_AUDIT_LOG_CPU:-0.5}'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
