# np_embeddings — BGE-M3 vector embeddings (plugin-retrieval E7)
#
# Multi-App Isolation Convention: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id":{"_eq":"X-Hasura-Source-Account-Id"}}
# Note: vector(1024) column not exposed via GraphQL (pgvector not yet supported in Hasura GQL)

- table:
    schema: public
    name: np_embeddings
  select_permissions:
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
    - role: nself_operator
      permission:
        columns: [id, source_account_id, content_id, content_type, created_at]
        filter: {}
    - role: nself_user
      permission:
        columns: [id, source_account_id, content_id, content_type, created_at]
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  insert_permissions:
    - role: nself_operator
      permission:
        columns: [source_account_id, content_id, content_type]
        check: {}
  update_permissions:
    - role: nself_operator
      permission:
        columns: [content_type]
        filter: {}
        check: {}
  delete_permissions:
    - role: nself_admin
      permission:
        filter: {}
    - role: nself_operator
      permission:
        filter: {}
