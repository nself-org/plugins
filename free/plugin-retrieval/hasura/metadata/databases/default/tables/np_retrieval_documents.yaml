# np_retrieval_documents — text corpus for tsvector BM25 search (plugin-retrieval port 3825)
#
# Multi-App Isolation Convention: source_account_id TEXT NOT NULL DEFAULT 'primary'
# Row filter: {"source_account_id":{"_eq":"X-Hasura-Source-Account-Id"}}

- table:
    schema: public
    name: np_retrieval_documents
  select_permissions:
    - role: nself_admin
      permission:
        columns: '*'
        filter: {}
        allow_aggregations: true
    - role: nself_user
      permission:
        columns: [id, source_account_id, title, content, created_at, updated_at]
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  insert_permissions:
    - role: nself_user
      permission:
        columns: [id, source_account_id, title, content]
        check:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
  update_permissions:
    - role: nself_user
      permission:
        columns: [title, content, updated_at]
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
        check: {}
  delete_permissions:
    - role: nself_user
      permission:
        filter:
          source_account_id:
            _eq: X-Hasura-Source-Account-Id
