services:
  workflows:
    build:
      context: ${NSELF_PLUGIN_DIR}/workflows
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_workflows
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "127.0.0.1:3712:3712"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3712"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3712/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
